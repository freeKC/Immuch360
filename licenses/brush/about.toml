# cargo about for the Brush that Immuch360 Desktop ships (.github/desktop/ai/brush_build.py about): the licences of
# every crate built into brush_app (without its default features, for the target of the job), read from the crates
# themselves (the command runs --frozen: no web service is asked); the same list as deny.toml, in the order of
# preference when a crate offers a choice
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
