name: media_kit_libs_windows_video
description: Windows package providing video (& audio) native libraries for package:media_kit.
# Copy of media_kit_libs_windows_video from github.com/media-kit/media-kit at c533e446755f51cf53c7e57aea873f2aa5355f81,
# used by Immuch360 Desktop through dependency_overrides in mobile/pubspec.yaml; the changes are listed in
# IMMUCH360-NOTE.md
publish_to: 'none'
version: 1.0.12+immuch360
homepage: https://github.com/media-kit/media-kit.git
repository: https://github.com/media-kit/media-kit.git
environment:
  sdk: ^3.6.0
  flutter: ">=3.27.4"
dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: MediaKitLibsWindowsVideoPluginCApi
