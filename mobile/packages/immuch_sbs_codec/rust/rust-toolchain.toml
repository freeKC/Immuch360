# The channel of upstream's native/crates/native_core_ffi/rust-toolchain.toml and of mobile/mise.toml, so that the
# toolchain the desktop jobs install for native_core builds this crate too. The desktop targets only: the hook of
# immuch_sbs_codec builds nothing for the phones (hook/build.dart).
[toolchain]
channel = "1.98.0"
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
