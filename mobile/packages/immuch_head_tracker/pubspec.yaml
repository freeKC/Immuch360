name: immuch_head_tracker
description: The webcam head tracker of Spatial 2.5D on Windows for Immuch360 Desktop (Media Foundation and libfacedetection, through dart:ffi).
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter

# Windows only: the phone builds never list it among their plugins, and Linux and macOS have no tracker yet (the
# README marks Spatial 2.5D there as not available). An FFI plugin: Flutter builds and bundles the three DLLs, nothing
# is registered with the engine.
flutter:
  plugin:
    platforms:
      windows:
        ffiPlugin: true
