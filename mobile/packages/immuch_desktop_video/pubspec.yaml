name: immuch_desktop_video
description: What the hardware video decoder of the GPU in use takes on Windows (Direct3D 11 decoder profiles, sizes and rates), for Immuch360 Desktop.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter

# Windows only: the phone builds never list it among their plugins, and Linux and macOS answer from a static rule in
# the app until their probes exist (plan 20, phase 4). An FFI plugin: Flutter builds and bundles the DLL, nothing is
# registered with the engine.
flutter:
  plugin:
    platforms:
      windows:
        ffiPlugin: true
