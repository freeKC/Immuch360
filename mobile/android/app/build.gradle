plugins {
  alias(libs.plugins.android.application)
  alias(libs.plugins.kotlin.android)
  id "dev.flutter.flutter-gradle-plugin"
  alias(libs.plugins.ksp)
  alias(libs.plugins.kotlin.serialization)
  alias(libs.plugins.kotlin.compose)
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
  keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
  compileSdk = flutter.compileSdkVersion
  ndkVersion = flutter.ndkVersion

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
    coreLibraryDesugaringEnabled true
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  sourceSets {
    main.java.srcDirs += 'src/main/kotlin'
  }

  buildFeatures {
    buildConfig true
    compose true
  }

  defaultConfig {
    applicationId "com.aprogsys.immuch360"
    minSdk = 26
    targetSdk = flutter.targetSdkVersion
    versionCode flutter.versionCode
    versionName flutter.versionName
    resValue "string", "app_name", "Immuch360"
    // Android TV and Google TV launcher entry; added to the map, which already holds Flutter's applicationName (a
    // plain = would drop it)
    manifestPlaceholders += [tvLauncherCategory: "android.intent.category.LEANBACK_LAUNCHER"]
  }

  // Two store flavours of the same app: "phone" for Google Play and the GitHub releases, "quest" for the Meta
  // Horizon Store, whose upload checks refuse a target SDK above 34, the MANAGE_MEDIA and background location
  // permissions and 32 bit libraries (see src/quest/AndroidManifest.xml)
  flavorDimensions = ["store"]
  productFlavors {
    phone {
      dimension "store"
    }
    quest {
      dimension "store"
      targetSdk = 34
      // No TV entry in the Horizon Store build: the headset has no TV launcher and its upload checks are unknown there
      manifestPlaceholders += [tvLauncherCategory: "android.intent.category.DEFAULT"]
      // The version of LiteRT, the engine of the AI relief, written once in the version catalogue: the parity check
      // of the GPU keys its decisions on it (relief/DepthEstimators.kt of src/quest)
      buildConfigField "String", "LITERT_VERSION", "\"${libs.versions.litert.get()}\""
      // The R8 rules of LiteRT, kept out of the phone flavour so that they hide nothing there
      proguardFile 'proguard-quest.pro'
    }
  }

  // The splat module of the Meta Spatial SDK (questImplementation below) carries the zlib of the SDK itself, the same
  // file byte for byte (libthird-party_zlib_1_3_1_z.so, SHA-256 1bc681cf...7138 in both AARs 0.14.0): one copy goes in
  // the APK. The phone flavour has one copy only, which this leaves as it is.
  packagingOptions {
    jniLibs {
      pickFirsts += ['lib/arm64-v8a/libthird-party_zlib_1_3_1_z.so']
    }
  }

  // The Horizon Store build is 64 bit only: pass -Parm64only=true (flutter build apk --android-project-arg
  // arm64only=true) to drop the other native libraries that plugins ship. A flavour level ndk abiFilters cannot
  // be used, it conflicts with Flutter's split per ABI builds of the phone flavour.
  if (project.hasProperty('arm64only')) {
    packagingOptions {
      jniLibs {
        excludes += ['**/armeabi-v7a/**', '**/x86/**', '**/x86_64/**']
      }
    }
  }

  signingConfigs {
    release {
      def keyAliasVal = System.getenv("ALIAS")
      def keyPasswordVal = System.getenv("ANDROID_KEY_PASSWORD")
      def storePasswordVal = System.getenv("ANDROID_STORE_PASSWORD")

      keyAlias keyAliasVal ?: keystoreProperties['keyAlias']
      keyPassword keyPasswordVal ?: keystoreProperties['keyPassword']
      storeFile file("../key.jks").exists() ? file("../key.jks") : file(keystoreProperties['storeFile'] ?: '../key.jks')
      storePassword storePasswordVal ?: keystoreProperties['storePassword']
    }
  }

  buildTypes {
    debug {
      applicationIdSuffix '.debug'
      versionNameSuffix '-DEBUG'
    }

    release {
      def hasKeystore = file("../key.jks").exists() && file("../key.jks").length() > 0
      signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      versionNameSuffix "-immuch360"

      def prNumber = System.getenv("PR_NUMBER")
      if (prNumber) {
        applicationIdSuffix ".pr${prNumber}"
        versionNameSuffix "-pr${prNumber}"
        resValue "string", "app_name", "Immich PR ${prNumber}"
      }
    }
  }
  namespace 'app.alextran.immich'
}

// LiteRT 2.3.0 (questImplementation below) is built with Kotlin 2.4, whose class metadata the Kotlin 2.2.20 of the app
// does not read (it reads up to 2.3): with LiteRT on the classpath, every Kotlin compilation of the quest flavour stops
// on "module was compiled with an incompatible version of Kotlin". Those compilations skip the check; the phone
// flavour, which has no LiteRT, keeps it, so another dependency built for a newer Kotlin still stops the phone build.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
  if (name.contains('Quest')) {
    compilerOptions.freeCompilerArgs.add('-Xskip-metadata-version-check')
  }
}

flutter {
  source '../..'
}

dependencies {
  implementation libs.okhttp
  implementation libs.cronet.embedded
  implementation libs.media3.datasource.okhttp
  implementation libs.media3.datasource.cronet
  // 360° video player (SphericalVideoActivity)
  implementation libs.media3.exoplayer
  implementation libs.media3.ui
  // GL effect that maps the two fisheye circles of a raw 360 camera video on the sphere (DualFisheyeEffect)
  implementation libs.media3.effect
  // RTSP live view of the Tapo cameras (CameraLiveView)
  implementation libs.media3.exoplayer.rtsp
  implementation libs.kotlinx.coroutines.android
  implementation libs.work.runtime.ktx
  implementation libs.concurrent.futures
  implementation libs.guava
  implementation libs.glide
  implementation libs.kotlinx.serialization.json

  ksp libs.glide.ksp
  coreLibraryDesugaring libs.desugar.jdk.libs

  //Glance Widget
  implementation libs.glance.appwidget
  implementation libs.gson

  // Glance Configure
  implementation libs.activity.compose
  implementation libs.compose.ui
  implementation libs.compose.ui.tooling
  implementation libs.compose.material3
  implementation libs.lifecycle.runtime.ktx
  implementation libs.material

  // Meta Quest (Horizon OS) immersive viewer for 360 media, only started on Horizon OS
  implementation libs.meta.spatial.sdk.base
  implementation libs.meta.spatial.sdk.toolkit
  implementation libs.meta.spatial.sdk.vr

  // The QR code scanner of "Connect a TV or computer" (sign in with your phone): ZXing, without Google Play services
  implementation libs.zxing.android.embedded

  // The depth model of the AI relief on the Quest (relief/DepthEstimators.kt of src/quest): LiteRT 2.3.0, Apache 2.0,
  // in the quest flavour only, so that the phone APKs keep their size. Its API brings
  // com.google.android.play:ai-delivery (Play Core Software Development Kit Terms of Service, with Google Play
  // services) for the models of Play for On-device AI, which the app never uses: left out, the app ships code under
  // Apache 2.0, MIT or BSD only
  questImplementation(libs.litert) { exclude group: 'com.google.android.play', module: 'ai-delivery' }
  questImplementation(libs.litert.gpu) { exclude group: 'com.google.android.play', module: 'ai-delivery' }

  // The splat module of the Meta Spatial SDK, which reads the Gaussian splat files of other tools (.spz, .ply) on a Quest
  // 3 or 3S (immersive/splat/SplatEngines.kt of src/quest, lot S5): 0.14.0 as the SDK, under the Meta Platform
  // Technologies SDK License, the very text of the SDK already in the APK, whose article 1.6 on Experimental Features
  // applies to this module (licenses/meta-spatial-sdk/README.md). In the quest flavour only, about 1.1 MB, so that the
  // phone APKs keep their size.
  questImplementation libs.meta.spatial.sdk.splat

  testImplementation libs.junit
}

