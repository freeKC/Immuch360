# Store screenshots without a server, iPad, flow 5 of 6: the account sheet of a session without a server, "This device
# only", over the Library tab.
appId: com.aprogsys.immuch360.dev.debug
---
- launchApp
- extendedWaitUntil:
    visible: ".*Library.*"
    timeout: 60000
# A system prompt the first flow left unanswered comes back at each launch
- tapOn:
    text: "Allow"
    optional: true
# The Library tab, again when a tap gets lost (the simulator sometimes cancels a touch); tab labels carry extra
# accessibility text on iOS ("Library, Tab 4 of 4"), hence the regex
- repeat:
    times: 3
    while:
      notVisible: "Network shares"
    commands:
      - tapOn:
          text: ".*Library.*"
          optional: true
      - extendedWaitUntil:
          visible: "Network shares"
          timeout: 10000
          optional: true
- waitForAnimationToEnd:
    timeout: 5000
# The face icon at the right end of the app bar has no label: its button spans x 976 to 1024 and y 36 to 84 points.
# The title of the sheet is read out with its description, hence the regex.
- repeat:
    times: 3
    while:
      notVisible: "This device only.*"
    commands:
      - tapOn:
          point: "97%,4%"
      - extendedWaitUntil:
          visible: "This device only.*"
          timeout: 10000
          optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: i07-this-device-only
