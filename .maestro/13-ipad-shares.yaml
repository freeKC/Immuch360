# Store screenshots without a server, iPad, flow 4 of 6: the network shares page, then what "Add a share" offers.
appId: com.aprogsys.immuch360.dev.debug
---
- launchApp
- extendedWaitUntil:
    visible: ".*Library.*"
    timeout: 60000
# A system prompt the first flow left unanswered comes back at each launch
- tapOn:
    text: "Allow"
    optional: true
# The Library tab, again when a tap gets lost (the simulator sometimes cancels a touch); tab labels carry extra
# accessibility text on iOS ("Library, Tab 4 of 4"), hence the regex
- repeat:
    times: 3
    while:
      notVisible: "Network shares"
    commands:
      - tapOn:
          text: ".*Library.*"
          optional: true
      - extendedWaitUntil:
          visible: "Network shares"
          timeout: 10000
          optional: true
- repeat:
    times: 3
    while:
      notVisible: "Add a share"
    commands:
      - tapOn:
          text: "Network shares"
          optional: true
      - extendedWaitUntil:
          visible: "Add a share"
          timeout: 10000
          optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: i05a-network-shares
# The + of the app bar or the button under the empty list: same label, same sheet
- repeat:
    times: 3
    while:
      notVisible: "A Tapo camera"
    commands:
      - tapOn:
          text: "Add a share"
          optional: true
      - extendedWaitUntil:
          visible: "A Tapo camera"
          timeout: 10000
          optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: i05-network-shares-add
