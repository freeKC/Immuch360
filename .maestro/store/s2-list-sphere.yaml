# App Store captures, flow 2: the 360° list of the device with its filters, the first item (The Sky Is On Fire, the
# newest 360° photo) as a sphere, then the list filtered on 3D and on videos, and the 360° video playing.
# LIST_TILE: the middle of the first tile of the list, in percent of the screen.
appId: com.aprogsys.immuch360.dev.debug
---
- launchApp
- extendedWaitUntil:
    visible: ".*(Library|Bibliothèque).*"
    timeout: 90000
- tapOn:
    text: "(Allow|Autoriser)"
    optional: true
- repeat:
    times: 3
    while:
      notVisible: "(Network shares|Partages réseau)"
    commands:
      - tapOn:
          text: ".*(Library|Bibliothèque).*"
          optional: true
      - extendedWaitUntil:
          visible: "(Network shares|Partages réseau)"
          timeout: 10000
          optional: true
- repeat:
    times: 3
    while:
      notVisible: ".*[0-9]+ (items?|éléments?).*"
    commands:
      - tapOn:
          text: "360°"
          optional: true
      - extendedWaitUntil:
          visible: ".*[0-9]+ (items?|éléments?).*"
          timeout: 15000
          optional: true
- extendedWaitUntil:
    visible: "never shown 0f3a"
    timeout: 12000
    optional: true
- takeScreenshot: s03-list
# The first tile: the viewer opens above the list, whose texts then leave the accessibility tree
- repeat:
    times: 3
    while:
      visible: ".*[0-9]+ (items?|éléments?).*"
    commands:
      - tapOn:
          point: "${LIST_TILE}"
      - extendedWaitUntil:
          notVisible: ".*[0-9]+ (items?|éléments?).*"
          timeout: 10000
          optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s04-viewer-first
# A flat viewer (its bottom bar has Share) turns to the sphere by its 360° button
- repeat:
    times: 3
    while:
      notVisible: "(Close|Fermer)"
    commands:
      - runFlow:
          when:
            visible: "(Share|Partager)"
          commands:
            - tapOn:
                text: "360°"
                optional: true
      - extendedWaitUntil:
          visible: "(Close|Fermer)"
          timeout: 10000
          optional: true
- extendedWaitUntil:
    visible: ".*(Field of view|Champ de vision).*"
    timeout: 30000
    optional: true
- extendedWaitUntil:
    visible: "never shown 0f3a"
    timeout: 4000
    optional: true
- takeScreenshot: s04-sphere-a
- extendedWaitUntil:
    visible: "never shown 0f3a"
    timeout: 3000
    optional: true
- takeScreenshot: s04-sphere-b
# The same sphere turned a little each way, in case the initial view is not the one of the file
- swipe:
    start: "60%,55%"
    end: "40%,55%"
    duration: 1500
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: s04-sphere-c
- swipe:
    start: "30%,55%"
    end: "70%,55%"
    duration: 1500
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: s04-sphere-d
- repeat:
    times: 3
    while:
      visible: "(Close|Fermer)"
    commands:
      - tapOn:
          text: "(Close|Fermer)"
          optional: true
      - waitForAnimationToEnd:
          timeout: 4000
# Back on the list: the 3D items, then the videos
- extendedWaitUntil:
    visible: ".*[0-9]+ (items?|éléments?).*"
    timeout: 15000
    optional: true
- tapOn:
    text: "3D"
    optional: true
- extendedWaitUntil:
    visible: "never shown 0f3a"
    timeout: 5000
    optional: true
- takeScreenshot: s05-list-3d
- tapOn:
    text: "3D"
    optional: true
- tapOn:
    text: "(Videos|Vidéos)"
    optional: true
- extendedWaitUntil:
    visible: "never shown 0f3a"
    timeout: 5000
    optional: true
- takeScreenshot: s05-list-videos
- repeat:
    times: 3
    while:
      visible: ".*[0-9]+ (items?|éléments?).*"
    commands:
      - tapOn:
          point: "${LIST_TILE}"
      - extendedWaitUntil:
          notVisible: ".*[0-9]+ (items?|éléments?).*"
          timeout: 10000
          optional: true
- extendedWaitUntil:
    visible: "never shown 0f3a"
    timeout: 6000
    optional: true
- takeScreenshot: s06-video-a
- tapOn:
    text: "(Play|Lancer)"
    optional: true
- extendedWaitUntil:
    visible: "never shown 0f3a"
    timeout: 4000
    optional: true
- takeScreenshot: s06-video-b
- extendedWaitUntil:
    visible: "never shown 0f3a"
    timeout: 4000
    optional: true
- takeScreenshot: s06-video-c
