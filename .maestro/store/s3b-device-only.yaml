# App Store captures, flow 3b, on the Photos tab: the account sheet of a session without a server, "This device only".
# FACE: the face button the runner read from the screen; FACE_2, FACE_3: guesses in percent.
appId: com.aprogsys.immuch360.dev.debug
---
- tapOn:
    point: "${FACE}"
- extendedWaitUntil:
    visible: "(?s)(This device only|Cet appareil uniquement).*"
    timeout: 8000
    optional: true
- runFlow:
    when:
      notVisible: "(?s)(This device only|Cet appareil uniquement).*"
    commands:
      - tapOn:
          point: "${FACE_2}"
      - extendedWaitUntil:
          visible: "(?s)(This device only|Cet appareil uniquement).*"
          timeout: 8000
          optional: true
- runFlow:
    when:
      notVisible: "(?s)(This device only|Cet appareil uniquement).*"
    commands:
      - tapOn:
          point: "${FACE_3}"
      - extendedWaitUntil:
          visible: "(?s)(This device only|Cet appareil uniquement).*"
          timeout: 8000
          optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s07-device-only
