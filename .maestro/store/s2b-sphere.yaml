# App Store captures, flow 2b, on the 360° list left by flow 2a: its first tile (The Sky Is On Fire, the newest 360°
# photo) opened, then shown as a sphere with the viewer's top bar. TILE: the point the runner read from the screen,
# TILE_2 and TILE_3: guesses in percent, tried when the first one opens nothing.
appId: com.aprogsys.immuch360.dev.debug
---
- tapOn:
    point: "${TILE}"
- extendedWaitUntil:
    notVisible: "(?s).*[0-9]+ (items?|éléments?).*"
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible: "(?s).*[0-9]+ (items?|éléments?).*"
    commands:
      - tapOn:
          point: "${TILE_2}"
      - extendedWaitUntil:
          notVisible: "(?s).*[0-9]+ (items?|éléments?).*"
          timeout: 8000
          optional: true
- runFlow:
    when:
      visible: "(?s).*[0-9]+ (items?|éléments?).*"
    commands:
      - tapOn:
          point: "${TILE_3}"
      - extendedWaitUntil:
          notVisible: "(?s).*[0-9]+ (items?|éléments?).*"
          timeout: 8000
          optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s04-viewer-first
# A flat viewer (its bottom bar has Share) turns to the sphere by its 360° button
- repeat:
    times: 3
    while:
      notVisible: "(Close|Fermer)"
    commands:
      - runFlow:
          when:
            visible: "(Share|Partager)"
          commands:
            - tapOn:
                text: "360°"
                optional: true
      - extendedWaitUntil:
          visible: "(Close|Fermer)"
          timeout: 10000
          optional: true
- extendedWaitUntil:
    visible: "(?s).*(Field of view|Champ de vision).*"
    timeout: 30000
    optional: true
- extendedWaitUntil:
    visible: "never shown 0f3a"
    timeout: 4000
    optional: true
- takeScreenshot: s04-sphere-a
- extendedWaitUntil:
    visible: "never shown 0f3a"
    timeout: 3000
    optional: true
- takeScreenshot: s04-sphere-b
# The same sphere turned a little each way, in case its initial view is not the one of the file
- swipe:
    start: "60%,55%"
    end: "40%,55%"
    duration: 1500
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: s04-sphere-c
- swipe:
    start: "30%,55%"
    end: "70%,55%"
    duration: 1500
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: s04-sphere-d
- repeat:
    times: 3
    while:
      visible: "(Close|Fermer)"
    commands:
      - tapOn:
          text: "(Close|Fermer)"
          optional: true
      - waitForAnimationToEnd:
          timeout: 4000
