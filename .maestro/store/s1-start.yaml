# App Store captures of release 44 (workflow immuch360-ios-captures.yml), flow 1: the first launch, "Use without a
# server", then the device indexed and its 360° files read. English and French labels, the language of the simulator.
# The app was just installed, its access to the photos granted by simctl: no clearState, which would drop that grant.
appId: com.aprogsys.immuch360.dev.debug
---
- launchApp
# iOS asks for the notifications at the first launch, over the welcome page, whose texts then leave the accessibility
# tree: the prompt is answered until the page shows (it may come a while after the launch)
- repeat:
    times: 12
    while:
      notVisible: "(?s)(Use without a server|Utiliser sans serveur).*"
    commands:
      - tapOn:
          text: "(Allow|Autoriser)"
          optional: true
      - extendedWaitUntil:
          visible: "(?s)(Use without a server|Utiliser sans serveur).*"
          timeout: 15000
          optional: true
- extendedWaitUntil:
    visible: "(?s)(Use without a server|Utiliser sans serveur).*"
    timeout: 60000
- extendedWaitUntil:
    visible: "never shown 0f3a"
    timeout: 4000
    optional: true
- tapOn:
    text: "(Allow|Autoriser)"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s01-welcome
- repeat:
    times: 4
    while:
      notVisible: "(?s).*(Library|Bibliothèque).*"
    commands:
      - tapOn:
          text: "(Allow|Autoriser)"
          optional: true
      - tapOn:
          text: "(?s)(Use without a server|Utiliser sans serveur).*"
          optional: true
      - extendedWaitUntil:
          visible: "(?s).*(Library|Bibliothèque).*"
          timeout: 20000
          optional: true
# The photo library, unless the grant held
- tapOn:
    text: "(Allow Full Access|Autoriser l.acc.s complet)"
    optional: true
- tapOn:
    text: "(Allow Access to All Photos|Autoriser l.acc.s . toutes les photos)"
    optional: true
- extendedWaitUntil:
    visible: "(?s).*(Library|Bibliothèque).*"
    timeout: 120000
- tapOn:
    text: "(Allow|Autoriser)"
    optional: true
# Time for the device to be indexed and its 360° files read (a wait on a text that never shows)
- extendedWaitUntil:
    visible: "never shown 0f3a"
    timeout: 45000
    optional: true
- takeScreenshot: s02-timeline-a
- extendedWaitUntil:
    visible: "never shown 0f3a"
    timeout: 20000
    optional: true
- takeScreenshot: s02-timeline-b
