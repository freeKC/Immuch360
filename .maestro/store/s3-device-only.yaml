# App Store captures, flow 3: the account sheet of a session without a server, "This device only", over the Photos tab.
# FACE: the face button at the right end of the app bar, in percent of the screen (it has no label).
appId: com.aprogsys.immuch360.dev.debug
---
- launchApp
- extendedWaitUntil:
    visible: ".*(Library|Bibliothèque).*"
    timeout: 90000
- tapOn:
    text: ".*Photos.*"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- repeat:
    times: 3
    while:
      notVisible: "(This device only|Cet appareil uniquement).*"
    commands:
      - tapOn:
          point: "${FACE}"
      - extendedWaitUntil:
          visible: "(This device only|Cet appareil uniquement).*"
          timeout: 8000
          optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: s07-device-only
