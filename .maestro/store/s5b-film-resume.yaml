# App Store captures, flow 5b, after flow 5a: the app started again (the film page shows no control to a tap on the
# simulator, so the film is left where its page saved it, every 5 s while it played), the film opened again: it
# resumes where it was left and says so for a few seconds ("Resumed at ...").
# SHARE_NAME, FILMS (folder), FILM (the name of the file without its extension).
appId: com.aprogsys.immuch360.dev.debug
---
- launchApp
- tapOn:
    text: "(Allow|Autoriser)"
    optional: true
- extendedWaitUntil:
    visible: "(?s).*(Library|Bibliothèque).*"
    timeout: 120000
- repeat:
    times: 3
    while:
      notVisible: "(Network shares|Partages réseau)"
    commands:
      - tapOn:
          text: "(?s).*(Library|Bibliothèque).*"
          optional: true
      - extendedWaitUntil:
          visible: "(Network shares|Partages réseau)"
          timeout: 10000
          optional: true
- repeat:
    times: 3
    while:
      notVisible: "(${SHARE_NAME}|127\\.0\\.0\\.1).*"
    commands:
      - tapOn:
          text: "(Network shares|Partages réseau)"
          optional: true
      - extendedWaitUntil:
          visible: "(${SHARE_NAME}|127\\.0\\.0\\.1).*"
          timeout: 10000
          optional: true
- repeat:
    times: 3
    while:
      notVisible: "${FILMS}"
    commands:
      - tapOn:
          text: "(${SHARE_NAME}|127\\.0\\.0\\.1).*"
          optional: true
      - extendedWaitUntil:
          visible: "${FILMS}"
          timeout: 20000
          optional: true
- tapOn: "${FILMS}"
- extendedWaitUntil:
    visible: "${FILM}.*"
    timeout: 20000
- extendedWaitUntil:
    visible: "never shown 0f3a"
    timeout: 3000
    optional: true
- takeScreenshot: s10-film-tile
- tapOn: "${FILM}.*"
- takeScreenshot: s11-resumed-a
- extendedWaitUntil:
    visible: "(?s)(Resumed at|Reprise à).*"
    timeout: 10000
    optional: true
- takeScreenshot: s11-resumed-b
- extendedWaitUntil:
    visible: "never shown 0f3a"
    timeout: 1500
    optional: true
- takeScreenshot: s11-resumed-c
