# Store screenshots without a server, iPad, flow 3 of 6: the list of the 360° photos of the device, then the first one
# in the viewer, flat, then as a sphere. Every tap whose effect can be seen is tried again when it got lost.
appId: com.aprogsys.immuch360.dev.debug
---
- launchApp
- extendedWaitUntil:
    visible: ".*Library.*"
    timeout: 60000
# A system prompt the first flow left unanswered comes back at each launch
- tapOn:
    text: "Allow"
    optional: true
# The Library tab, again when a tap gets lost (the simulator sometimes cancels a touch); tab labels carry extra
# accessibility text on iOS ("Library, Tab 4 of 4"), hence the regex
- repeat:
    times: 3
    while:
      notVisible: "Network shares"
    commands:
      - tapOn:
          text: ".*Library.*"
          optional: true
      - extendedWaitUntil:
          visible: "Network shares"
          timeout: 10000
          optional: true
# The 360° entry of the Library opens the list, whose header counts the items
- repeat:
    times: 3
    while:
      notVisible: "[0-9]+ items?"
    commands:
      - tapOn:
          text: "360°"
          optional: true
      - extendedWaitUntil:
          visible: "[0-9]+ items?"
          timeout: 15000
          optional: true
# The three panoramas with GPano tags, once the scan of the device is done
- extendedWaitUntil:
    visible: "3 items"
    timeout: 60000
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: i03-list-360
# First tile of the grid (rooftop_night, the newest of the three), 256 points wide: under the header (332 points), the
# filter chips (56) and the date headers (136), so from y 518 to 774 points. The viewer opens above the list, whose
# texts then leave the accessibility tree.
- repeat:
    times: 3
    while:
      visible: "[0-9]+ items?"
    commands:
      - tapOn:
          point: "12%,47%"
      - extendedWaitUntil:
          notVisible: "[0-9]+ items?"
          timeout: 10000
          optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: i02a-viewer-flat
# The 360° button of the viewer's top bar, exposed through its tooltip, tapped only while the flat viewer shows (its
# bottom bar has Share; the sphere viewer has a Close button, and a "360°" field of view button not to be touched)
- repeat:
    times: 3
    while:
      notVisible: "Close"
    commands:
      - runFlow:
          when:
            visible: "Share"
          commands:
            - tapOn:
                text: "360°"
                optional: true
      - extendedWaitUntil:
          visible: "Close"
          timeout: 10000
          optional: true
# The sphere shows once the photo is decoded, with its "Field of view" button
- extendedWaitUntil:
    visible: ".*Field of view.*"
    timeout: 30000
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: i02-sphere
- runFlow:
    when:
      visible: "Close"
    commands:
      - swipe:
          start: "75%,55%"
          end: "35%,55%"
          duration: 1200
      - waitForAnimationToEnd:
          timeout: 8000
      - takeScreenshot: i02b-sphere-turned
