# Store screenshots without a server, iPad, flow 2 of 6: the Library tab of a session without a server (360°, On this
# device, Network shares, Connect to an Immich server).
appId: com.aprogsys.immuch360.dev.debug
---
- launchApp
- extendedWaitUntil:
    visible: ".*Library.*"
    timeout: 60000
# A system prompt the first flow left unanswered comes back at each launch
- tapOn:
    text: "Allow"
    optional: true
# The Library tab, again when a tap gets lost (the simulator sometimes cancels a touch); tab labels carry extra
# accessibility text on iOS ("Library, Tab 4 of 4"), hence the regex
- repeat:
    times: 3
    while:
      notVisible: "Network shares"
    commands:
      - tapOn:
          text: ".*Library.*"
          optional: true
      - extendedWaitUntil:
          visible: "Network shares"
          timeout: 10000
          optional: true
# The thumbnails of the albums of the device load meanwhile
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: i04-library
