# Store screenshots without a server, iPad, flow 6 of 6: "View as 360°" in the menu of the viewer, on a 2:1 photo
# without 360° tags (added to the photo library last, so the first tile of the Photos tab), then the sphere it opens,
# then the menu once chosen ("Stop treating as 360°"). Last of the flows: the photo is in the 360° list afterwards.
appId: com.aprogsys.immuch360.dev.debug
---
- launchApp
- extendedWaitUntil:
    visible: ".*Library.*"
    timeout: 60000
# A system prompt the first flow left unanswered comes back at each launch
- tapOn:
    text: "Allow"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: i08-photos
# First tile of the Photos tab, 256 points wide: under the app bar (88 points) and the date headers (130), so from
# y 218 to 474 points
- tapOn:
    point: "12%,25%"
# The viewer opens above the tabs, whose labels then leave the accessibility tree
- extendedWaitUntil:
    notVisible: ".*Library.*"
    timeout: 15000
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
# The menu button at the right end of the viewer's top bar has no label: it spans x 984 to 1032 and y 38 to 86 points
- tapOn:
    point: "98%,4%"
- extendedWaitUntil:
    visible: "View as 360°"
    timeout: 10000
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: i06-view-as-360
# Not that photo (a 360° one has no such entry): close the menu, go to the next photo and open its menu
- runFlow:
    when:
      notVisible: "View as 360°"
    commands:
      - tapOn:
          point: "50%,50%"
      - swipe:
          start: "80%,50%"
          end: "20%,50%"
          duration: 400
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn:
          point: "98%,4%"
      - extendedWaitUntil:
          visible: "View as 360°"
          timeout: 10000
          optional: true
      - takeScreenshot: i06-view-as-360-next
- runFlow:
    when:
      visible: "View as 360°"
    commands:
      - tapOn: "View as 360°"
      - extendedWaitUntil:
          visible: ".*Field of view.*"
          timeout: 30000
          optional: true
      - waitForAnimationToEnd:
          timeout: 8000
      - takeScreenshot: i06b-sphere-forced
      # Back to the flat viewer, whose menu now offers to stop treating the photo as 360°
      - tapOn:
          text: "Close"
          optional: true
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn:
          point: "98%,4%"
      - extendedWaitUntil:
          visible: "Stop treating as 360°"
          timeout: 10000
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: i06c-stop-treating
