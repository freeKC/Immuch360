# Opens a known equirectangular photo of the demo server by deep link and taps the 360 button.
appId: com.aprogsys.immuch360.dev.debug
---
- openLink: "immich://asset?id=${ASSET_ID}"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    notVisible: "Server Endpoint URL"
    timeout: 20000
- tapOn:
    text: "Not Now"
    optional: true
# The viewer is open once its 360 button is there
- extendedWaitUntil:
    visible: "360°"
    timeout: 60000
- takeScreenshot: m05-asset-open
# The 360 button sits in the viewer top bar, exposed through its tooltip
- tapOn: "360°"
- extendedWaitUntil:
    notVisible: "Oct"
    timeout: 15000
- takeScreenshot: m06-sphere
- swipe:
    start: "70%,50%"
    end: "30%,50%"
    duration: 800
- takeScreenshot: m07-sphere-after-swipe
- tapOn:
    text: "Gyroscope"
    optional: true
- takeScreenshot: m08-gyro-toggle
