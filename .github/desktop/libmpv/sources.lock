# Commits of the git sources of libmpv-2.dll, read by pin_sources.sh in .github/workflows/immuch360-libmpv.yml.
#
# Why: most packages of the build recipe clone the head of a branch on the day of the run, so two runs of the same
# workflow would build different code, and a bad commit pushed to any of some fifty repositories would reach a
# published DLL unseen. Every git package mpv needs is pinned here; a run stops if one is missing. FFmpeg and mpv are
# not listed: the workflow inputs pin them. Archives (libiconv, the Opus models) are pinned by their SHA-256 in the
# recipe itself.
#
# Updating: a run dispatched with sources=heads (and the quarterly run) builds from the heads, publishes nothing, and
# prints these lines with the commits it used in its summary; review the changes, paste them here and push.
# The toolchain lines (llvm on release/22.x, mingw-w64, cppwinrt) are also the key of the toolchain cache: change them
# by hand, with git ls-remote on the recipe's repository and branch.
#
# Resolved 2026-10-09 with git ls-remote on the repository and branch of each package of the recipe at fdf75129, or
# its GIT_TAG or GIT_RESET when the recipe already pins one.
#
