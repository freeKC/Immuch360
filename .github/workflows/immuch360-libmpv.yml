name: Immuch360 libmpv for Windows and macOS

# Rebuilds libmpv-2.dll (mpv with FFmpeg), the library media_kit plays video with in Immuch360 Desktop, for Windows x64
# and arm64, and publishes both archives with their SHA-256, their licence texts and their sources, as artifacts of the
# run and on a release of its own tag (libmpv-windows-<date>-<run number>). media_kit_libs_windows_video pins that
# release in mobile/packages/media_kit_libs_windows_video/windows/CMakeLists.txt (switch IMMUCH360_LIBMPV_FROM_CI).
#
# Why: media_kit_libs_windows_video downloads media-kit's archive of 2024-10-21 (FFmpeg N-117622), older than the
# FFmpeg security fixes since, for an app that opens files and streams it does not control (plan 20, 2.2 and 2.7;
# design 20, 2.1). The licences are in mobile/packages/media_kit_video/windows/NOTICES.md.
#
# The recipe. media-kit/libmpv-win32-video-cmake, a fork of shinchiro/mpv-winbuild-cmake, cross-compiles mpv and the
# libraries it needs with LLVM and mingw-w64 in an Arch Linux container. Its master became the audio only configuration
# on 2025-12-11 (merge 54b5655: no video decoder, mpv without OpenGL) and its last runs failed; its fork
# Predidit/libmpv-win32-video-cmake keeps the video recipe building on hosted runners (green on 2026-09-15). This
# workflow checks that fork out at a pinned commit and copies the two files of .github/desktop/libmpv/ over it: FFmpeg
# and mpv in media_kit's video configuration, without the fork's own patches (one of them turns TLS certificate
# verification off by default). The recipe, FFmpeg and mpv are inputs, so an FFmpeg security release is one dispatch
# away; the defaults are the commits the fork built green. Every other git package of the recipe would clone the head
# of its branch on the day of the run: the sources and toolchain jobs check each one out at its commit in
# .github/desktop/libmpv/sources.lock (pin_sources.sh), so that a run builds known code and a release always does.
#
# The container. shinchiro/archlinux, the Arch Linux image the recipe is made for, is rebuilt every day and its registry
# keeps only the newest image: a digest of it is gone within a day or two. The image job copies the pinned digest once
# into this repository's own package (ghcr.io/<owner>/libmpv-build, same digest) and every build job pulls it from
# there; when the digest is in neither place, the run stops in its first minute and says what to pin.
#
# Time on hosted runners (4 processors): the toolchain (LLVM with clang and lld, then the mingw-w64 runtime for both
# targets) about 2 to 3 hours when it is not in the cache (the recipe's own toolchain workflow, which builds LLVM twice
# for profile guided optimisation, takes 3.1 to 4.8 hours there); then each architecture, in parallel, about 1 to 3
# hours from cold. The toolchain is cached by recipe commit, so a rerun within a week starts at the libraries. Every job
# stays under the 6 hour limit of hosted jobs; standard runners cost no minutes on a public repository.
#
# Jobs:
#   image      the build container: found in this repository's package, or copied there from shinchiro's
#   sources    the sources of every library mpv needs, downloaded once and checked out at their pins so that both
#              architectures build the same commits; packed for the build jobs, and without git data for the release
#   toolchain  LLVM and the two mingw-w64 sysroots at their pins, from the cache or built
#   libmpv     x86_64 and aarch64: the libraries and libmpv-2.dll, then an archive laid out like media-kit's
#              (libmpv-2.dll, libmpv.dll.a, include/mpv), plus licenses/ and BUILDINFO.txt
#   publish    SHA256SUMS.txt and the release: a pre-release that is never marked latest, so the phone release stays
#              first on the release page; the run summary prints the lines to paste into the CMake of the libs package
#
# macOS (the same policy: the project's own build from pinned sources, published with them). The recipe is
# media-kit/libmpv-darwin-build, the Nix build media_kit_libs_macos_video downloads its frameworks from, checked out at
# a pinned commit (input macos_recipe_ref) with the files of .github/desktop/libmpv-macos/ over it (apply_overlay.sh):
# its own pins stop at FFmpeg 6.0 and mpv 0.36 of 2023, so the overlay brings FFmpeg and mpv to the commits of the
# Windows build (packages.lock.nix there, with libplacebo, which mpv now needs); the other libraries keep the recipe's
# versions. Its default flavor, as media-kit's: mpv with -Dgpl=false, FFmpeg without GPL or nonfree parts, so LGPL. Jobs:
#   macos-sources  every archive of the lock downloaded and checked by its SHA-256, the recipe with the overlay, the
#                  licence texts of each library; packed for the release
#   macos-libmpv   the Nix build on macos-15 with a pinned Xcode, for macOS 12 and later, arm64 and x86_64 in one
#                  universal xcframework per library; the archive, one zip per xcframework for Swift Package Manager,
#                  and BUILDINFO-macos.txt
#   macos-publish  the release libmpv-macos-<date>-<run>, a pre-release never marked latest; the run summary prints the
#                  lines to paste into the Package.swift of mobile/packages/media_kit_libs_macos_video
# The macOS build takes FFmpeg and mpv from packages.lock.nix, never from the ffmpeg_ref and mpv_ref inputs, which are
# the Windows build's (test/desktop/ci/libmpv_macos_pins_test.dart keeps the two at the same commits). The input systems
# runs one of the two only; the quarterly run from the heads is Windows only (the macOS lock has no heads mode).
#
# Triggers: by hand (workflow_dispatch, once this file is on the default branch); every quarter (schedule, default
# branch only), from the head of every library, to show what a refresh of the lock would bring: it publishes nothing
# and its summary prints the new lock lines; pushes to the desktop branch that change this file,
# .github/desktop/libmpv/ (the lock included) or .github/desktop/libmpv-macos/, which is how the first run happens
# before the desktop branch is merged.
# Only a run from pinned sources publishes. No secret is used; two jobs can write: image (packages, the copy of the
# container) and publish (contents, the release).

on:
  workflow_dispatch:
    inputs:
      recipe_repository:
        description: 'Build recipe repository (owner/name)'
        required: false
        default: 'Predidit/libmpv-win32-video-cmake'
        type: string
      recipe_ref:
        description: 'Full commit of the recipe (the toolchain cache is keyed by it)'
        required: false
        default: 'fdf75129fc694b5ca555ce73cffc43bb6943ae13'
        type: string
      ffmpeg_ref:
        description: 'FFmpeg commit or tag, for example n8.1.3'
        required: false
        default: '5b9a3ad71a4b54979e7afc3a1a4269763c4f41fc'
        type: string
      mpv_ref:
        description: 'mpv commit or tag'
        required: false
        default: '0b7ed670f7c353dd3dd4f8ae0fc788a181a15aa6'
        type: string
      sources:
        description: 'pinned: the commits of .github/desktop/libmpv/sources.lock; heads: the head of each library (never published)'
        required: false
        default: pinned
        type: choice
        options:
          - pinned
          - heads
      publish:
        description: 'Publish a release (otherwise the archives stay artifacts of the run)'
        required: false
        default: true
        type: boolean
      systems:
        description: 'Which builds run: both, windows or macos'
        required: false
        default: both
        type: choice
        options:
          - both
          - windows
          - macos
      macos_recipe_ref:
        description: 'macOS: full commit of media-kit/libmpv-darwin-build (FFmpeg and mpv come from .github/desktop/libmpv-macos)'
        required: false
        default: 'aadae8ce295dd15a222839c361c4c984ce9befb2'
        type: string
      macos_target:
        description: 'macOS: the Nix package to build; only the default, the archive, is published'
        required: false
        default: 'mk-out-archive-xcframeworks-macos-universal-video-default'
        type: string
  schedule:
    # First day of each quarter, from the heads (see the header); FFmpeg security releases are dispatched by hand with
    # ffmpeg_ref
    - cron: '17 3 1 1,4,7,10 *'
  push:
    branches: [desktop]
    paths:
      - .github/workflows/immuch360-libmpv.yml
      - .github/desktop/libmpv/**
      - .github/desktop/libmpv-macos/**

permissions:
  contents: read
  packages: read # the build jobs pull their container from this repository's package

# One build at a time: two would share nothing and fight for the toolchain cache; a newer trigger waits
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # Schedules and pushes have no inputs: the defaults below are the same as those of workflow_dispatch
  RECIPE_REPOSITORY: ${{ inputs.recipe_repository || 'Predidit/libmpv-win32-video-cmake' }}
  RECIPE_REF: ${{ inputs.recipe_ref || 'fdf75129fc694b5ca555ce73cffc43bb6943ae13' }}
  FFMPEG_REF: ${{ inputs.ffmpeg_ref || '5b9a3ad71a4b54979e7afc3a1a4269763c4f41fc' }}
  MPV_REF: ${{ inputs.mpv_ref || '0b7ed670f7c353dd3dd4f8ae0fc788a181a15aa6' }}
  # The quarterly run builds from the heads; every other run from sources.lock unless dispatched with heads
  SOURCES_MODE: ${{ github.event_name == 'schedule' && 'heads' || inputs.sources || 'pinned' }}
  # The build container (see the header): its digest, and the registry it was first published to. To pin a new one,
  # take the digest of ghcr.io/shinchiro/archlinux:latest and push within a day, before shinchiro replaces it.
  BUILD_IMAGE_DIGEST: sha256:c7dffe77b57d98b10e327dde12d3977faf4cb90aa7cb4f5eeac4e9d68d724239
  BUILD_IMAGE_UPSTREAM: ghcr.io/shinchiro/archlinux
  # Bump the version when the toolchain job changes what it leaves in the cache
  TOOLCHAIN_CACHE: libmpv-toolchain-v1
  # Meson comes from PyPI, checked by the hashes of .github/desktop/libmpv/meson-requirements.txt
  # macOS (see the header): the recipe, its commit, the package built, and the one Xcode it builds with, named by its
  # version as the desktop workflow names the app's (the same 26.3)
  MACOS_RECIPE_REPOSITORY: media-kit/libmpv-darwin-build
  MACOS_RECIPE_REF: ${{ inputs.macos_recipe_ref || 'aadae8ce295dd15a222839c361c4c984ce9befb2' }}
  MACOS_TARGET: ${{ inputs.macos_target || 'mk-out-archive-xcframeworks-macos-universal-video-default' }}
  MACOS_ARCHIVE_TARGET: mk-out-archive-xcframeworks-macos-universal-video-default
  MACOS_XCODE_VERSION: '26.3'

jobs:
  image:
    name: Build container
    # The first Windows job: the others need it, so a run without Windows skips them all
    if: inputs.systems != 'macos'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      packages: write # copies the pinned image into this repository's package when it is not there yet
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Find the pinned image, or copy it
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$BUILD_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "BUILD_IMAGE_DIGEST: sha256:<64 hex>"; exit 1; }
          own="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/libmpv-build"
          command -v skopeo > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN" > /dev/null
          if skopeo inspect --raw "docker://$own@$BUILD_IMAGE_DIGEST" > /dev/null 2>&1; then
            echo "found: $own@$BUILD_IMAGE_DIGEST"
          elif skopeo inspect --raw "docker://$BUILD_IMAGE_UPSTREAM@$BUILD_IMAGE_DIGEST" > /dev/null 2>&1; then
            # --preserve-digests: the copy keeps the pinned digest, or fails
            skopeo copy --preserve-digests --retry-times 3 \
              "docker://$BUILD_IMAGE_UPSTREAM@$BUILD_IMAGE_DIGEST" "docker://$own:arch-${BUILD_IMAGE_DIGEST:7:12}"
            skopeo inspect --raw "docker://$own@$BUILD_IMAGE_DIGEST" > /dev/null
            echo "copied from $BUILD_IMAGE_UPSTREAM: $own@$BUILD_IMAGE_DIGEST"
          else
            gone="The build image $BUILD_IMAGE_DIGEST is neither in $own nor in $BUILD_IMAGE_UPSTREAM any more."
            gone+=" Pin the digest of $BUILD_IMAGE_UPSTREAM:latest in BUILD_IMAGE_DIGEST and push within a day, before"
            gone+=" it is replaced: skopeo inspect --format '{{.Digest}}' docker://$BUILD_IMAGE_UPSTREAM:latest"
            echo "::error::$gone"
            exit 1
          fi
          echo "image=$own@$BUILD_IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

  sources:
    name: Library sources
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ${{ needs.image.outputs.image }} # zizmor: ignore[unpinned-images] digest pinned by the image job
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      pinned: ${{ steps.pins.outputs.pinned }}
    steps:
      - name: Inputs
        run: |
          # The inputs reach cmake and file names: refuse anything but plain names
          [[ "$RECIPE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "recipe_repository: owner/name"; exit 1; }
          [[ "$RECIPE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "recipe_ref: a full commit"; exit 1; }
          for ref in "$FFMPEG_REF" "$MPV_REF"; do
            [[ "$ref" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "not a commit or tag: $ref"; exit 1; }
          done
          git config --global --add safe.directory '*'

      - name: Release tag
        id: tag
        run: echo "tag=libmpv-windows-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Check out the FFmpeg and mpv files of this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: immuch360
          sparse-checkout: .github/desktop/libmpv

      - name: Check out the recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ env.RECIPE_REPOSITORY }}
          ref: ${{ env.RECIPE_REF }}
          path: recipe

      - name: Meson and the FFmpeg and mpv files
        run: |
          python -m pip --version || pacman -Sy --needed --noconfirm python-pip
          python -m pip install --break-system-packages --require-hashes \
            -r immuch360/.github/desktop/libmpv/meson-requirements.txt
          meson --version
          ninja --version
          cp immuch360/.github/desktop/libmpv/ffmpeg.cmake immuch360/.github/desktop/libmpv/mpv.cmake recipe/packages/

      - name: Download what mpv needs
        run: |
          cmake -DTARGET_ARCH=x86_64-w64-mingw32 -DCOMPILER_TOOLCHAIN=clang \
            -DCMAKE_INSTALL_PREFIX="$PWD/clang_root" -DMINGW_INSTALL_PREFIX="$PWD/build_x86_64/x86_64-w64-mingw32" \
            -DSINGLE_SOURCE_LOCATION="$PWD/src_packages" -DRUSTUP_LOCATION="$PWD/clang_root/install_rustup" \
            -DIMMUCH360_FFMPEG_REF="$FFMPEG_REF" -DIMMUCH360_MPV_REF="$MPV_REF" \
            -G Ninja -B build_x86_64 -S recipe
          # Every package in mpv's dependency graph; arm64 needs the same less the NVIDIA headers
          ninja -C build_x86_64 -t inputs mpv \
            | grep -oE 'packages/[^/]+-prefix/src/[^/]+-stamp/' | sed -E 's#packages/([^/]+)-prefix/.*#\1#' \
            | sort -u > packages.txt
          if ! grep -qx ffmpeg packages.txt || ! grep -qx mpv packages.txt; then
            echo "no mpv dependency graph"
            exit 1
          fi
          mapfile -t downloads < <(sed 's/$/-download/' packages.txt)
          echo "${#downloads[@]} packages"
          ninja -C build_x86_64 "${downloads[@]}"

      - name: Check the sources out at their pins
        id: pins
        run: |
          mapfile -t packages < packages.txt
          bash immuch360/.github/desktop/libmpv/pin_sources.sh immuch360/.github/desktop/libmpv/sources.lock \
            src_packages "$SOURCES_MODE" "${packages[@]}" > pins.txt
          if [ "$SOURCES_MODE" = pinned ]; then
            echo "pinned=true" >> "$GITHUB_OUTPUT"
          else
            echo "pinned=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Library heads of this run (not published)"
              echo
              echo "Lines for \`.github/desktop/libmpv/sources.lock\`, once the changes since the lock are reviewed:"
              echo
              echo '```'
              cat pins.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: List the commits
        run: |
          {
            echo "# package  repository or archive  commit or SHA-256"
            while read -r p; do
              d="src_packages/$p"
              if [ -d "$d/.git" ]; then
                echo "$p $(git -C "$d" remote get-url origin) $(git -C "$d" rev-parse HEAD)"
              else
                for f in "$d"/*.tar.*; do
                  if [ -f "$f" ]; then echo "$p $(basename "$f") $(sha256sum "$f" | cut -d' ' -f1)"; fi
                done
              fi
            done < packages.txt
          } > SOURCES.txt
          cat SOURCES.txt

      - name: Pack the sources
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mapfile -t dirs < <(sed 's#^#src_packages/#' packages.txt)
          # With git data for the build jobs, which check the commits out as they are
          tar -cf - packages.txt SOURCES.txt "${dirs[@]}" | zstd -T0 -3 -q -o build-sources.tar.zst
          # Without it for the release: the corresponding source of the DLL, with the recipe and the FFmpeg and mpv files
          rm -rf recipe/.git
          tar --exclude=.git -cf - SOURCES.txt recipe immuch360/.github/desktop/libmpv "${dirs[@]}" \
            | xz -T0 -6 > "$TAG-sources.tar.xz"
          ls -l build-sources.tar.zst "$TAG-sources.tar.xz"

      - name: Upload the sources for the build jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-sources
          path: build-sources.tar.zst
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

      - name: Upload the sources for the release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sources
          path: ${{ steps.tag.outputs.tag }}-sources.tar.xz
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

  toolchain:
    name: LLVM and mingw-w64
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    container:
      image: ${{ needs.image.outputs.image }} # zizmor: ignore[unpinned-images] digest pinned by the image job
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - name: Check out the pins of this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: immuch360
          sparse-checkout: .github/desktop/libmpv

      - name: Cache key
        id: key
        run: |
          # The toolchain pins are part of the key, so that a new LLVM or mingw-w64 commit builds a new toolchain
          pins=$(awk '$1 == "llvm" || $1 == "mingw-w64" || $1 == "cppwinrt"' \
            immuch360/.github/desktop/libmpv/sources.lock | sort | sha256sum | cut -c1-16)
          echo "key=$TOOLCHAIN_CACHE-$RECIPE_REF-$pins" >> "$GITHUB_OUTPUT"

      - name: Look for it in the cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            clang_root
            build_x86_64
            build_aarch64
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Check out the recipe
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ env.RECIPE_REPOSITORY }}
          ref: ${{ env.RECIPE_REF }}
          path: recipe

      - name: Build LLVM, then the mingw-w64 runtime of each target
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git config --global --add safe.directory '*'
          # The recipe applies its patches with "git am --3way", which records a commit and needs a committer
          git config --global user.name "libmpv build"
          git config --global user.email "libmpv-build@localhost"
          python -m pip --version || pacman -Sy --needed --noconfirm python-pip
          python -m pip install --break-system-packages --require-hashes \
            -r immuch360/.github/desktop/libmpv/meson-requirements.txt
          for bit in x86_64 aarch64; do
            cmake -DTARGET_ARCH="$bit-w64-mingw32" -DCOMPILER_TOOLCHAIN=clang \
              -DCMAKE_INSTALL_PREFIX="$PWD/clang_root" -DMINGW_INSTALL_PREFIX="$PWD/build_$bit/$bit-w64-mingw32" \
              -DSINGLE_SOURCE_LOCATION="$PWD/src_packages" -DRUSTUP_LOCATION="$PWD/clang_root/install_rustup" \
              -G Ninja -B "build_$bit" -S recipe
            if [ "$bit" = x86_64 ]; then
              # The git sources first, checked out at their pins; the toolchain is never built from the heads
              ninja -C "build_$bit" llvm-download mingw-w64-download cppwinrt-download
              bash immuch360/.github/desktop/libmpv/pin_sources.sh immuch360/.github/desktop/libmpv/sources.lock \
                src_packages pinned llvm mingw-w64 cppwinrt
              # LLVM itself is shared by both targets; no profile guided second build, which would add about 1.5 hours
              ninja -C "build_$bit" llvm
            fi
            ninja -C "build_$bit" llvm-clang
          done

      - name: Keep the licences of the runtime the DLL links, then the sysroots only
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          lic=clang_root/share/immuch360-licenses
          mkdir -p "$lic/llvm-runtimes" "$lic/mingw-w64"
          for d in libcxx libcxxabi libunwind compiler-rt; do
            if [ -f "src_packages/llvm/$d/LICENSE.TXT" ]; then
              cp "src_packages/llvm/$d/LICENSE.TXT" "$lic/llvm-runtimes/$d-LICENSE.TXT"
            fi
          done
          cp src_packages/mingw-w64/COPYING "$lic/mingw-w64/COPYING" || true
          cp src_packages/mingw-w64/mingw-w64-libraries/winpthreads/COPYING "$lic/mingw-w64/winpthreads-COPYING" || true
          ls -R "$lic"
          rm -rf build_*/toolchain build_*/packages src_packages
          du -sh clang_root build_x86_64 build_aarch64

      - name: Save it in the cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            clang_root
            build_x86_64
            build_aarch64
          key: ${{ steps.key.outputs.key }}

  libmpv:
    name: libmpv ${{ matrix.arch }}
    needs: [image, sources, toolchain]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    container:
      image: ${{ needs.image.outputs.image }} # zizmor: ignore[unpinned-images] digest pinned by the image job
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    env:
      ARCH: ${{ matrix.arch }}
      BUILD_IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - name: Git settings
        run: |
          git config --global --add safe.directory '*'
          # The recipe applies its patches with "git am --3way", which records a commit and needs a committer
          git config --global user.name "libmpv build"
          git config --global user.email "libmpv-build@localhost"

      - name: Check out the FFmpeg and mpv files of this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: immuch360
          sparse-checkout: .github/desktop/libmpv

      - name: Check out the recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ env.RECIPE_REPOSITORY }}
          ref: ${{ env.RECIPE_REF }}
          path: recipe

      - name: Restore the toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            clang_root
            build_x86_64
            build_aarch64
          key: ${{ needs.toolchain.outputs.key }}
          fail-on-cache-miss: true

      - name: Download the sources
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-sources

      - name: Unpack the sources, Meson and the FFmpeg and mpv files
        run: |
          zstd -d -q -c build-sources.tar.zst | tar -xf -
          rm build-sources.tar.zst
          python -m pip --version || pacman -Sy --needed --noconfirm python-pip
          python -m pip install --break-system-packages --require-hashes \
            -r immuch360/.github/desktop/libmpv/meson-requirements.txt
          cp immuch360/.github/desktop/libmpv/ffmpeg.cmake immuch360/.github/desktop/libmpv/mpv.cmake recipe/packages/

      - name: Build libmpv
        run: |
          cmake -DTARGET_ARCH="$ARCH-w64-mingw32" -DCOMPILER_TOOLCHAIN=clang \
            -DCMAKE_INSTALL_PREFIX="$PWD/clang_root" -DMINGW_INSTALL_PREFIX="$PWD/build_$ARCH/$ARCH-w64-mingw32" \
            -DSINGLE_SOURCE_LOCATION="$PWD/src_packages" -DRUSTUP_LOCATION="$PWD/clang_root/install_rustup" \
            -DCLANG_PACKAGES_LTO=ON -DIMMUCH360_FFMPEG_REF="$FFMPEG_REF" -DIMMUCH360_MPV_REF="$MPV_REF" \
            -G Ninja --fresh -B "build_$ARCH" -S recipe
          ninja -C "build_$ARCH" mpv

      - name: Archive
        id: archive
        run: |
          shopt -s nullglob
          dirs=("build_$ARCH/mpv-dev-$ARCH-"*-git-*)
          if [ ${#dirs[@]} != 1 ] || [ ! -d "${dirs[0]}" ]; then
            echo "expected one mpv-dev folder: ${dirs[*]}"
            exit 1
          fi
          dev=${dirs[0]}
          name=$(basename "$dev")
          for f in libmpv-2.dll libmpv.dll.a include/mpv/client.h include/mpv/render.h include/mpv/render_gl.h include/mpv/stream_cb.h; do
            [ -f "$dev/$f" ] || { echo "missing $f"; exit 1; }
          done

          ninja -C "build_$ARCH" -t inputs mpv \
            | grep -oE 'packages/[^/]+-prefix/src/[^/]+-stamp/' | sed -E 's#packages/([^/]+)-prefix/.*#\1#' \
            | sort -u > "packages-$ARCH.txt"
          # Licence texts of every library built for the DLL and of the runtime it links
          while read -r p; do
            src="src_packages/$p"
            mkdir -p "$dev/licenses/$p"
            for f in "$src"/LICENSE* "$src"/LICENCE* "$src"/COPYING* "$src"/Copyright "$src"/NOTICE* "$src"/LICENSES; do
              if [ -e "$f" ]; then cp -r "$f" "$dev/licenses/$p/"; fi
            done
            rmdir --ignore-fail-on-non-empty "$dev/licenses/$p"
          done < "packages-$ARCH.txt"
          cp -r clang_root/share/immuch360-licenses/. "$dev/licenses/"

          {
            echo "libmpv-2.dll for Windows $ARCH, built for Immuch360 Desktop"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "repository commit: $GITHUB_SHA"
            echo "recipe: https://github.com/$RECIPE_REPOSITORY at $RECIPE_REF, with .github/desktop/libmpv/ffmpeg.cmake and mpv.cmake"
            echo "container: $BUILD_IMAGE"
            echo "sources: $SOURCES_MODE (pinned: the commits of .github/desktop/libmpv/sources.lock)"
            echo "mpv: $MPV_REF ($(git -C src_packages/mpv describe --tags --always 2>/dev/null))"
            echo "FFmpeg: $FFMPEG_REF ($(git -C src_packages/ffmpeg describe --tags --always 2>/dev/null))"
            echo "target: $ARCH-w64-mingw32, $(grep -E '^GCC_ARCH:' "build_$ARCH/CMakeCache.txt")"
            echo "LLVM: $(clang_root/bin/clang --version | head -1)"
            echo
            echo "Libraries built for the DLL (package, repository or archive, commit or SHA-256):"
            awk 'NR == FNR { keep[$1]; next } $1 in keep' "packages-$ARCH.txt" SOURCES.txt
          } > "$dev/BUILDINFO.txt"
          cp "$dev/BUILDINFO.txt" "BUILDINFO-$ARCH.txt"
          cat "BUILDINFO-$ARCH.txt"

          # Files at the root of the archive, as in media-kit's: the libs package moves include/mpv to include
          (cd "$dev" && 7z a -m0=lzma2 -mx=9 -ms=on "../../$name.7z" ./* > /dev/null)
          sha256sum "$name.7z" | tee "$name.7z.sha256"
          echo "file=$name.7z" >> "$GITHUB_OUTPUT"

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.arch }}
          path: |
            ${{ steps.archive.outputs.file }}
            ${{ steps.archive.outputs.file }}.sha256
            BUILDINFO-${{ matrix.arch }}.txt
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Collect the build logs
        if: always()
        run: |
          mkdir -p "logs-$ARCH"
          find "build_$ARCH" -type f \( -iname '*-*.log' -o -path '*/ffbuild/config.log' -o -name meson-log.txt \) \
            -exec cp --parents {} "logs-$ARCH/" \; 2>/dev/null || true
          tar -cf - "logs-$ARCH" | zstd -T0 -q -o "logs-$ARCH.tar.zst"

      - name: Upload the build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-${{ matrix.arch }}
          path: logs-${{ matrix.arch }}.tar.zst
          retention-days: 7
          if-no-files-found: ignore

  publish:
    name: Release
    needs: [sources, libmpv]
    # Only pinned sources are published: never the quarterly run from the heads, and by hand only when asked
    if: >-
      needs.sources.outputs.pinned == 'true' && github.event_name != 'schedule'
      && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # creates the release and its tag; the only write of the workflow
    env:
      TAG: ${{ needs.sources.outputs.tag }}
    steps:
      - name: Download the archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - name: Download the sources
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sources
          path: dist

      - name: Checksums and notes
        working-directory: dist
        run: |
          rm -f ./*.sha256
          x64=$(ls mpv-dev-x86_64-*.7z)
          arm64=$(ls mpv-dev-aarch64-*.7z)
          sha256sum "$x64" "$arm64" "$TAG-sources.tar.xz" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha() { grep -F " $1" SHA256SUMS.txt | cut -d' ' -f1; }
          {
            echo "set(IMMUCH360_LIBMPV_TAG \"$TAG\")"
            echo "set(IMMUCH360_LIBMPV_X64 \"$x64\")"
            echo "set(IMMUCH360_LIBMPV_X64_SHA256 \"$(sha "$x64")\")"
            echo "set(IMMUCH360_LIBMPV_ARM64 \"$arm64\")"
            echo "set(IMMUCH360_LIBMPV_ARM64_SHA256 \"$(sha "$arm64")\")"
          } > ../cmake-pin.txt
          {
            echo "libmpv-2.dll (mpv with FFmpeg) for Windows x64 and arm64, built by .github/workflows/immuch360-libmpv.yml for Immuch360 Desktop. Not an app release: the Windows build of the app downloads one of these archives and checks it by its SHA-256."
            echo
            echo "- mpv: \`$MPV_REF\`; FFmpeg: \`$FFMPEG_REF\`; recipe: \`$RECIPE_REPOSITORY\` at \`$RECIPE_REF\`. Every library and its commit: \`BUILDINFO-x86_64.txt\`, \`BUILDINFO-aarch64.txt\`."
            echo "- Licence: GNU LGPL version 3 or later for the DLL as a whole (mpv LGPL-2.1-or-later, FFmpeg configured with --enable-version3); the licence texts are in \`licenses/\` inside each archive, the notices in \`mobile/packages/media_kit_video/windows/NOTICES.md\`."
            echo "- Corresponding source: \`$TAG-sources.tar.xz\`."
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "SHA-256:"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > ../notes.md

      - name: Release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A rerun of this job after an upload failed halfway
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "libmpv for Windows, $TAG" --notes-file ../notes.md --prerelease --latest=false ./*
          fi

      - name: Lines for the CMake of the libs package
        run: |
          {
            echo "### libmpv $TAG"
            echo
            echo "Paste into \`mobile/packages/media_kit_libs_windows_video/windows/CMakeLists.txt\`, then turn \`IMMUCH360_LIBMPV_FROM_CI\` on there:"
            echo
            echo '```cmake'
            cat cmake-pin.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat cmake-pin.txt

  macos-sources:
    name: macOS library sources
    if: inputs.systems != 'windows' && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Inputs and release tag
        id: tag
        run: |
          [[ "$MACOS_RECIPE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "macos_recipe_ref: a full commit"; exit 1; }
          [[ "$MACOS_TARGET" =~ ^mk-[a-z0-9-]+$ ]] || { echo "macos_target: a package of the recipe (mk-...)"; exit 1; }
          echo "tag=libmpv-macos-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Check out the overlay of this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: immuch360
          sparse-checkout: .github/desktop/libmpv-macos

      - name: Check out the recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ env.MACOS_RECIPE_REPOSITORY }}
          ref: ${{ env.MACOS_RECIPE_REF }}
          path: recipe

      - name: The overlay over the recipe
        run: bash immuch360/.github/desktop/libmpv-macos/apply_overlay.sh recipe

      # Every archive the build reads, as packages.lock.nix names it, checked by its SHA-256 here as Nix checks it there;
      # fftools-ffi is pinned by a Nix hash and serves the encoders flavor only, which is not built
      - name: Download every archive of the lock
        run: |
          mkdir -p archives
          python3 - recipe/packages.lock.nix > archives.txt <<'PY'
          import re, sys
          text = open(sys.argv[1]).read()
          for name, version, url, sha in re.findall(
                  r'^  ([\w-]+) = \{\s*version = "([^"]*)";\s*url = "([^"]*)";\s*sha256 = "([^"]*)";', text, re.M):
              print(name, version, url, sha)
          PY
          cat archives.txt
          while read -r name version url sha; do
            if [ "$name" = fftools-ffi ]; then
              continue
            fi
            [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "$name: no SHA-256 of the archive"; exit 1; }
            file="archives/$name-$version-$(basename "$url")"
            curl -fsSL --retry 3 -o "$file" "$url"
            echo "$sha  $file" | sha256sum -c -
          done < archives.txt

      # The licence files of each library, as its sources hold them, for the release and for the notices of the app
      # (mobile/packages/media_kit_libs_macos_video/NOTICES.md)
      - name: Licence texts
        run: |
          mkdir -p licenses work
          while read -r name version url sha; do
            case "$name" in fftools-ffi|libogg|libvorbis|libvpx|libx264|libpngPatch) continue ;; esac
            rm -rf work/src && mkdir -p work/src
            # GNU tar finds the compression of each archive by itself
            tar -xf "archives/$name-$version-$(basename "$url")" -C work/src --strip-components=1
            mkdir -p "licenses/$name"
            for f in work/src/LICENSE* work/src/LICENCE* work/src/COPYING* work/src/Copyright work/src/NOTICE* \
              work/src/docs/LICENSE.TXT work/src/docs/FTL.TXT work/src/docs/GPLv2.TXT; do
              if [ -f "$f" ]; then cp "$f" "licenses/$name/"; fi
            done
            ls "licenses/$name" | sed "s#^#$name: #"
          done < archives.txt
          rm -rf work

      - name: Pack the sources
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          rm -rf recipe/.git
          tar -cf - archives.txt archives recipe licenses immuch360/.github/desktop/libmpv-macos \
            | xz -T0 -6 > "$TAG-sources.tar.xz"
          tar -czf "$TAG-licenses.tar.gz" licenses
          ls -l "$TAG-sources.tar.xz" "$TAG-licenses.tar.gz"

      - name: Upload the sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-sources
          path: |
            ${{ steps.tag.outputs.tag }}-sources.tar.xz
            ${{ steps.tag.outputs.tag }}-licenses.tar.gz
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

  macos-libmpv:
    name: macOS libmpv (universal)
    needs: macos-sources
    runs-on: macos-15
    timeout-minutes: 300
    env:
      TAG: ${{ needs.macos-sources.outputs.tag }}
    steps:
      - name: Check out the overlay of this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: immuch360
          sparse-checkout: .github/desktop/libmpv-macos

      - name: Check out the recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ env.MACOS_RECIPE_REPOSITORY }}
          ref: ${{ env.MACOS_RECIPE_REF }}
          path: recipe

      - name: The overlay over the recipe
        run: bash immuch360/.github/desktop/libmpv-macos/apply_overlay.sh recipe

      # The recipe compiles with the Xcode it is given (its nix/overlays/xcode.nix): the one of the app's build
      - name: Xcode
        id: xcode
        run: |
          xcode="/Applications/Xcode_$MACOS_XCODE_VERSION.app"
          if [ ! -d "$xcode" ]; then
            echo "::error::No Xcode $MACOS_XCODE_VERSION on this runner image"
            ls /Applications | grep "^Xcode" || true
            exit 1
          fi
          xcode=$(realpath "$xcode")
          "$xcode/Contents/Developer/usr/bin/xcodebuild" -version
          echo "path=$xcode" >> "$GITHUB_OUTPUT"

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            sandbox = true
            sandbox-fallback = false

      - name: Build
        working-directory: recipe
        env:
          XCODE_PATH: ${{ steps.xcode.outputs.path }}
        run: |
          nix --version
          # The recipe's Makefile: the version and the Xcode written to .nix/config, then nix build in the sandbox
          make XCODE_PATH="$XCODE_PATH" VERSION="$TAG" TARGET="$MACOS_TARGET"
          ls -lL result result/* | head -50

      - name: Archive and BUILDINFO
        working-directory: recipe
        env:
          XCODE_PATH: ${{ steps.xcode.outputs.path }}
        run: |
          mkdir -p ../dist
          if [ "$MACOS_TARGET" = "$MACOS_ARCHIVE_TARGET" ]; then
            cp result/*.tar.gz result/*.zip ../dist/
            tar -tzf ../dist/*.tar.gz | grep -E '^[^/]+/[^/]+\.xcframework/$' | sort
            for lib in Mpv Placebo Avcodec Avformat Avutil; do
              ls ../dist/*_"$lib".zip > /dev/null || { echo "no $lib.xcframework"; exit 1; }
            done
          else
            tar -czhf "../dist/$MACOS_TARGET.tar.gz" -C result .
          fi
          {
            echo "libmpv for macOS (arm64 and x86_64, macOS 12 and later), built for Immuch360 Desktop"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "repository commit: $GITHUB_SHA"
            echo "recipe: https://github.com/$MACOS_RECIPE_REPOSITORY at $MACOS_RECIPE_REF, with .github/desktop/libmpv-macos"
            echo "package: $MACOS_TARGET"
            echo "Xcode: $("$XCODE_PATH/Contents/Developer/usr/bin/xcodebuild" -version | tr '\n' ' ')"
            echo "Nix: $(nix --version)"
            echo
            echo "Archives of packages.lock.nix (name, version, URL, SHA-256 of the archive):"
            python3 - packages.lock.nix <<'PY'
          import re, sys
          text = open(sys.argv[1]).read()
          for entry in re.findall(
                  r'^  ([\w-]+) = \{\s*version = "([^"]*)";\s*url = "([^"]*)";\s*sha256 = "([^"]*)";', text, re.M):
              print(' '.join(entry))
          PY
          } > ../dist/BUILDINFO-macos.txt
          cat ../dist/BUILDINFO-macos.txt
          (cd ../dist && shasum -a 256 ./* | sed 's# \./# #')

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-archive
          path: dist/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Collect the build logs
        if: always()
        working-directory: recipe
        run: |
          mkdir -p ../logs-macos
          # The log of every derivation Nix built or failed to build, from its store
          for drv in $(nix path-info --derivation ".#$MACOS_TARGET" --recursive 2>/dev/null | grep -E 'mk-(pkg|out)-' || true); do
            nix log "$drv" > "../logs-macos/$(basename "$drv").log" 2>/dev/null || rm -f "../logs-macos/$(basename "$drv").log"
          done
          ls ../logs-macos | head -50
          tar -czf ../logs-macos.tar.gz -C .. logs-macos

      - name: Upload the build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-macos
          path: logs-macos.tar.gz
          retention-days: 7
          if-no-files-found: ignore

  macos-publish:
    name: macOS release
    needs: [macos-sources, macos-libmpv]
    if: >-
      github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.publish)
      && (inputs.macos_target == '' || inputs.macos_target == 'mk-out-archive-xcframeworks-macos-universal-video-default')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # creates the release and its tag; with the Windows publish, the only writes of the workflow
    env:
      TAG: ${{ needs.macos-sources.outputs.tag }}
    steps:
      - name: Download the archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-archive
          path: dist

      - name: Download the sources
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-sources
          path: dist

      - name: Checksums, notes and the Package.swift lines
        working-directory: dist
        run: |
          sha256sum ./* | sed 's# \./# #' | grep -v ' SHA256SUMS.txt$' > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt
          base=$(ls ./*_macos-universal-video-default.tar.gz | sed 's#^\./##; s#\.tar\.gz$##')
          # Swift Package Manager checks a binary target by the SHA-256 of its zip (swift package compute-checksum)
          {
            echo "let libmpvTag = \"$TAG\""
            echo "let libmpvArtifactBase = \"https://github.com/$GITHUB_REPOSITORY/releases/download/\\(libmpvTag)/$base\""
            echo "let libmpvChecksums = ["
            for zip in "$base"_*.zip; do
              name=${zip#"$base"_}
              name=${name%.zip}
              echo "    \"$name\": \"$(grep -F " $zip" SHA256SUMS.txt | cut -d' ' -f1)\","
            done
            echo "]"
          } > ../package-pin.txt
          cat ../package-pin.txt
          {
            echo "libmpv (mpv with FFmpeg) for macOS, arm64 and x86_64, macOS 12 and later, built by .github/workflows/immuch360-libmpv.yml for Immuch360 Desktop. Not an app release: the macOS build of the app downloads the xcframeworks of this release through Swift Package Manager, each checked by its SHA-256."
            echo
            echo "- Recipe: \`$MACOS_RECIPE_REPOSITORY\` at \`$MACOS_RECIPE_REF\` with \`.github/desktop/libmpv-macos\`: FFmpeg and mpv at the commits of the Windows build, every library and archive in \`BUILDINFO-macos.txt\`."
            echo "- Licence: GNU LGPL version 3 or later for libmpv and FFmpeg as built (mpv -Dgpl=false, FFmpeg --enable-version3 without GPL or nonfree parts); the licence texts of each library are in \`$TAG-licenses.tar.gz\`, the notices in \`mobile/packages/media_kit_libs_macos_video/NOTICES.md\`."
            echo "- Corresponding source: \`$TAG-sources.tar.xz\` (the recipe with the overlay, and every archive it builds from)."
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "SHA-256:"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > ../notes.md

      - name: Release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "libmpv for macOS, $TAG" --notes-file ../notes.md --prerelease --latest=false ./*
          fi

      - name: Lines for the Package.swift of the libs package
        run: |
          {
            echo "### libmpv $TAG"
            echo
            echo "Paste into \`mobile/packages/media_kit_libs_macos_video/macos/media_kit_libs_macos_video/Package.swift\`:"
            echo
            echo '```swift'
            cat package-pin.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
