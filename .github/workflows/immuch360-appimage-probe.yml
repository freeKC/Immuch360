name: Immuch360 AppImage probe

# Temporary, for the branch feat-linux-appimage-52 only: the AppImage made from the bundle of the .deb of desktop
# build 31 and checked in the five containers, to try packaging/linux/check_appimage.sh without the whole desktop
# build. Removed before the branch is merged.

on:
  push:
    branches: [feat-linux-appimage-52]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make:
    name: AppImage from desktop build 31
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bundle of desktop build 31, then the AppImage
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/d.deb" \
            https://github.com/freeKC/Immuch360/releases/download/desktop-v3.4.6-31/Immuch360-Desktop-3.4.6-desktop.31-linux-amd64.deb
          dpkg-deb -x "$RUNNER_TEMP/d.deb" "$RUNNER_TEMP/root"
          python3 .github/desktop/desktop_installers.py appimage-tools --out "$RUNNER_TEMP/appimage-tools"
          python3 .github/desktop/desktop_installers.py appimage --bundle "$RUNNER_TEMP/root/opt/immuch360" \
            --label 3.4.6-desktop.31 --out "$RUNNER_TEMP/appimage" --tools "$RUNNER_TEMP/appimage-tools"
          mkdir -p dist
          mv "$RUNNER_TEMP"/appimage/*.AppImage dist/
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/Immuch360-Desktop-3.4.6-desktop.31-linux-x86_64.AppImage
          archive: false
          retention-days: 3
          if-no-files-found: error

  check:
    name: AppImage on ${{ matrix.image }}
    runs-on: ubuntu-24.04
    needs: make
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ['archlinux:latest', 'fedora:44', 'debian:12', 'ubuntu:22.04', 'opensuse/tumbleweed:latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Immuch360-Desktop-*-linux-x86_64.AppImage
          merge-multiple: true
          skip-decompress: true
          path: dist
      - name: Run and check
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -o pipefail
          file=$(cd dist && ls ./*.AppImage)
          mkdir -p video-smoke
          docker run --rm -v "$PWD/dist:/pkgs:ro" -v "$PWD/.github/desktop/packaging/linux:/check:ro" \
            -v "$PWD/mobile/test/fixtures/video:/clips:ro" -v "$PWD/video-smoke:/out" "$IMAGE" \
            sh /check/check_appimage.sh "/pkgs/${file#./}" /clips/flat-6s.mp4 /out /clips/flat-6s-theora.mkv

  aur:
    name: AUR package immuch360-bin
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: namcap, makepkg and the package installed in archlinux
        run: |
          docker run --rm -v "$PWD/.github/desktop/packaging/linux/aur:/aur:ro" archlinux:latest sh /aur/check_aur.sh
