name: Immuch360 share probe

# A probe of the share window of Windows for an unpackaged Win32 program on the hosted runners (lot share 54):
# DataTransferManager.IsSupported, when the window asks for its data, and what share_plus's order leaves in it.
on:
  push:
    branches: [probe-share-54]

permissions:
  contents: read

jobs:
  probe:
    name: Share probe on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the probe
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VS=%%i
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /EHsc /std:c++17 /W4 /WX /wd4100 /DNOMINMAX /DUNICODE /D_UNICODE /I .github\share_probe .github\share_probe\share_sheet.cpp .github\share_probe\probe.cpp /Fe:probe.exe user32.lib ole32.lib runtimeobject.lib

      - name: System
        shell: powershell
        continue-on-error: true
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, OperatingSystemSKU | Format-List
          Get-AppxPackage -AllUsers | Where-Object { $_.Name -match 'ShellExperience|Share|StartMenu' } | Select-Object Name, Version | Format-Table | Out-String | Write-Host
          whoami /groups | Select-String -Pattern 'Mandatory Label' | Out-String | Write-Host
          Get-Process | Where-Object { $_.ProcessName -match 'explorer|ShellExperience|StartMenu|sihost' } | Select-Object ProcessName, Id, SessionId | Format-Table | Out-String | Write-Host

      - name: Scenarios
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force out | Out-Null
          function Shot($name) {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save((Join-Path $PWD "out\$name.png"))
            $graphics.Dispose(); $bitmap.Dispose()
          }
          $png = [Convert]::FromBase64String('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==')
          $cases = @(
            @('two', 'two-png', 'png', $env:RUNNER_TEMP),
            @('twoafter', 'twoafter-png', 'png', $env:RUNNER_TEMP),
            @('ours', 'ours-png', 'png', $env:RUNNER_TEMP)
          )
          foreach ($case in $cases) {
            $scenario, $name, $ext, $dir = $case
            $folder = Join-Path $dir "immuch360-probe-$name"
            New-Item -ItemType Directory -Force $folder | Out-Null
            $file = Join-Path $folder "probe photo.$ext"
            if ($ext -eq 'png') { [IO.File]::WriteAllBytes($file, $png) } else { [IO.File]::WriteAllBytes($file, [byte[]](1..200 | ForEach-Object { $_ % 256 })) }
            Write-Host "=== $name"
            $p = Start-Process -FilePath .\probe.exe -ArgumentList $scenario, "`"$file`"", '14' -PassThru -NoNewWindow `
              -RedirectStandardOutput "out\$name.txt"
            Start-Sleep -Milliseconds 1500
            Shot "$name-1"
            Start-Sleep -Milliseconds 2500
            Shot "$name-2"
            Start-Sleep -Milliseconds 6000
            Shot "$name-3"
            $p.WaitForExit(30000) | Out-Null
            Shot "$name-4"
            Get-Content "out\$name.txt"
            Write-Host "file still there: $(Test-Path $file)"
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: share-probe-${{ matrix.os }}
          path: out/
          retention-days: 7
