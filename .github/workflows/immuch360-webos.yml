name: Immuch360 webOS

# The app for LG webOS TVs (webos/, built on immich-tv-webos 1.7.0, see webos/UPSTREAM.md): its tests, then the .ipk
# made by the webOS command line tools (@webos-tools/cli, pinned in webos/package.json), checked by
# webos/tools/check-package.mjs and uploaded as an artifact with SHA256SUMS.txt and the list of its files.
#
# Run by hand (gh workflow run immuch360-webos.yml --ref <branch>, or the REST API) it builds the version of
# webos/webos-meta/appinfo.json, or the one given. On the push of a webos-v<x.y.z> tag it builds that version and
# publishes the .ipk and SHA256SUMS.txt as a GitHub pre-release of the tag: the only job that writes, with
# "contents: write" and the token of the run. .github/desktop/check_workflow.py holds this file to the rules of the
# release workflows (pinned runners and actions, no secret, no kept token, its own tags only).

on:
  push:
    tags: ['webos-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version of the build, three numbers (0.1.0); empty for the one of webos/webos-meta/appinfo.json'
        required: false
        default: ''

permissions: {}

jobs:
  build:
    name: Build the .ipk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: webos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: This workflow pinned, on webos-v* tags only
        working-directory: .
        run: python3 .github/desktop/check_workflow.py --release --workflow .github/workflows/immuch360-webos.yml --tag-prefix webos-v

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: webos/.nvmrc
          cache: npm
          cache-dependency-path: webos/package-lock.json

      # The tag gives the version (webos-v0.1.0 is 0.1.0), else the input, else appinfo.json
      - name: The version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#webos-v}"
          elif [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="$(node -p "require('./webos-meta/appinfo.json').version")"
          fi
          node tools/set-version.mjs "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Dependencies
        run: npm ci --no-audit --no-fund

      - name: Tests of the Immuch360 layers (node test runner)
        run: npm run test-unit

      - name: Tests inherited from immich-tv-webos (jest)
        run: npm test -- --maxWorkers=2

      - name: Tests of the build tools and of the phone sign-in service
        run: |
          npm run test-tools
          npm run test-service

      - name: Types
        run: npm run typecheck

      - name: The .ipk, built and checked
        run: npm run ipk

      - name: SHA256SUMS.txt
        working-directory: webos/build
        run: |
          sha256sum -- *.ipk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Immuch360-webOS-${{ steps.version.outputs.version }}
          path: |
            webos/build/*.ipk
            webos/build/SHA256SUMS.txt
            webos/build/ipk-files.json
          if-no-files-found: error

  release:
    name: Publish the pre-release
    needs: build
    if: startsWith(github.ref, 'refs/tags/webos-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Immuch360-webOS-${{ needs.build.outputs.version }}
          path: release

      # A pre-release, created when the tag has none; notes written by hand are never replaced
      - name: Attach the .ipk and SHA256SUMS.txt to the pre-release of the tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          (cd release && sha256sum --check SHA256SUMS.txt)
          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --verify-tag --prerelease \
              --title "Immuch360 for LG webOS $VERSION (preview)" \
              --notes "Preview of the Immuch360 app for LG webOS TVs (webOS 4.0 and later), built on immich-tv-webos 1.7.0 by Quentin Jean-Amans. Install it on a TV in Developer Mode: see webos/README.md."
          fi
          gh release upload "$TAG" --repo "$REPO" --clobber release/*.ipk release/SHA256SUMS.txt
