name: Immuch360 Tizen release

# On the push of a Samsung TV pre-release tag, tizen-v<x.y.z> (tizen-v0.1.0), the .wgt of the Tizen app is built from the
# tag by immuch360-tizen.yml, called here with its own read-only permissions (its tests, the end to end test and the
# package must pass), then attached with SHA256SUMS.txt to the GitHub release of the tag, created as a pre-release when
# the tag has none (notes written by hand are never replaced). Run by hand on a branch, it builds the .wgt and lists
# what it would attach.
#
# This is the one Tizen workflow that writes to the repository: its release job only, with "contents: write", on
# tizen-v* tags and by hand, never on a pull request; .github/desktop/check_workflow.py --release --tag-prefix tizen-v
# holds it to that.

on:
  push:
    tags: ['tizen-v*']
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build
    uses: ./.github/workflows/immuch360-tizen.yml
    permissions:
      contents: read

  release:
    name: Attach the .wgt to the release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Immuch360-Tizen-${{ needs.build.outputs.version }}
          path: release

      - name: The files of the build
        working-directory: release
        run: |
          sha256sum --check SHA256SUMS.txt
          ls -l

      - name: Attach them to the pre-release of the tag
        if: startsWith(github.ref, 'refs/tags/tizen-v')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --verify-tag --prerelease \
              --title "Immuch360 for Samsung TVs $VERSION (test build)" \
              --notes "Test build of the Immuch360 app for Samsung TVs (Tizen 5.5 and later, 2020 TVs on). It has not run on a real TV yet. Every Samsung TV app is signed for the TVs it runs on: install it with Apps2Samsung, a community tool (MIT) that signs it for your TV with your Samsung account, or re-sign it in Tizen Studio with a Samsung certificate that lists your TV's DUID. Sign in by typing your server address, then your email and password or an API key; signing in with a phone, network shares, Plex and Tapo cameras are not in this version for Samsung TVs. Videos larger than 4K, or 4K on older TVs, may not play yet, and 360 videos play flat. The About page shows what your TV supports; its QR code makes a useful bug report. Built on Immich TV for webOS by Seeky91 (https://github.com/Seeky91/immich-tv-webos), MIT. Source of this build: https://github.com/$REPO/tree/$TAG/tizen and https://github.com/$REPO/tree/$TAG/webos (AGPL-3.0)."
          fi
          gh release upload "$TAG" --repo "$REPO" --clobber release/*.wgt release/SHA256SUMS.txt
