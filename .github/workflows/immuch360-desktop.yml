name: Immuch360 Desktop

# Immuch360 Desktop (Windows, macOS, Linux) from the same sources as the phone apps. Runs on the desktop branch, its
# pull requests and the upstream sync branches; the Android release workflow (immuch360-release.yml) is not touched.
#
# Jobs:
#   codegen        the generated Dart once for every job (Windows and macOS need neither Java nor node), with the
#                  archive of the sources of libsmb2 that every build carries, and the version numbers of the desktop
#                  builds (.github/desktop/desktop_version.py)
#   gates          the checks that keep the phones as they are and the desktop code in its place, without Flutter
#   test           analyze, the whole mobile suite (test/desktop included) and the Android and iOS plugin lists, then
#                  the tests of ONNX Runtime by FFI on the official Linux libraries of 1.31.0 and 1.23.2 (with the
#                  engine of the 3D scenes on the tiny models), and the glTF-Validator of Khronos on the scenes
#   linux          the Linux build on the oldest supported Ubuntu (for its glibc), with libsmb2 built there too from
#                  the archive of its sources, the video tests on the system's libmpv, the probe of the graphics cards
#                  of the build, its .deb and .rpm (nFPM), its AppImage (appimagetool), and the build playing a video
#                  on a virtual screen (Xvfb)
#   linux-packages each package installed in a clean container of a distribution, its libraries checked, and the
#                  installed app playing a video there
#   linux-appimage the AppImage run without any package of the app in a clean container of Arch Linux, Fedora, Debian,
#                  Ubuntu and openSUSE: the packages its check names installed with the command it gives, then its
#                  libraries, its files, a start and a video
#   linux-aur      the AUR package immuch360-bin made from the .deb of the release its PKGBUILD names, checked by namcap
#                  and installed in an archlinux container; never in a release, as it reads a published one
#   macos          the macOS build (universal, unsigned), the app zipped and in a DMG, its document types checked with
#                  Launch Services, libmpv and its notices checked in the app, the libmpv of the app reading a y4m as
#                  the AV2 decoder serves it (check_y4m.py), the serve of the macOS archive of the AV2 decoder the app
#                  downloads (immuch360/av2-companion) on fixtures and a 1080p clip, with the options of the app
#                  (check_y4m.py companion), and a self check of the app on the runner (a folder and a video on the
#                  command line, the keychain, five seconds of libmpv, the y4m over HTTP), a failed check failing the job
#   macos-tests    test/desktop on an arm64 Mac, then ONNX Runtime by FFI on the library the app installs there (the
#                  tiny models, the engines of the scenes, the panoramas and the 3D videos), and a whole 3D video through
#                  the macOS FFmpeg program the app downloads
#   macos-intel-video3d
#                  ONNX Runtime 1.23.2 on an Intel Mac, and a whole 3D video there with the real model
#   windows        desktop tests on a real Windows (ONNX Runtime 1.31.0 and the job object of sd-cli included), the
#                  fake sd-cli and the probes of a generation, of a panorama and of the splat scenes as the artifact
#                  Immuch360-AI-tools-windows-x64, the release build, the ZIP and the installer (Inno Setup) for the
#                  owner as artifacts named Immuch360-Desktop-<label>-windows-x64.zip and -windows-x64-setup.exe
#                  (unsigned), then the desktop tests that need the DLLs of that build (libmpv, ANGLE), the probe of
#                  the graphics cards of the build, and the app of the ZIP started on a database an older build left
#                  behind
#   packages       the eight files of the build (the seven packages and the libsmb2 sources) together with their
#                  SHA-256, as a release gets them
#   upstream-sync  on upstream-sync/* branches, next to the test and linux jobs: the sync checklist of design 8.4
#                  point 7 in the run summary. An upstream sync reaches the desktop branch through the phone branch;
#                  an upstream-sync/* branch is made from the desktop branch to see the effect of a sync before it lands.
#   sdcpp-windows, sdcpp-linux
#                  stable-diffusion.cpp on Vulkan, the generator of the 360° panoramas, built from the commits of
#                  .github/desktop/ai/sd_cpp.lock.json: only when asked (the sdcpp input) or when the lock changed,
#                  as artifacts Immuch360-AI-sdcpp-<lock>-windows-x64.zip and -linux-x64.zip that no release attaches
#   spark          Spark, the renderer of the splat viewer, built from its tag with flate2 on miniz_oxide
#                  (.github/desktop/splat_viewer/spark_build.py): only when asked (the spark input) or when its lock,
#                  patches or script changed, as the artifact Immuch360-splat-viewer-spark, compared with the files
#                  committed under mobile/assets/splat_viewer (the same bytes, or the job fails)
#   colmap-windows, colmap-linux
#                  COLMAP on the processor and without its GPL parts, which places the photos of the splat scenes,
#                  built from .github/desktop/ai/colmap.lock.json with the libraries of vcpkg (binary cache in the
#                  Actions cache): only when asked (the colmap input) or when the lock or its patches changed, as
#                  artifacts Immuch360-AI-colmap-<lock>-windows-x64.zip and -linux-x64.zip that no release attaches
#   brush-windows, brush-linux
#                  Brush, the trainer of the splat scenes, built from the tag of .github/desktop/ai/brush.lock.json with
#                  the patch of licenses/brush/patches (no window, network client, rerun or LPIPS weights): only when
#                  asked (the brush input) or when the lock, its script or licenses/brush changed, as artifacts
#                  Immuch360-AI-brush-<lock>-windows-x64.zip and -linux-x64.zip that no release attaches
#
# Every package file is an artifact of its own, named Immuch360-Desktop-<label>-<system>.<extension>; the label comes
# from .github/desktop/desktop_version.py. On a desktop-v* tag, immuch360-desktop-release.yml runs this workflow and
# attaches those files to the GitHub release of the tag.
#
# Runner labels and actions are pinned: windows-latest is now the Visual Studio 2026 image while the desktop builds
# with Visual Studio 2022, like the owner's PC. The workflow builds pull request code, so it reads the repository only,
# keeps no token in the checkouts and uses no secret; .github/desktop/check_workflow.py holds it to that.

on:
  push:
    branches: [desktop, 'upstream-sync/**']
    tags: ['v*']
  pull_request:
    branches: [desktop]
  workflow_dispatch:
    inputs:
      sdcpp:
        description: Also build stable-diffusion.cpp (the sdcpp jobs), as when sd_cpp.lock.json changes
        type: boolean
        default: false
      sdcpp_seedvr2:
        description: Also build the stable-diffusion.cpp of Enhance (AI), as when sd_cpp_seedvr2.lock.json changes
        type: boolean
        default: false
      spark:
        description: Also build Spark for the splat viewer (the spark job), as when its lock changes
        type: boolean
        default: false
      colmap:
        description: Also build COLMAP (the colmap jobs), as when colmap.lock.json or its patches change
        type: boolean
        default: false
      brush:
        description: Also build Brush (the brush jobs), as when brush.lock.json changes
        type: boolean
        default: false
  # immuch360-desktop-release.yml, on a desktop-v* tag; the permissions below stay read only
  workflow_call:
    inputs:
      sdcpp:
        description: Also build stable-diffusion.cpp, for the release workflow to sign it (never for a release)
        type: boolean
        default: false
      sdcpp_seedvr2:
        description: Also build the stable-diffusion.cpp of Enhance (AI), for the release workflow to sign it (never for a release)
        type: boolean
        default: false
      colmap:
        description: Also build COLMAP (never for a release)
        type: boolean
        default: false
      brush:
        description: Also build Brush (never for a release)
        type: boolean
        default: false
    outputs:
      label:
        description: The version label of the build, which names its files
        value: ${{ jobs.codegen.outputs.label }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_YES: '1'
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  codegen:
    name: Code generation and version
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      build_number: ${{ steps.version.outputs.build_number }}
      file_version: ${{ steps.version.outputs.file_version }}
      label: ${{ steps.version.outputs.label }}
      sdcpp_lock_changed: ${{ steps.sdcpp.outputs.changed }}
      sdcpp_seedvr2_lock_changed: ${{ steps.sdcpp.outputs.seedvr2_changed }}
      spark_lock_changed: ${{ steps.sdcpp.outputs.spark_changed }}
      colmap_lock_changed: ${{ steps.colmap.outputs.changed }}
      brush_lock_changed: ${{ steps.brush.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history without file contents: the fork's release tags give the desktop build number
          fetch-depth: 0
          filter: blob:none

      - name: Version numbers
        id: version
        run: python3 .github/desktop/desktop_version.py --github-output

      # The sdcpp jobs build stable-diffusion.cpp when the lock differs from the base: the target branch of a pull
      # request, the commit before a push; never on a run by hand or from the release workflow, which ask with the
      # sdcpp input
      - name: Did sd_cpp.lock.json change
        id: sdcpp
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=
          if [ "$EVENT" = pull_request ]; then
            base=$(git merge-base HEAD "origin/$BASE_REF")
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$BEFORE
          fi
          changed=false
          if [ -n "$base" ] && ! git diff --quiet "$base" HEAD -- .github/desktop/ai/sd_cpp.lock.json; then
            changed=true
          fi
          echo "sd_cpp.lock.json changed since ${base:-no base}: $changed"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          # The same for the second archive, that of Enhance (AI): its lock and the help its runner is frozen by
          seedvr2_changed=false
          if [ -n "$base" ] && ! git diff --quiet "$base" HEAD -- .github/desktop/ai/sd_cpp_seedvr2.lock.json \
            mobile/test/fixtures/ai_immersive/sd_cli_seedvr2_help.txt; then
            seedvr2_changed=true
          fi
          echo "sd_cpp_seedvr2.lock.json changed since ${base:-no base}: $seedvr2_changed"
          echo "seedvr2_changed=$seedvr2_changed" >> "$GITHUB_OUTPUT"
          # The same for Spark, the renderer of the splat viewer: its lock, its patches and its build script
          spark_changed=false
          if [ -n "$base" ] && ! git diff --quiet "$base" HEAD -- .github/desktop/splat_viewer/spark.lock.json \
            .github/desktop/splat_viewer/patches .github/desktop/splat_viewer/spark_build.py; then
            spark_changed=true
          fi
          echo "Spark's lock, patches or script changed since ${base:-no base}: $spark_changed"
          echo "spark_changed=$spark_changed" >> "$GITHUB_OUTPUT"

      # The same for COLMAP: its lock, the patches applied to its sources, the overlay ports of vcpkg and the build
      # script
      - name: Did the COLMAP lock or its patches change
        id: colmap
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=
          if [ "$EVENT" = pull_request ]; then
            base=$(git merge-base HEAD "origin/$BASE_REF")
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$BEFORE
          fi
          changed=false
          if [ -n "$base" ] && ! git diff --quiet "$base" HEAD -- .github/desktop/ai/colmap.lock.json \
            .github/desktop/ai/colmap licenses/colmap/patches .github/desktop/ai/colmap_build.py; then
            changed=true
          fi
          echo "the COLMAP lock or its patches changed since ${base:-no base}: $changed"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      # The same for the brush jobs: the lock of Brush, its build script or licenses/brush (the patch, the lists of
      # cargo deny and cargo about)
      - name: Did the Brush lock, its script or its licences change
        id: brush
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=
          if [ "$EVENT" = pull_request ]; then
            base=$(git merge-base HEAD "origin/$BASE_REF")
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$BEFORE
          fi
          changed=false
          if [ -n "$base" ] && ! git diff --quiet "$base" HEAD -- .github/desktop/ai/brush.lock.json \
            .github/desktop/ai/brush_build.py licenses/brush; then
            changed=true
          fi
          echo "brush.lock.json, brush_build.py or licenses/brush changed since ${base:-no base}: $changed"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: false
          cache: true

      - name: Install toolchains (Flutter 3.47.2, Java 21, OpenAPI generator)
        run: |
          mise install node java "npm:@openapitools/openapi-generator-cli"
          cd mobile && mise install
          mise exec -- flutter --version

      - name: Dependencies and code generation
        run: |
          mise //mobile:install:ci
          mise //mobile:codegen

      # Every file the code generation wrote, whatever its pattern: the untracked files of lib, generated and test, and
      # the archive of the sources of libsmb2 (.github/desktop/libsmb2/pack_sources.py), an asset of dart_smb2 that every
      # job builds into the app and the linux job builds libsmb2 from
      - name: Pack the generated Dart
        working-directory: mobile
        run: |
          sources=packages/dart_smb2/libsmb2/Immuch360-libsmb2-sources.tar.gz
          [ -f "$sources" ] || { echo "::error::the code generation wrote no $sources"; exit 1; }
          echo "$sources: SHA-256 $(sha256sum "$sources" | cut -d' ' -f1)"
          { git ls-files --others -- lib generated test | grep -v '/\.dart_tool/'; echo "$sources"; } \
            > "$RUNNER_TEMP/generated-dart.txt"
          tar -cf generated-dart.tar -T "$RUNNER_TEMP/generated-dart.txt"
          echo "$(wc -l < "$RUNNER_TEMP/generated-dart.txt") generated files"

      - name: Upload the generated Dart
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-dart
          path: mobile/generated-dart.tar
          retention-days: 3
          if-no-files-found: error

  gates:
    name: Phone gates and lints
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The phone branch is needed for its merge base
          fetch-depth: 0
          filter: blob:none

      - name: Desktop packages imported under mobile/lib/desktop only
        run: python3 .github/desktop/check_desktop_imports.py

      - name: No new iOS or Android ternary
        run: python3 .github/desktop/check_platform_ternaries.py

      - name: Every platform line has a verdict in PLATFORM-AUDIT.md
        run: python3 .github/desktop/check_platform_audit.py

      - name: Every pigeon host API answered on the computers
        run: python3 .github/desktop/check_pigeon_desktop.py

      # Google Play's Deep links page: no web link of a domain the project does not own, no autoVerify, DEFAULT and
      # BROWSABLE on every VIEW filter of a custom scheme; the Android release workflow reads the merged manifests too
      - name: The Android manifests claim no web link of another domain and pass Play's app checks
        run: python3 .github/desktop/check_android_manifest.py

      - name: This workflow pinned and without secrets
        run: python3 .github/desktop/check_workflow.py

      - name: The release workflow pinned, on desktop-v* tags only
        run: python3 .github/desktop/check_workflow.py --release

      - name: The file types of the packages, and the document types of the macOS app
        run: python3 .github/desktop/desktop_installers.py check

      # Spark and three.js of the splat viewer's page, as the spark job built them (licenses/splat-viewer/MANIFEST)
      - name: The engine files of the splat viewer are those of its MANIFEST
        run: python3 .github/desktop/splat_viewer/check_vendor.py

      # The splat viewer's page (lot SV3): its placement fixtures as their script writes them, its modules in Node
      # (placement, controls, quality, session), then the page itself in Chrome on SwiftShader, served as the media
      # bridge serves it (its CSP, a session per fixture): ready, not blank, placed as viewer_expected.json says
      - name: The splat viewer's page, in Node and in headless Chrome
        run: |
          python3 .github/desktop/splat_viewer/make_viewer_fixtures.py --check
          node --version
          node --test mobile/test/splat_viewer_js/*.test.mjs
          google-chrome --version
          python3 .github/desktop/splat_viewer/page_check.py --browser google-chrome \
            --out "$RUNNER_TEMP/splat-page-check"

      - name: Upload the pictures of the page check
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: splat-page-check
          path: ${{ runner.temp }}/splat-page-check
          retention-days: 7
          if-no-files-found: ignore

      # relief-v1 is written once, in Python: the Dart of the computers and the Kotlin of the Quest meet its fixture
      - name: The golden fixture of relief-v1 is what its script writes
        run: python3 .github/desktop/ai/make_relief_golden.py --check

      # The frame work of the 3D videos (release 49): its Python reference and fixture, which the Rust and the Dart meet
      - name: The golden fixture of the 3D videos is what its script writes
        run: python3 .github/desktop/ai/make_relief_video_golden.py --check

      # relief-v2 (release 46) without MI-GAN, on the computers only: its Python reference and fixture
      - name: The golden fixture of relief-v2 is what its script writes
        run: python3 .github/desktop/ai/make_relief_v2_golden.py --check

      # So are scene-v1, the focal length and shift of MoGe, pano-v1 and relief-360-v1, the tiny scene and the XMP
      # samples of phases 2 and 3 (pure Python, the same bytes on every system)
      - name: The golden fixtures and samples of phases 2 and 3 are what their scripts write
        run: |
          python3 .github/desktop/ai/make_scene_fixture.py --check
          python3 .github/desktop/ai/make_scene_golden.py --check
          python3 .github/desktop/ai/make_focal_shift_golden.py --check
          python3 .github/desktop/ai/make_pano_golden.py --check

      # The tiny models that stand for MoGe-2 ViT-S, LaMa and MI-GAN in test/desktop/ai/ort, and the slow one whose run
      # another isolate stops (lot C1): written by a small encoder of ONNX in pure Python, the same bytes everywhere
      - name: The tiny models of ONNX Runtime are what their script writes
        run: python3 .github/desktop/ai/make_tiny_models.py --check

      # The four tiny graphs that stand for those of VOSR 2.0 in the tests of Natural of Enhance (AI) (release 53)
      - name: The tiny graphs of VOSR are what their script writes
        run: python3 .github/desktop/ai/make_tiny_vosr.py --check

      # The synthetic room of the splat scenes (lot SP0): 24 views of two cameras around three boxes, ray cast in pure
      # Python, with their exact poses for the measures of lots SP1 and SP4; the same pixels on every system
      - name: The synthetic dataset of the splat scenes is what its script writes
        run: python3 .github/desktop/ai/make_splat_dataset.py --check

      # The catalogue of the AI components and of the AV2 decoder complete, offline (MODEL-LICENSES.md agrees): the
      # splat scenes of ai-components-4 among them (lot SP14), and the AV2 decoder at the sums of the manifest of the
      # release of immuch360/av2-companion it takes (its copy in .github/desktop/ai)
      - name: The catalogue of the AI components and of the AV2 decoder
        run: python3 .github/desktop/ai/publish_ai_components.py --check

      # An upstream sync brings its own Android and iOS changes; everything else on the desktop branch leaves them alone
      - name: Nothing changed under mobile/android and mobile/ios, nor in the native code of the vendored packages
        if: ${{ !startsWith(github.ref, 'refs/heads/upstream-sync/') && !startsWith(github.head_ref, 'upstream-sync/') }}
        run: python3 .github/desktop/check_phone_projects.py --phone-ref origin/immuch360

      # The plugin baseline of the test job compares names only: a package of the phones moved to another version by a
      # desktop package shows here, in mobile/pubspec.lock against the phone branch
      - name: Packages of the phone builds as on the phone branch
        if: ${{ !startsWith(github.ref, 'refs/heads/upstream-sync/') && !startsWith(github.head_ref, 'upstream-sync/') }}
        run: python3 .github/desktop/check_phone_packages.py --phone-ref origin/immuch360

  test:
    name: Analyze, mobile suite, plugin baseline
    runs-on: ubuntu-24.04
    needs: codegen
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: false
          cache: true

      - name: Install Flutter
        run: cd mobile && mise install

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-dart
          path: mobile

      - name: Flutter dependencies
        working-directory: mobile
        run: |
          tar -xf generated-dart.tar && rm generated-dart.tar
          mise exec -- flutter pub get --enforce-lockfile

      - name: Android and iOS plugin lists equal the baseline
        run: python3 .github/desktop/check_plugin_baseline.py

      - name: Analyze
        working-directory: mobile
        run: mise exec -- flutter analyze

      # Upstream checks the format of lib; the desktop files follow the same rule, the shared files keep upstream's state
      - name: Desktop files formatted
        working-directory: mobile
        run: |
          mise exec -- dart format --output=none --set-exit-if-changed lib/desktop lib/main_desktop.dart \
            test/desktop integration_test/desktop_smoke_test.dart integration_test/desktop_clipboard_test.dart \
            integration_test/desktop_share_test.dart \
            packages/flutter_secure_storage_windows \
            packages/immuch_sbs_codec packages/immuch_head_tracker/lib packages/immuch_head_tracker/hook

      # The Rust JPEG codec of the AI features (mobile/packages/immuch_sbs_codec), in release as its build hook makes
      # it: round trip, ICC profile, quality, subsampling, segments, a panic turned into a status, the C functions.
      # Its Dart side is tested through dart:ffi in the suite below, on the library the hook builds
      - name: Tests of the JPEG codec of the AI features (cargo)
        working-directory: mobile/packages/immuch_sbs_codec/rust
        run: mise exec -- cargo test --release

      # Its format and its lints, warnings as errors; the components may be missing from the toolchain mise installs
      - name: Format and lints of the JPEG codec of the AI features (cargo)
        working-directory: mobile/packages/immuch_sbs_codec/rust
        run: |
          mise exec -- rustup component add clippy rustfmt
          mise exec -- cargo fmt --check
          mise exec -- cargo clippy --all-targets -- -D warnings

      # The fake sd-cli of the 360° panoramas compiled into a real program (no Flutter in it), and immuch360-run, the
      # Linux launcher that makes sd-cli die with the app: the runner and the launcher of lot P2 are tested on them in
      # the suite below (test/desktop/ai/gen, test/desktop/ai/process). The fake COLMAP and the fake Brush of the splat
      # scenes (lot SP0) are compiled the same way, for test/desktop/ai/splat, with the probe of their runners (lot SP4),
      # which the suite kills while COLMAP or Brush runs under it, and splat_probe, the engine of the splat scenes from
      # the photos to the .spz (lot SP6), killed the same way during its training
      - name: The fake sd-cli, the fake COLMAP, the fake Brush, the probes of the splat scenes and the launcher
        id: fake_sd_cli
        working-directory: mobile
        run: |
          mkdir -p "$RUNNER_TEMP/sdcpp-fakes"
          mise exec -- dart compile exe test/desktop/ai/fakes/fake_sd_cli.dart -o "$RUNNER_TEMP/sdcpp-fakes/fake-sd-cli"
          mise exec -- dart compile exe test/desktop/ai/fakes/fake_colmap.dart -o "$RUNNER_TEMP/sdcpp-fakes/fake-colmap"
          mise exec -- dart compile exe test/desktop/ai/fakes/fake_brush.dart -o "$RUNNER_TEMP/sdcpp-fakes/fake-brush"
          mise exec -- dart compile exe test/desktop/ai/tools/splat_runner_probe.dart \
            -o "$RUNNER_TEMP/sdcpp-fakes/splat-runner-probe"
          mise exec -- dart compile exe test/desktop/ai/tools/splat_probe.dart -o "$RUNNER_TEMP/sdcpp-fakes/splat-probe"
          gcc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/sdcpp-fakes/immuch360-run" ../.github/desktop/ai/immuch360_run.c
          echo "fake=$RUNNER_TEMP/sdcpp-fakes/fake-sd-cli" >> "$GITHUB_OUTPUT"
          echo "colmap=$RUNNER_TEMP/sdcpp-fakes/fake-colmap" >> "$GITHUB_OUTPUT"
          echo "brush=$RUNNER_TEMP/sdcpp-fakes/fake-brush" >> "$GITHUB_OUTPUT"
          echo "probe=$RUNNER_TEMP/sdcpp-fakes/splat-runner-probe" >> "$GITHUB_OUTPUT"
          echo "scene=$RUNNER_TEMP/sdcpp-fakes/splat-probe" >> "$GITHUB_OUTPUT"
          echo "launcher=$RUNNER_TEMP/sdcpp-fakes/immuch360-run" >> "$GITHUB_OUTPUT"

      # The fake AV2 companion (lot AD1 of the AV2 videos), compiled the same way: it speaks the protocol of
      # immuch360-av2 over a test pattern, for test/desktop/video/av2 and the playback tested on it
      - name: The fake AV2 companion
        id: fake_av2
        working-directory: mobile
        run: |
          mkdir -p "$RUNNER_TEMP/av2-fakes"
          mise exec -- dart compile exe test/desktop/video/fakes/fake_av2.dart -o "$RUNNER_TEMP/av2-fakes/fake-av2"
          echo "fake=$RUNNER_TEMP/av2-fakes/fake-av2" >> "$GITHUB_OUTPUT"

      # The whole suite: the phone regression gate, test/desktop included. IMMUCH360_REQUIRE_SBS_CODEC turns the skip
      # of the dart:ffi tests of the JPEG codec into a failure: here the build hook must have built the library
      - name: Tests
        working-directory: mobile
        env:
          IMMUCH360_REQUIRE_SBS_CODEC: '1'
          IMMUCH360_FAKE_SD_CLI: ${{ steps.fake_sd_cli.outputs.fake }}
          IMMUCH360_FAKE_COLMAP: ${{ steps.fake_sd_cli.outputs.colmap }}
          IMMUCH360_FAKE_BRUSH: ${{ steps.fake_sd_cli.outputs.brush }}
          IMMUCH360_SPLAT_PROBE: ${{ steps.fake_sd_cli.outputs.probe }}
          IMMUCH360_SPLAT_SCENE_PROBE: ${{ steps.fake_sd_cli.outputs.scene }}
          IMMUCH360_RUN_LAUNCHER: ${{ steps.fake_sd_cli.outputs.launcher }}
          IMMUCH360_FAKE_AV2: ${{ steps.fake_av2.outputs.fake }}
        run: mise exec -- flutter test

      # The head tracker of Spatial 2.5D (mobile/packages/immuch_head_tracker) built with gcc with -Wall -Wextra -Werror,
      # V4L2 for the webcams (none here) and both builds of libfacedetection: its native tests (the box filter, the face
      # states, the eye midpoint, the face followed, the far switch, the One Euro filter against the phones' values,
      # the prediction, the fake cameras, the recorded clip frame by frame and through the y4m fake camera, the plain and
      # AVX2 builds giving the same faces), then the Dart side on that library: the native filter against the Kotlin
      # values, ht_predict against the Dart prediction, the recorded landmark track through the fake camera, and the
      # clip through the raw frame entry point. The clip is decoded by the pinned FFmpeg of the step above
      - name: The head tracker on Linux (native tests and the Dart tests on its library)
        working-directory: mobile
        env:
          IMMUCH360_REQUIRE_HEAD_TRACKER: '1'
        run: |
          work="$RUNNER_TEMP/head-tracker"
          mkdir -p "$work/ffmpeg"
          curl -sSfL --retry 3 -o "$work/ffmpeg.zip" \
            https://github.com/immuch360/libmpv-builds/releases/download/ffmpeg-lgpl-20261118-9/Immuch360-ffmpeg-9.0.2-2-linux-x64.zip
          echo "6a3102ce743507395370c1d4aacb67ea153d065cb05636806af436ca6d2e13f4  $work/ffmpeg.zip" | sha256sum -c -
          (cd "$work/ffmpeg" && unzip -q ../ffmpeg.zip)
          export PATH="$work/ffmpeg/bin:$PATH"
          bash packages/immuch_head_tracker/test_native/run.sh "$work/build" "$work/painted-head-12s.track"
          # The fixture is what the tracker writes from the clip today: the same frames with a face, the same numbers
          # within 0.002 (another compiler may round the detector's last digits otherwise)
          python3 - test/fixtures/spatial/painted-head-12s.track "$work/painted-head-12s.track" <<'PY'
          import sys
          def lines(path):
              return [line.split() for line in open(path) if line.strip() and not line.startswith('#')]
          fixture, made = lines(sys.argv[1]), lines(sys.argv[2])
          if len(fixture) != len(made):
              sys.exit(f'::error::the track has {len(made)} lines, the fixture {len(fixture)}')
          for number, (a, b) in enumerate(zip(fixture, made), 1):
              if len(a) != len(b) or a[0] != b[0] or a[1:2] != b[1:2]:
                  sys.exit(f'::error::line {number} of the track differs: {b} for {a}')
              if any(abs(float(x) - float(y)) > 0.002 for x, y in zip(a[2:], b[2:])):
                  sys.exit(f'::error::line {number} of the track differs by more than 0.002: {b} for {a}')
          print(f'the track of the clip matches the fixture, {len(made)} lines')
          PY
          ls -l "$work/build"/libimmuch_head_tracker*.so
          IMMUCH360_HEAD_TRACKER_LIBRARY="$work/build/libimmuch_head_tracker.so" mise exec -- flutter test \
            test/desktop/spatial/head_tracker_native_test.dart test/desktop/spatial/head_tracker_windows_test.dart \
            test/desktop/spatial/spatial_photo_head_native_test.dart --reporter expanded

      # ONNX Runtime by FFI (lot A4a): test/desktop/ai/ort on the official Linux libraries of 1.31.0, the one the app
      # installs, and of 1.23.2, the last release for Intel Macs (the proof that the table of API 23 holds), one run each
      # since a process keeps the first ONNX Runtime it loads: the depth model, the tiny models of several inputs and
      # outputs, and the stop of a run from another isolate (lot C1); then test/desktop/ai/scene, the engine of the 3D
      # scenes on the tiny models of MoGe-2 and LaMa (lot S1), whose scenes the next step validates, and the engine of
      # the 360° panoramas on those of MoGe-2 and MI-GAN (lot P3). The archives are checked by their SHA-256 and cached
      - name: ONNX Runtime archives cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/onnxruntime
          key: onnxruntime-linux-x64-1.31.0-cc5c72ba-1.23.2-1fa4dcae

      - name: ONNX Runtime by FFI on 1.31.0 and 1.23.2
        working-directory: mobile
        run: |
          ort="$RUNNER_TEMP/onnxruntime"
          mkdir -p "$ort"
          fetch() {
            archive="onnxruntime-linux-x64-$1.tgz"
            [ -f "$ort/$archive" ] || curl -sSfL --retry 3 -o "$ort/$archive" \
              "https://github.com/microsoft/onnxruntime/releases/download/v$1/$archive"
            echo "$2  $ort/$archive" | sha256sum -c -
            tar -xzf "$ort/$archive" -C "$ort"
          }
          fetch 1.31.0 cc5c72baf5ae5c8238a6841f0897227be2d02826b9cf98eaf02fdefaeeb03a57
          fetch 1.23.2 1fa4dcaef22f6f7d5cd81b28c2800414350c10116f5fdd46a2160082551c5f9b
          for version in 1.31.0 1.23.2; do
            echo "ONNX Runtime $version"
            IMMUCH360_ORT_LIB="$ort/onnxruntime-linux-x64-$version/lib/libonnxruntime.so.$version" \
              IMMUCH360_SCENE_OUT="$RUNNER_TEMP/scenes-$version" \
              mise exec -- flutter test test/desktop/ai/ort test/desktop/ai/scene \
                test/desktop/ai/panorama/panorama_engine_ort_test.dart test/desktop/ai/video3d \
                test/desktop/ai/enhance/natural_ort_test.dart
          done

      # A whole 3D video (release 49) with the real FFmpeg program of immuch360/libmpv-builds, checked by its SHA-256,
      # and tiny_vda.onnx: a 4 s clip with a cut made by the program itself, the encoder test (no VA-API on
      # the runner: SVT-AV1), the segments, the mux, st3d read back by the app's own probe
      - name: A 3D video through the real FFmpeg program and the tiny model
        id: video3d_tiny
        working-directory: mobile
        run: |
          work="$RUNNER_TEMP/video3d"
          mkdir -p "$work/ffmpeg"
          curl -sSfL --retry 3 -o "$work/ffmpeg.zip" \
            https://github.com/immuch360/libmpv-builds/releases/download/ffmpeg-lgpl-20261118-9/Immuch360-ffmpeg-9.0.2-2-linux-x64.zip
          echo "6a3102ce743507395370c1d4aacb67ea153d065cb05636806af436ca6d2e13f4  $work/ffmpeg.zip" | sha256sum -c -
          (cd "$work/ffmpeg" && unzip -q ../ffmpeg.zip)
          python3 ../.github/desktop/ai/video3d_ci_clip.py make "$work/ffmpeg/bin/ffmpeg" "$work/clip.mkv"
          export IMMUCH360_VIDEO3D_ARGS="[\"--ffmpeg\",\"$work/ffmpeg\",\"--ort\",\"$RUNNER_TEMP/onnxruntime/onnxruntime-linux-x64-1.31.0/lib/libonnxruntime.so.1.31.0\",\"--model\",\"$PWD/test/fixtures/ai_immersive/tiny_vda.onnx\",\"--out\",\"$work/out\",\"--quality\",\"fast\",\"--segment\",\"1\",\"$work/clip.mkv\"]"
          mise exec -- flutter test test/desktop/ai/video3d/video3d_integration_test.dart --reporter expanded \
            | tee "$work/run.log"
          python3 ../.github/desktop/ai/video3d_ci_clip.py check "$work/run.log"
          # A 360° video made 360° 3D (lot ai-360-3d-51): the six faces through tiny_vda.onnx, the frame top and
          # bottom, st3d and sv3d written into the MP4 and read back by the app, the eyes of a frame compared
          python3 ../.github/desktop/ai/video3d_ci_clip.py make360 "$work/ffmpeg/bin/ffmpeg" "$work/sphere_360.mkv"
          export IMMUCH360_VIDEO3D_ARGS="[\"--ffmpeg\",\"$work/ffmpeg\",\"--ort\",\"$RUNNER_TEMP/onnxruntime/onnxruntime-linux-x64-1.31.0/lib/libonnxruntime.so.1.31.0\",\"--model\",\"$PWD/test/fixtures/ai_immersive/tiny_vda.onnx\",\"--out\",\"$work/out360\",\"--quality\",\"fast\",\"--strength\",\"strong\",\"--segment\",\"1\",\"--sphere\",\"512\",\"$work/sphere_360.mkv\"]"
          mise exec -- flutter test test/desktop/ai/video3d/video3d_integration_test.dart --reporter expanded \
            | tee "$work/run360.log"
          python3 ../.github/desktop/ai/video3d_ci_clip.py check360 "$work/run360.log"
          # Sound and picture over a long film: 12 segments joined by the concat list of the engine, each with its
          # exact length, end on the grid (the Matroska durations alone lose about 0.6 ms a segment)
          python3 ../.github/desktop/ai/video3d_ci_clip.py drift "$work/ffmpeg/bin/ffmpeg" "$work/drift"
          # Every audio decoder the app counts on is in the program, and no other
          python3 ../.github/desktop/ai/video3d_ci_clip.py decoders "$work/ffmpeg/bin/ffmpeg" \
            lib/desktop/ai/video3d/video_source.dart

      # The real model (lot L06 of the desktop parity plan, 21 November 2026): Video Depth Anything Small of
      # ai-components-5, the file the app downloads, checked by the sum of the catalogue and cached, on ONNX Runtime
      # 1.23.2, the last release for Intel Macs and the one the app installs there, through the same FFmpeg program and
      # clip as the step above. The same checks: 100 frames, st3d left right, the cut at frame 50
      - name: Video Depth Anything Small archive cache
        if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vda
          key: video-depth-anything-small-ff810849-eb5926ad

      # The FFmpeg program and the clip of the step above
      - name: A 3D video with the real model on ONNX Runtime 1.23.2
        if: ${{ !cancelled() && steps.video3d_tiny.outcome == 'success' }}
        working-directory: mobile
        run: |
          set -o pipefail
          work="$RUNNER_TEMP/video3d"
          model="$RUNNER_TEMP/vda/video-depth-anything-small-dynamic-fp32.onnx"
          mkdir -p "$RUNNER_TEMP/vda"
          [ -f "$model" ] || curl -sSfL --retry 3 -o "$model" \
            https://github.com/freeKC/Immuch360/releases/download/ai-components-5/video-depth-anything-small-dynamic-fp32.onnx
          echo "eb5926ad36741e911c43cb010cc2f74604aa524744feeaf57979c178ede4bb99  $model" | sha256sum -c -
          ort="$RUNNER_TEMP/onnxruntime/onnxruntime-linux-x64-1.23.2/lib/libonnxruntime.so.1.23.2"
          export IMMUCH360_VIDEO3D_ARGS="[\"--ffmpeg\",\"$work/ffmpeg\",\"--ort\",\"$ort\",\"--model\",\"$model\",\"--out\",\"$work/out-real\",\"--quality\",\"fast\",\"--segment\",\"1\",\"$work/clip.mkv\"]"
          start=$(date +%s)
          mise exec -- flutter test test/desktop/ai/video3d/video3d_integration_test.dart --reporter expanded \
            | tee "$work/run-real.log"
          python3 ../.github/desktop/ai/video3d_ci_clip.py check "$work/run-real.log"
          echo "the real model on ONNX Runtime 1.23.2 (Linux x64): $(( $(date +%s) - start )) s for the 4 s clip" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # The glTF-Validator of Khronos on the 3D scenes of phase 2 (lot S1; design-final 2026-10-27, section 8.2): the
      # fixture of make_scene_fixture.py, the one the engine wrote with the fakes (tiny_scene3D_dart.jpg, which the
      # Kotlin of the Quest reads too), and the scenes the engine wrote on the tiny models with each ONNX Runtime, the
      # step above. No error and no warning. The npm package gltf-validator 2.0.0-dev.3.10 (Apache-2.0) is a tool of
      # the CI only, its archive checked by its SHA-256 (the same as the integrity the npm registry gives)
      - name: The 3D scenes pass the glTF-Validator of Khronos
        working-directory: mobile
        run: |
          validator="$RUNNER_TEMP/gltf-validator"
          mkdir -p "$validator"
          curl -sSfL --retry 3 -o "$validator/gltf-validator.tgz" \
            https://registry.npmjs.org/gltf-validator/-/gltf-validator-2.0.0-dev.3.10.tgz
          echo "4e03dbdc3bc0d1342afd5d2d7ae341a7e3474502ccb872b02dbbaddaee0fdec6  $validator/gltf-validator.tgz" \
            | sha256sum -c -
          tar -xzf "$validator/gltf-validator.tgz" -C "$validator"
          node --version
          node ../.github/desktop/ai/validate_scenes.mjs "$validator/package" \
            test/fixtures/ai_immersive/tiny_scene3D.jpg test/fixtures/ai_immersive/tiny_scene3D_dart.jpg \
            "$RUNNER_TEMP"/scenes-*/*.jpg

  linux:
    name: Linux build
    runs-on: ubuntu-22.04
    needs: codegen
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The list of the Flutter Linux setup (clang, CMake, Ninja, GTK, liblzma, libstdc++ 12 for the clang of 22.04),
      # libsecret for flutter_secure_storage_linux, WebKitGTK 4.1 and libsoup 3 for desktop_webview_window (the OAuth
      # window of flutter_web_auth_2), patchelf for the RUNPATH of the libraries in the .deb and the .rpm, the headers
      # of libmpv for media_kit_video (libmpv-dev, which brings libmpv1, the libmpv of Ubuntu 22.04, for the video tests
      # and the start below; the app links none: IMMUCH360-NOTE.md of media_kit_video in immuch360/media_kit_360, patch
      # 8), and the virtual screen of that start with its captures (Xvfb, xwd, ImageMagick), sqlite3 to read the app's
      # log, gdb and xwininfo to tell what a start that does not get on was doing, xdotool for the Esc that closes the
      # splat viewer, and rpm2cpio and cpio to open the .rpm. azure.archive.ubuntu.com, the runner's mirror, served them
      # at 45 kB/s three times on 22 and 23 October 2026 and the job waited for its timeout: apt_install.sh downloads
      # them in three attempts of 150 s at most, the second and the third on another mirror, then installs them; the
      # step stops after 10 minutes in any case
      - name: Linux build packages
        timeout-minutes: 10
        run: |
          sudo sh .github/desktop/packaging/linux/apt_install.sh \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev patchelf libmpv-dev xvfb xauth x11-apps \
            x11-utils imagemagick sqlite3 gdb xdotool rpm2cpio cpio xclip

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: false
          cache: true

      - name: Install Flutter
        run: cd mobile && mise install

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-dart
          path: mobile

      - name: Generated files
        working-directory: mobile
        run: tar -xf generated-dart.tar && rm generated-dart.tar

      # dart_smb2 downloads a libsmb2.so built on glibc 2.38, which Ubuntu 22.04 and Debian 12 do not have: the same
      # sources are built here on 22.04 and bundled instead (mobile/packages/dart_smb2/IMMUCH360-NOTE.md). libsmb2 is
      # under the LGPL: the script builds it offline from the archive of its sources that the code generation packed,
      # the asset every build of the app carries, and checks the exported functions against the release's library and
      # the glibc it asks for. The same archive is a file of every release
      - name: libsmb2 built on Ubuntu 22.04 from the archive of its sources
        id: libsmb2
        env:
          LABEL: ${{ needs.codegen.outputs.label }}
        run: |
          asset=mobile/packages/dart_smb2/libsmb2/Immuch360-libsmb2-sources.tar.gz
          bash .github/desktop/libsmb2/build_linux.sh "$RUNNER_TEMP/libsmb2" "$asset"
          sources="$RUNNER_TEMP/libsmb2-sources/Immuch360-Desktop-$LABEL-libsmb2-sources.tar.gz"
          mkdir -p "$(dirname "$sources")"
          cp "$asset" "$sources"
          echo "sources=$sources" >> "$GITHUB_OUTPUT"

      - name: Upload the libsmb2 sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.libsmb2.outputs.sources }}
          archive: false
          retention-days: 14
          if-no-files-found: error

      # The label reaches the app as IMMUCH360_DESKTOP_LABEL, for the version line of its About box (the three systems,
      # mobile/lib/utils/app_version_label.dart), the same text as `immuch360 --version`
      - name: Build
        working-directory: mobile
        env:
          BUILD_NUMBER: ${{ needs.codegen.outputs.build_number }}
          LABEL: ${{ needs.codegen.outputs.label }}
          IMMUCH360_LIBSMB2: ${{ runner.temp }}/libsmb2/libsmb2.so
        run: |
          mise exec -- flutter pub get --enforce-lockfile
          mise exec -- flutter build linux --release -t lib/main_desktop.dart --build-number "$BUILD_NUMBER" \
            --dart-define=IMMUCH360_DESKTOP_LABEL="$LABEL"

      # nFPM, one static program pinned by its version and its SHA-256, makes both packages from one description; the
      # libraries the ELF files of the bundle link are listed first, for the dependencies the packages declare
      - name: Packages (.deb and .rpm)
        id: packages
        env:
          LABEL: ${{ needs.codegen.outputs.label }}
          NFPM_VERSION: '2.47.0'
          NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
        run: |
          bundle=mobile/build/linux/x64/release/bundle
          for file in "$bundle/immuch360" "$bundle"/lib/*.so*; do objdump -p "$file" | awk '/NEEDED/ {print $2}'; done \
            | sort | uniq -c
          curl -sSfL -o "$RUNNER_TEMP/nfpm.tar.gz" \
            "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "$NFPM_SHA256  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP" nfpm
          python3 .github/desktop/desktop_installers.py linux --bundle "$bundle" --label "$LABEL" --out dist \
            --nfpm "$RUNNER_TEMP/nfpm"
          echo "deb=dist/Immuch360-Desktop-$LABEL-linux-amd64.deb" >> "$GITHUB_OUTPUT"
          echo "rpm=dist/Immuch360-Desktop-$LABEL-linux-x86_64.rpm" >> "$GITHUB_OUTPUT"

      # libsmb2 (dart_smb2, LGPL-2.1-or-later) in the .deb as a user installs it: the library, the notice and the LGPL
      # in the copyright file, and the assets of the package with the archive of its sources, byte for byte the release
      # file
      - name: libsmb2, its notice and its sources in the .deb
        env:
          DEB: ${{ steps.packages.outputs.deb }}
          SOURCES: ${{ steps.libsmb2.outputs.sources }}
        run: |
          dpkg-deb --fsys-tarfile "$DEB" > "$RUNNER_TEMP/deb.tar"
          tar -tf "$RUNNER_TEMP/deb.tar" > "$RUNNER_TEMP/deb.txt"
          assets=./opt/immuch360/data/flutter_assets/packages/dart_smb2/libsmb2
          for file in ./opt/immuch360/lib/libsmb2.so "$assets/NOTICE" "$assets/COPYING" "$assets/LICENCE-LGPL-2.1.txt" \
            "$assets/Immuch360-libsmb2-sources.tar.gz"; do
            grep -qxF "$file" "$RUNNER_TEMP/deb.txt" || { echo "::error::no $file in the .deb"; exit 1; }
          done
          tar -xOf "$RUNNER_TEMP/deb.tar" "$assets/Immuch360-libsmb2-sources.tar.gz" | cmp - "$SOURCES" \
            || { echo "::error::the libsmb2 sources in the .deb are not the release file"; exit 1; }
          tar -xOf "$RUNNER_TEMP/deb.tar" ./usr/share/doc/immuch360/copyright > "$RUNNER_TEMP/copyright"
          grep -q '^License: LGPL-2.1-or-later' "$RUNNER_TEMP/copyright" \
            || { echo "::error::no libsmb2 section in the copyright file of the .deb"; exit 1; }
          echo "the .deb holds libsmb2.so, its notice and licence texts, and the sources"
          sha256sum "$SOURCES"

      # The same in the .rpm, which nFPM makes from the same staged folder: the library, the assets of the package with
      # the archive of its sources, byte for byte the release file, and the notice and licence texts of
      # /usr/share/licenses
      - name: libsmb2, its notice and its sources in the .rpm
        env:
          RPM: ${{ steps.packages.outputs.rpm }}
          SOURCES: ${{ steps.libsmb2.outputs.sources }}
        run: |
          # The rpm2cpio of Ubuntu 22.04 exits 1 on the .rpm of nFPM though it writes the whole payload: cpio, which fails
          # on an archive cut short, and the checks below judge it
          rpm2cpio "$RPM" > "$RUNNER_TEMP/rpm.cpio" || true
          cpio -t --quiet < "$RUNNER_TEMP/rpm.cpio" > "$RUNNER_TEMP/rpm-files.txt"
          sed -e 's|^\./|/|' -e 's|^\([^/]\)|/\1|' "$RUNNER_TEMP/rpm-files.txt" > "$RUNNER_TEMP/rpm.txt"
          assets=/opt/immuch360/data/flutter_assets/packages/dart_smb2/libsmb2
          licences=/usr/share/licenses/immuch360/libsmb2
          for file in /opt/immuch360/lib/libsmb2.so "$assets/NOTICE" "$assets/COPYING" "$assets/LICENCE-LGPL-2.1.txt" \
            "$assets/Immuch360-libsmb2-sources.tar.gz" "$licences/NOTICE" "$licences/COPYING" \
            "$licences/LICENCE-LGPL-2.1.txt"; do
            grep -qxF "$file" "$RUNNER_TEMP/rpm.txt" || { echo "::error::no $file in the .rpm"; exit 1; }
          done
          cpio -i --quiet --to-stdout "*$assets/Immuch360-libsmb2-sources.tar.gz" < "$RUNNER_TEMP/rpm.cpio" \
            | cmp - "$SOURCES" || { echo "::error::the libsmb2 sources in the .rpm are not the release file"; exit 1; }
          echo "the .rpm holds libsmb2.so, its notice and licence texts, and the sources"

      # The Rust JPEG codec of the AI features, built by the hook of mobile/packages/immuch_sbs_codec, in lib/ of the
      # bundle and of both packages (the file lists of the two steps above); check_package.sh then finds every library
      # it needs in the five distributions
      - name: The JPEG codec of the AI features in the bundle and the packages
        run: |
          codec=mobile/build/linux/x64/release/bundle/lib/libimmuch_sbs_codec.so
          if [ ! -f "$codec" ]; then
            echo "::error::no libimmuch_sbs_codec.so in the bundle"
            ls "$(dirname "$codec")"
            exit 1
          fi
          objdump -p "$codec" | awk '/NEEDED|RUNPATH/'
          grep -qxF ./opt/immuch360/lib/libimmuch_sbs_codec.so "$RUNNER_TEMP/deb.txt" \
            || { echo "::error::no libimmuch_sbs_codec.so in the .deb"; exit 1; }
          grep -qxF /opt/immuch360/lib/libimmuch_sbs_codec.so "$RUNNER_TEMP/rpm.txt" \
            || { echo "::error::no libimmuch_sbs_codec.so in the .rpm"; exit 1; }
          echo "libimmuch_sbs_codec.so: $(stat -c %s "$codec") bytes, in the bundle, the .deb and the .rpm"

      # The head tracker of Spatial 2.5D (FFI plugin mobile/packages/immuch_head_tracker, built by CMake with the app's
      # -Wall -Werror): the tracker and both builds of libfacedetection in lib/ of the bundle and of both packages, the
      # tracker linking no camera library (V4L2 is the kernel's interface, no libv4l)
      - name: The head tracker in the bundle and the packages
        run: |
          lib=mobile/build/linux/x64/release/bundle/lib
          for name in libimmuch_head_tracker.so libimmuch_head_tracker_detect.so libimmuch_head_tracker_detect_avx2.so; do
            if [ ! -f "$lib/$name" ]; then
              echo "::error::no $name in the bundle"
              ls "$lib"
              exit 1
            fi
            grep -qxF "./opt/immuch360/lib/$name" "$RUNNER_TEMP/deb.txt" || { echo "::error::no $name in the .deb"; exit 1; }
            grep -qxF "/opt/immuch360/lib/$name" "$RUNNER_TEMP/rpm.txt" || { echo "::error::no $name in the .rpm"; exit 1; }
            echo "$name: $(stat -c %s "$lib/$name") bytes, sha256 $(sha256sum "$lib/$name" | cut -c1-64)"
          done
          objdump -p "$lib/libimmuch_head_tracker.so" | awk '/NEEDED/ {print $2}' | tee "$RUNNER_TEMP/ht-needed.txt"
          if grep -qiE 'v4l|camera|pipewire' "$RUNNER_TEMP/ht-needed.txt"; then
            echo "::error::the head tracker links a camera library"
            exit 1
          fi

      # The AppImage (issue 22, release 52): the bundle staged as for the packages, laid out as an AppDir whose AppRun
      # looks for the libraries of the system before the start and says which packages to install, with the command
      # of the distribution, then made by appimagetool with the type 2 runtime, both pinned by their SHA-256 with the
      # corresponding source of the runtime (packaging/linux/appimage/appimage.lock.json). Built here on Ubuntu 22.04
      # for its glibc, as the packages. Like them it takes GTK 3, WebKitGTK 4.1, libsecret and libmpv from the system
      # (study of 24 November 2026 in the release 52 notes: a libmpv of the project for Linux is the next step)
      - name: AppImage
        id: appimage
        env:
          LABEL: ${{ needs.codegen.outputs.label }}
        run: |
          python3 .github/desktop/desktop_installers.py appimage-tools --out "$RUNNER_TEMP/appimage-tools"
          python3 .github/desktop/desktop_installers.py appimage --bundle mobile/build/linux/x64/release/bundle \
            --label "$LABEL" --out "$RUNNER_TEMP/appimage" --tools "$RUNNER_TEMP/appimage-tools"
          mkdir -p dist
          mv "$RUNNER_TEMP/appimage/Immuch360-Desktop-$LABEL-linux-x86_64.AppImage" dist/
          echo "appimage=dist/Immuch360-Desktop-$LABEL-linux-x86_64.AppImage" >> "$GITHUB_OUTPUT"

      # What the AppImage holds, read from a copy extracted here (the runner has no FUSE for the AppImage either):
      # libsmb2 with its notice, licence and sources, byte for byte the release file, the codec of the AI features,
      # and the source of the runtime as the lock pins it; then its own check of the libraries on the runner, which has
      # GTK, WebKitGTK, libsecret and the libmpv1 of Ubuntu 22.04 (the step "Linux build packages")
      - name: libsmb2, its sources and the source of the runtime in the AppImage, and its check on the runner
        env:
          APPIMAGE: ${{ steps.appimage.outputs.appimage }}
          SOURCES: ${{ steps.libsmb2.outputs.sources }}
        run: |
          rm -rf "$RUNNER_TEMP/appimage-check"
          mkdir -p "$RUNNER_TEMP/appimage-check"
          cp "$APPIMAGE" "$RUNNER_TEMP/appimage-check/check.AppImage"
          (cd "$RUNNER_TEMP/appimage-check" && ./check.AppImage --appimage-extract > /dev/null)
          root="$RUNNER_TEMP/appimage-check/squashfs-root"
          assets=immuch360/data/flutter_assets/packages/dart_smb2/libsmb2
          for file in immuch360/lib/libsmb2.so immuch360/lib/libimmuch_sbs_codec.so "$assets/NOTICE" "$assets/COPYING" \
            "$assets/LICENCE-LGPL-2.1.txt" usr/share/licenses/immuch360/libsmb2/NOTICE usr/share/doc/immuch360/copyright \
            usr/share/doc/immuch360/appimage-runtime/RUNTIME-NOTICE.txt; do
            [ -f "$root/$file" ] || { echo "::error::no $file in the AppImage"; exit 1; }
          done
          cmp "$root/$assets/Immuch360-libsmb2-sources.tar.gz" "$SOURCES" \
            || { echo "::error::the libsmb2 sources in the AppImage are not the release file"; exit 1; }
          python3 - "$root/usr/share/doc/immuch360/appimage-runtime" <<'EOF'
          import hashlib, json, pathlib, sys
          lock = json.loads(pathlib.Path('.github/desktop/packaging/linux/appimage/appimage.lock.json').read_text())
          for entry in lock['sources']:
              data = (pathlib.Path(sys.argv[1]) / entry['file']).read_bytes()
              if hashlib.sha256(data).hexdigest() != entry['sha256']:
                  sys.exit(f'::error::{entry["file"]} in the AppImage is not the file the lock pins')
              print(f'{entry["file"]}: {len(data)} bytes, the source the lock pins')
          EOF
          ./"$APPIMAGE" --appimage-extract-and-run --version
          ./"$APPIMAGE" --appimage-extract-and-run --immuch360-check
          echo "the AppImage: $(stat -c %s "$APPIMAGE") bytes, SHA-256 $(sha256sum "$APPIMAGE" | cut -c1-64)"

      - name: Upload the AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.appimage.outputs.appimage }}
          archive: false
          retention-days: 14
          if-no-files-found: error

      - name: Upload the .deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.packages.outputs.deb }}
          archive: false
          retention-days: 14
          if-no-files-found: error

      - name: Upload the .rpm
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.packages.outputs.rpm }}
          archive: false
          retention-days: 14
          if-no-files-found: error

      # The fake AV2 companion (lot AD1 of the AV2 videos), for the AV2 videos played by the system's libmpv below
      - name: The fake AV2 companion
        id: fake_av2
        working-directory: mobile
        run: |
          mkdir -p "$RUNNER_TEMP/av2-fakes"
          mise exec -- dart compile exe test/desktop/video/fakes/fake_av2.dart -o "$RUNNER_TEMP/av2-fakes/fake-av2"
          echo "fake=$RUNNER_TEMP/av2-fakes/fake-av2" >> "$GITHUB_OUTPUT"

      # The tests of test/desktop that need a real libmpv, skipped by the test job (no libmpv there), here with the
      # libmpv1 of Ubuntu 22.04, the oldest the packages accept (libmpv_for_tests.dart): FFmpeg's answer to a camera's
      # Digest challenge (the Tapo live view), the references a file may not open, the app's player on a path and
      # through the media bridge (the folders, the shares and the server), the y4m of an AV2 companion (the fake), its
      # duration and its seeks by byte ranges with the FFmpeg 4.4 of Ubuntu 22.04 (lot AD3 of the AV2 videos), and the
      # frames of a splat scene taken from a video filmed upright (exact seeks and frame steps, the rotation of the
      # file, the sharpest moment kept)
      - name: Desktop tests on the system's libmpv
        working-directory: mobile
        env:
          IMMUCH360_FAKE_AV2: ${{ steps.fake_av2.outputs.fake }}
        run: |
          mise exec -- flutter test test/desktop/video/camera_live_libmpv_test.dart \
            test/desktop/video/mpv_references_test.dart test/desktop/video/desktop_player_libmpv_test.dart \
            test/desktop/video/av2/av2_libmpv_test.dart test/desktop/ai/splat/video_frames_libmpv_test.dart

      # The probe of the graphics cards of the AI features (lot C6, linux/runner/gpu_probe.cc): the app of the bundle
      # started with --immuch360-gpu-probe=<file> must answer within 10 s without crashing; the runner has no graphics
      # card, so what it found is printed, not asked for. Run after a failed test above too
      - name: The probe of the graphics cards of the build
        if: ${{ !cancelled() }}
        working-directory: mobile
        env:
          IMMUCH360_GPU_PROBE_REAL: build/linux/x64/release/bundle/immuch360
        run: mise exec -- flutter test test/desktop/ai/gpu/gpu_probe_real_test.dart

      # The copy of photos and videos to the clipboard (lib/desktop/clipboard, linux/runner/clipboard_channel.cc) in a
      # debug app on a virtual screen, read back by xclip as a paste would read it: text/uri-list and
      # x-special/gnome-copied-files for the files, image/png for the picture of one photo at its size; then xclip
      # copies something else and the copies of remote files go. Run after a failed test above too
      - name: The copy to the clipboard in a built app (xvfb, xclip)
        if: ${{ !cancelled() }}
        working-directory: mobile
        timeout-minutes: 25
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            mise exec -- flutter test integration_test/desktop_clipboard_test.dart -d linux --reporter expanded

      # The release build started with a 6 second clip as a file opened with the program, on a virtual screen with
      # software rendering: the app must still run, the picture must change over 5 seconds of playback and the app's
      # log must hold no error of its players (packaging/linux/video_smoke.sh); the picture must come through the
      # hardware path of media_kit_video, which llvmpipe serves on this screen (EXPECT_RENDERING). The captures are an
      # artifact. Run after a failed test above too, once the packages are made
      - name: A video played on a virtual screen
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        env:
          EXPECT_RENDERING: H/W
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" sh .github/desktop/packaging/linux/video_smoke.sh \
            mobile/build/linux/x64/release/bundle/immuch360 "$PWD/mobile/test/fixtures/video/flat-6s.mp4" video-smoke

      - name: Upload the video start
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-video-smoke
          path: video-smoke/
          retention-days: 14
          if-no-files-found: ignore

      # The release build started with a small splat as a file opened with the program, on the same kind of virtual
      # screen: the splat viewer must open at once in its WebKitGTK window (the patched desktop_webview_window), its
      # page served by the app's media bridge must say ready with lit pixels, the app's log must hold no error of
      # the page and nothing in the catch all, and Esc must close the viewer as the user's close with the app still
      # running (packaging/linux/splat_smoke.sh). Mesa's software renderer draws: no frame rate is asked. The output, the log lines and the capture are an artifact. Run after a failed test above
      # too, once the packages are made
      - name: A splat shown on a virtual screen
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" sh .github/desktop/packaging/linux/splat_smoke.sh \
            mobile/build/linux/x64/release/bundle/immuch360 "$PWD/mobile/test/fixtures/splat_viewer/room_floor.spz" \
            splat-smoke

      - name: Upload the splat start
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-splat-smoke
          path: splat-smoke/
          retention-days: 14
          if-no-files-found: ignore

      # The splat scenes on Linux end to end (lot L03 of the desktop parity plan, 21 November 2026; offered on Linux
      # since release 51): COLMAP and Brush of ai-components-4 as the app downloads them, checked by the sums of the
      # catalogue and installed with their licences, then the 24 views of make_splat_dataset.py (two cameras) made
      # into a scene by the engine of the app (splat_probe, the engine of lot SP6, COLMAP and Brush started through
      # the immuch360-run of the archive). The card is what the probe of the graphics cards of this build reports,
      # chosen by the rule of the gate (splatCardIn, which splatCardOf takes): the runner has no graphics card, so
      # Mesa's software Vulkan (lavapipe) is installed here and taken by --software-card, the override of the gate's
      # refusal that only this check uses; 30 steps at 128 pixels. The .spz must be written from every view placed,
      # and read by the probe of the app. A real dedicated card (NVIDIA proprietary Vulkan, RADV) stays unproven on
      # Linux
      - name: A splat scene made by the engine of the app with COLMAP and Brush of ai-components-4 (lavapipe)
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        timeout-minutes: 30
        working-directory: mobile
        run: |
          set -o pipefail
          sudo sh ../.github/desktop/packaging/linux/apt_install.sh mesa-vulkan-drivers
          work="$RUNNER_TEMP/splat-e2e"
          mkdir -p "$work/mirror" "$work/out"
          for asset in colmap-cpu-linux-x64.zip brush-vulkan-linux-x64.zip; do
            curl -sSfL --retry 3 -o "$work/mirror/$asset" \
              "https://github.com/freeKC/Immuch360/releases/download/ai-components-4/$asset"
          done
          mise exec -- dart compile exe test/desktop/ai/tools/splat_probe.dart -o "$work/splat-probe"
          "$work/splat-probe" install --mirror "$work/mirror" --components "$work/components" --platform linux \
            | tee "$work/install.log"
          python3 ../.github/desktop/ai/make_splat_dataset.py --out "$work/dataset"
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          timeout 60 build/linux/x64/release/bundle/immuch360 --immuch360-gpu-probe="$work/gpu.json"
          cat "$work/gpu.json"
          echo
          "$work/splat-probe" run --components "$work/components" --photos "$work/dataset/images" --out "$work/out" \
            --name room --work-root "$work/work" --steps 30 --resolution 128 --card "report:$work/gpu.json" \
            --software-card --need-mib 0 --stall-seconds 900 \
            --launcher "$work/components/engines/colmap-cpu-linux-x64/immuch360-run" \
            --env "VK_ICD_FILENAMES=$VK_ICD_FILENAMES" | tee "$work/run.log"
          python3 ../.github/desktop/ai/splat_e2e_check.py "$work/run.log" --views 24

      - name: Upload the splat scene made on Linux
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-splat-e2e
          path: |
            ${{ runner.temp }}/splat-e2e/out/
            ${{ runner.temp }}/splat-e2e/*.log
            ${{ runner.temp }}/splat-e2e/gpu.json
          retention-days: 14
          if-no-files-found: ignore

      # Issue 24 (desktop 31 to 34): on Linux, Sharpen and Rebuild details took the main file of the archive of sd-cli
      # (its first program by the order of the paths, mainPath: immuch360-run) as sd-cli, so the launcher started
      # itself, printed its usage and ended with 2. No job ran these levels from the files the app takes from its
      # installed components: the sdcpp jobs start sd-cli and the launcher apart, the Mac job names sd-cli itself. Here
      # the published archives of sd-cli of both levels (ai-components-3 and 7) and x4plus, checked by the sums of the
      # catalogue and unpacked as the app installs them (programs in mode 755), then enhance_files_test.dart: the
      # published immuch360-run starts the published sd-cli of each level with the command of the app, low and not low,
      # and Sharpen of a small picture runs to its end through them on Mesa's software Vulkan (lavapipe), its size checked
      # as in the app. The lines the test prints must be there: a test skipped for want of its files fails the step
      - name: Sharpen and Rebuild details through the published launcher and sd-cli of the components (lavapipe)
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        timeout-minutes: 30
        working-directory: mobile
        run: |
          set -o pipefail
          sudo sh ../.github/desktop/packaging/linux/apt_install.sh mesa-vulkan-drivers
          work="$RUNNER_TEMP/enhance-linux"
          root="$work/components"
          mkdir -p "$work/mirror" "$root/models/realesrgan"
          base=https://github.com/freeKC/Immuch360/releases/download
          while read -r tag asset sum; do
            curl -sSfL --retry 3 -o "$work/mirror/$asset" "$base/$tag/$asset"
            echo "$sum  $work/mirror/$asset" | sha256sum -c -
          done <<'EOF'
          ai-components-3 sd-cpp-vulkan-linux-x64.zip 5e7052dc93eec36ad156974e7f56bd7fa13df3482b412935848319680cb5d535
          ai-components-7 sd-cpp-seedvr2-vulkan-linux-x64.zip 62ae653e2d3e49ba4c9e62741adb69e3c43e18d35a85bf2f13397ef8c798cf29
          ai-components-3 RealESRGAN_x4plus.pth 4fa0d38905f75ac06eb49a7951b426670021be3018265fd191d2125df9d682f1
          EOF
          for id in sd-cpp-vulkan-linux-x64 sd-cpp-seedvr2-vulkan-linux-x64; do
            mkdir -p "$root/engines/$id"
            unzip -q "$work/mirror/$id.zip" -d "$root/engines/$id"
            chmod 755 "$root/engines/$id/immuch360-run" "$root/engines/$id/sd-cli"
            sha256sum "$root/engines/$id/immuch360-run"
          done
          cp "$work/mirror/RealESRGAN_x4plus.pth" "$root/models/realesrgan/RealESRGAN_x4plus.pth"
          # ggml leaves a Vulkan device of the CPU type out of its list unless it is named (27 s for 64 x 64 on ai1)
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json GGML_VK_VISIBLE_DEVICES=0
          IMMUCH360_ENHANCE_COMPONENTS="$root" IMMUCH360_ENHANCE_DEVICE=Vulkan0 \
            mise exec -- flutter test test/desktop/ai/enhance/enhance_files_test.dart --reporter expanded \
            | tee "$work/run.log"
          for line in 'sharpen: .*/sd-cpp-vulkan-linux-x64/immuch360-run -> .*/sd-cpp-vulkan-linux-x64/sd-cli$' \
            'rebuild: .*/sd-cpp-seedvr2-vulkan-linux-x64/immuch360-run -> .*/sd-cpp-seedvr2-vulkan-linux-x64/sd-cli$' \
            '^Sharpen 96 x 64 on Vulkan0: '; do
            grep -Eq "$line" "$work/run.log" || { echo "::error::not in the log: $line"; exit 1; }
          done

  # Each package installed as a user would install it, in a clean container: the package manager brings the
  # dependencies the package declares, then every library the ELF files need must be found, libmpv and libsmb2 among
  # them, the desktop entry must be valid, the MIME types of the raw camera files registered, and the installed app
  # must play a short video on a virtual screen with the distribution's libmpv (check_package.sh --video) and show a
  # small splat in the splat viewer with the distribution's WebKitGTK (SPLAT, splat_smoke.sh). The oldest
  # and newest Ubuntu LTS, Debian stable, Fedora 40 and the newest Fedora. On Fedora the H.264 clip needs Cisco's
  # openh264, which the check installs first; when Cisco's repository cannot be reached from the runner, the H.264
  # clip is played for information only and the same picture in Theora is the one that must play, with a warning.
  # The packages are checked once uploaded, even when a later step of the linux job failed (its tests, its video start)
  linux-packages:
    name: Linux package on ${{ matrix.image }}
    runs-on: ubuntu-24.04
    needs: linux
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            package: deb
            slug: ubuntu-22.04
          - image: ubuntu:24.04
            package: deb
            slug: ubuntu-24.04
          - image: debian:12
            package: deb
            slug: debian-12
          # Mesa 24.1 of Fedora 40 draws the virtual screen with llvmpipe, which compiles its shaders with LLVM 18 for
          # the runner's processor: on the Intel Xeon 6975P-C and Platinum 8573C runners, its AVX-512 code crashes
          # libLLVM.so.18.1 (llvm::X86InstrInfo::unfoldMemoryOperand) at the first frame of Flutter's Impeller, before
          # any video (desktop run 43749726425, 15 November 2026, every attempt on those processors). Not a fault of the
          # package: Fedora 44's Mesa and LLVM draw on the same runners. GALLIUM_OVERRIDE_CPU_CAPS=avx makes Mesa see
          # the processor as an AVX one (no AVX2, no AVX-512), so llvmpipe stays Fedora 40's own software renderer, on
          # LLVM still, and the video and the splat checks run as before (probe run 43753896359 of the branch
          # ci-fedora40-48-probe: avx passed on the 6975P-C where the default, 128 and 256 bit vectors crashed;
          # softpipe plays the video but has no WebGL2 for the splat). Only this container, only the CI's virtual
          # screen: the package and what it installs are unchanged
          - image: fedora:40
            package: rpm
            slug: fedora-40
            mesa_cpu_caps: avx
          - image: fedora:44
            package: rpm
            slug: fedora-44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Immuch360-Desktop-*-linux-*
          merge-multiple: true
          # Each artifact is one file uploaded as it is: kept whole, the two ZIPs too, under its own name
          skip-decompress: true
          path: dist

      - name: Install and check
        env:
          IMAGE: ${{ matrix.image }}
          PACKAGE: ${{ matrix.package }}
          # The processor Mesa's llvmpipe compiles for, capped in the container where the matrix says so (fedora:40,
          # see its entry above); empty elsewhere
          MESA_CPU_CAPS: ${{ matrix.mesa_cpu_caps || '' }}
        run: |
          # The status of check_package.sh through the pipe to tee, not tee's: the step runs under bash -e only
          set -o pipefail
          file=$(cd dist && ls ./*."$PACKAGE")
          mkdir -p video-smoke
          mesa=()
          if [ -n "$MESA_CPU_CAPS" ]; then
            mesa=(-e "GALLIUM_OVERRIDE_CPU_CAPS=$MESA_CPU_CAPS")
            cpu=$(sed -n 's/^model name\s*:\s*//p' /proc/cpuinfo | head -n 1)
            echo "::notice title=$IMAGE::GALLIUM_OVERRIDE_CPU_CAPS=$MESA_CPU_CAPS in the container: Mesa's llvmpipe" \
              "compiles for an $MESA_CPU_CAPS processor on the CI's virtual screen (runner $cpu)"
          fi
          # The core of a crash of the app is written in the container (/tmp/core.<pid>), where video_smoke.sh prints
          # its stack; the runner's own handler (apport) keeps nothing of a process in a container
          echo '/tmp/core.%p' | sudo tee /proc/sys/kernel/core_pattern
          status=0
          docker run --rm --ulimit core=-1 "${mesa[@]}" -v "$PWD/dist:/pkgs:ro" \
            -v "$PWD/.github/desktop/packaging/linux:/check:ro" -v "$PWD/mobile/test/fixtures/video:/clips:ro" \
            -v "$PWD/mobile/test/fixtures/splat_viewer:/splats:ro" -e SPLAT=/splats/room_floor.spz \
            -v "$PWD/video-smoke:/out" "$IMAGE" \
            sh /check/check_package.sh "/pkgs/${file#./}" --video /clips/flat-6s.mp4 /out /clips/flat-6s-theora.mkv \
            | tee "$RUNNER_TEMP/check.log" || status=$?
          no_h264='H.264 not available in this container (openh264 repository unreachable), Theora clip used'
          if grep -qF "$no_h264" "$RUNNER_TEMP/check.log"; then
            echo "::warning title=$IMAGE::$no_h264"
          fi
          if grep -q 'crashed.*: made once more' "$RUNNER_TEMP/check.log"; then
            echo "::warning title=$IMAGE::a start of the app crashed and was made once more (its stack is in the log)"
          fi
          exit "$status"

      - name: Upload the video start
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-video-smoke-${{ matrix.slug }}
          path: video-smoke/
          retention-days: 14
          if-no-files-found: ignore

  # The AppImage run as a user who downloads it would run it, in a clean container where no package of the app is
  # installed (packaging/linux/check_appimage.sh): its check on the bare system must say which packages to install, with
  # the command of the distribution, that very command is run, then every library is found, its files and licences
  # are there, it still runs 20 seconds after a start on a virtual screen, and it plays a short video with the
  # distribution's libmpv (the Theora clip on Fedora and openSUSE, whose FFmpeg may lack H.264). FUSE is not there in
  # a container: the AppImage runs with --appimage-extract-and-run, and the video check runs the AppRun of a copy
  # extracted once. Arch Linux (the distribution of issue 22), Fedora 44, Debian 12, Ubuntu 22.04 and openSUSE
  # Tumbleweed. Checked once uploaded, even when a later step of the linux job failed
  linux-appimage:
    name: Linux AppImage on ${{ matrix.image }}
    runs-on: ubuntu-24.04
    needs: linux
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    # The two rolling images (archlinux:latest, opensuse/tumbleweed:latest) change under the release: in a release (a
    # desktop-v* tag) a failure there shows as a failed job and a warning, without stopping the release; Fedora 44,
    # Debian 12 and Ubuntu 22.04 still hold it, and every other run holds all five
    continue-on-error: ${{ matrix.rolling && startsWith(github.ref, 'refs/tags/desktop-v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: archlinux:latest
            slug: archlinux
            rolling: true
          - image: fedora:44
            slug: fedora-44
            rolling: false
          - image: debian:12
            slug: debian-12
            rolling: false
          - image: ubuntu:22.04
            slug: ubuntu-22.04
            rolling: false
          - image: opensuse/tumbleweed:latest
            slug: opensuse-tumbleweed
            rolling: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Immuch360-Desktop-*-linux-x86_64.AppImage
          merge-multiple: true
          skip-decompress: true
          path: dist

      - name: Run and check
        env:
          IMAGE: ${{ matrix.image }}
          ROLLING: ${{ matrix.rolling }}
        run: |
          set -o pipefail
          file=$(cd dist && ls ./*.AppImage)
          mkdir -p video-smoke
          echo '/tmp/core.%p' | sudo tee /proc/sys/kernel/core_pattern
          status=0
          docker run --rm --ulimit core=-1 -v "$PWD/dist:/pkgs:ro" \
            -v "$PWD/.github/desktop/packaging/linux:/check:ro" -v "$PWD/mobile/test/fixtures/video:/clips:ro" \
            -v "$PWD/video-smoke:/out" "$IMAGE" \
            sh /check/check_appimage.sh "/pkgs/${file#./}" /clips/flat-6s.mp4 /out /clips/flat-6s-theora.mkv \
            | tee "$RUNNER_TEMP/check.log" || status=$?
          if grep -q 'the video check failed once: made once more' "$RUNNER_TEMP/check.log"; then
            echo "::warning title=$IMAGE::the video check of the AppImage failed once and was made once more"
          fi
          if [ "$status" != 0 ] && [ "$ROLLING" = true ] && [ "${GITHUB_REF#refs/tags/desktop-v}" != "$GITHUB_REF" ]; then
            echo "::warning title=$IMAGE::the AppImage check failed on this rolling image; the release goes on, look at it before the delivery reply"
          fi
          exit "$status"

      - name: Upload the video start
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-appimage-smoke-${{ matrix.slug }}
          path: video-smoke/
          retention-days: 14
          if-no-files-found: ignore

  # The AUR package immuch360-bin (packaging/linux/aur, written for issue 22; the AUR account is the owner's): namcap on
  # its PKGBUILD and on the package, .SRCINFO as makepkg --printsrcinfo writes it, the package made by makepkg from
  # the .deb of the desktop release the PKGBUILD names (its SHA-256 checked) and installed with the dependencies of
  # Arch, then its version, its libraries, libmpv and its desktop entry (packaging/linux/aur/check_aur.sh). It reads a
  # published release, not this build, so it never runs in a release (a desktop-v* tag, or this workflow called by
  # immuch360-desktop-release.yml), where a GitHub or Arch mirror hiccup or a new namcap rule would stop the release
  # for a file the release does not carry. The PKGBUILD moves to the next release only once that release is
  # published; this job (or check_aur.sh in an archlinux container) is then run once before the push to the AUR
  linux-aur:
    name: AUR package immuch360-bin
    runs-on: ubuntu-24.04
    if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') && github.workflow != 'Immuch360 Desktop release' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: namcap, makepkg and the package installed in archlinux
        run: |
          docker run --rm -v "$PWD/.github/desktop/packaging/linux/aur:/aur:ro" archlinux:latest sh /aur/check_aur.sh

  windows:
    name: Windows desktop tests, build and ZIP
    runs-on: windows-2022
    needs: codegen
    if: github.event_name != 'push' || github.ref == 'refs/heads/desktop' || startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise's Flutter package (aqua) names the Unix launchers bin/flutter and bin/dart, while a Windows host runs
      # bin\flutter.bat: the same version through the Flutter action, kept equal to mobile/mise.toml by check_workflow.py
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          flutter --version
          flutter doctor -v
          python --version

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-dart
          path: mobile

      # The build hook of upstream's native core (native/native_core) compiles its Rust in every flutter test and build
      # here. The toolchain of rust-toolchain.toml with the runner's own target only, named for the hook through
      # RUSTUP_TOOLCHAIN as mise does on the other jobs, so that rustup does not add the twelve targets of the file; a
      # runner without rustup fails here rather than in the middle of the tests
      - name: Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' native/crates/native_core_ffi/rust-toolchain.toml)
          rustup --version
          rustup toolchain install "$channel" --profile minimal --target x86_64-pc-windows-msvc
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"

      # The Rust JPEG codec of the AI features (mobile/packages/immuch_sbs_codec) on the MSVC target the app ships,
      # in release as its build hook makes it; its Dart side runs in the desktop tests below, through dart:ffi
      - name: Tests of the JPEG codec of the AI features (cargo)
        working-directory: mobile/packages/immuch_sbs_codec/rust
        run: cargo test --release

      - name: Flutter dependencies
        working-directory: mobile
        run: |
          tar -xf generated-dart.tar && rm generated-dart.tar
          flutter pub get --enforce-lockfile

      # onnxruntime.dll of the official archive of ONNX Runtime 1.31.0 for test/desktop/ai/ort (lot A4a), checked by its
      # SHA-256; the archive (83 MB, most of it the debug symbols left out here) is cached
      - name: ONNX Runtime archive cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/onnxruntime
          key: onnxruntime-win-x64-1.31.0-3958d8a4

      - name: ONNX Runtime 1.31.0 for the tests
        id: ort
        run: |
          ort="$(cygpath -u "$RUNNER_TEMP")/onnxruntime"
          archive="$ort/onnxruntime-win-x64-1.31.0.zip"
          mkdir -p "$ort"
          [ -f "$archive" ] || curl -sSfL --retry 3 -o "$archive" \
            https://github.com/microsoft/onnxruntime/releases/download/v1.31.0/onnxruntime-win-x64-1.31.0.zip
          echo "3958d8a44984160692c1b4ffd0de3cb48f8c39f9d34bb31e433db06e30b82195  $archive" | sha256sum -c -
          python - "$(cygpath -w "$archive")" "$(cygpath -w "$ort")" <<'PY'
          import pathlib, sys, zipfile
          archive, out = sys.argv[1], pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(archive) as bundle:
              (out / 'onnxruntime.dll').write_bytes(bundle.read('onnxruntime-win-x64-1.31.0/lib/onnxruntime.dll'))
          PY
          echo "lib=$(cygpath -w "$ort/onnxruntime.dll")" >> "$GITHUB_OUTPUT"

      # The runtime of the graphics card of the 3D videos (lot ai-360-3d-51): onnxruntime.dll of the official NuGet
      # package Microsoft.ML.OnnxRuntime.DirectML 1.24.4 (MIT), checked by its SHA-256, made into the files of the
      # prerelease ai-components-6 (published since release 51; the artifact ai-components-6-candidate holds the files
      # of this run), its sizes and sums held to the catalogue (ai_components_manifest.dart), for the tests and probes
      # below; the app downloads it like the other components. No DirectML.dll: the library calls the one of Windows.
      # The runner has no graphics card; DirectML runs on WARP there, which the app never takes as a card, the tests
      # and probes below do (--allow-software)
      - name: The DirectML runtime of the graphics card
        id: ort_card
        run: |
          out="$(cygpath -u "$RUNNER_TEMP")/ai-components-6"
          plain="$(cygpath -u "$RUNNER_TEMP")/ort-directml"
          python .github/desktop/ai/gpu_runtime.py --out "$(cygpath -w "$out")" --plain "$(cygpath -w "$plain")"
          echo "lib=$(cygpath -w "$plain/onnxruntime.dll")" >> "$GITHUB_OUTPUT"
          echo "plain=$(cygpath -w "$plain")" >> "$GITHUB_OUTPUT"
          echo "out=$(cygpath -w "$out")" >> "$GITHUB_OUTPUT"
          ls -l "$out" "$plain"
          powershell -NoProfile -Command '(Get-Item C:\Windows\System32\DirectML.dll).VersionInfo.FileVersion' \
            || echo "no DirectML.dll in System32"

      - name: Upload the files of ai-components-6 made by this run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-components-6-candidate
          path: ${{ steps.ort_card.outputs.out }}
          retention-days: 14
          if-no-files-found: error

      # The fake sd-cli of the 360° panoramas, for the tests of the runner and of the job object below (lot P2),
      # sdcpp_probe, the program that runs a real generation through the same runner and launcher on a PC with a
      # graphics card (the essay of lot P2), and panorama_probe, the engine of the panoramas on the same PC (the essay
      # of lot P3), all compiled by dart compile exe without Flutter; kept together as the artifact
      # Immuch360-AI-tools-windows-x64, a name no release takes. The fake COLMAP and the fake Brush of the splat scenes
      # (lot SP0) join them, for test/desktop/ai/splat, and the probe of their runners (lot SP4), which the suite kills
      # while COLMAP or Brush runs under it, and which runs the archives of COLMAP and Brush on the PC of the essay; and
      # splat_probe (lot SP6), the engine of the splat scenes from the photos to the .spz, which installs the archives
      # of a mirror once and makes a scene on the PC of the essay, killed by the suite during its training; and
      # enhance_probe (release 51), the engine of Enhance (AI) on one photo with the files of the published components
      - name: The fake sd-cli, COLMAP and Brush, and the probes of a generation, a panorama and the splat scenes
        id: fake_sd_cli
        working-directory: mobile
        run: |
          tools="$(cygpath -u "$RUNNER_TEMP")/sdcpp-tools"
          mkdir -p "$tools"
          dart compile exe test/desktop/ai/fakes/fake_sd_cli.dart -o "$tools/fake-sd-cli.exe"
          dart compile exe test/desktop/ai/fakes/fake_colmap.dart -o "$tools/fake-colmap.exe"
          dart compile exe test/desktop/ai/fakes/fake_brush.dart -o "$tools/fake-brush.exe"
          dart compile exe test/desktop/ai/tools/sdcpp_probe.dart -o "$tools/sdcpp-probe.exe"
          dart compile exe test/desktop/ai/tools/panorama_probe.dart -o "$tools/panorama-probe.exe"
          dart compile exe test/desktop/ai/tools/splat_runner_probe.dart -o "$tools/splat-runner-probe.exe"
          dart compile exe test/desktop/ai/tools/splat_probe.dart -o "$tools/splat_probe.exe"
          dart compile exe test/desktop/ai/tools/depth_provider_probe.dart -o "$tools/depth-provider-probe.exe"
          dart compile exe test/desktop/ai/tools/enhance_probe.dart -o "$tools/enhance-probe.exe"
          echo "fake=$(cygpath -w "$tools/fake-sd-cli.exe")" >> "$GITHUB_OUTPUT"
          echo "colmap=$(cygpath -w "$tools/fake-colmap.exe")" >> "$GITHUB_OUTPUT"
          echo "brush=$(cygpath -w "$tools/fake-brush.exe")" >> "$GITHUB_OUTPUT"
          echo "probe=$(cygpath -w "$tools/splat-runner-probe.exe")" >> "$GITHUB_OUTPUT"
          echo "scene=$(cygpath -w "$tools/splat_probe.exe")" >> "$GITHUB_OUTPUT"
          echo "tools=$(cygpath -w "$tools")" >> "$GITHUB_OUTPUT"

      # The fake AV2 companion (lot AD1 of the AV2 videos), for test/desktop/video/av2 on Windows
      - name: The fake AV2 companion
        id: fake_av2
        working-directory: mobile
        run: |
          fakes="$(cygpath -u "$RUNNER_TEMP")/av2-fakes"
          mkdir -p "$fakes"
          dart compile exe test/desktop/video/fakes/fake_av2.dart -o "$fakes/fake-av2.exe"
          echo "fake=$(cygpath -w "$fakes/fake-av2.exe")" >> "$GITHUB_OUTPUT"

      - name: Upload the fake sd-cli and the probe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Immuch360-AI-tools-windows-x64
          path: ${{ steps.fake_sd_cli.outputs.tools }}
          retention-days: 14
          if-no-files-found: error

      # A whole 3D video (release 49) with the signed FFmpeg program of immuch360/libmpv-builds, checked by its SHA-256,
      # and tiny_vda.onnx: h264_mf of Media Foundation when its one second test passes on the runner, else SVT-AV1
      - name: A 3D video through the real FFmpeg program and the tiny model
        working-directory: mobile
        env:
          ORT_LIB: ${{ steps.ort.outputs.lib }}
          ORT_CARD_LIB: ${{ steps.ort_card.outputs.lib }}
        run: |
          work="$(cygpath -u "$RUNNER_TEMP")/video3d"
          mkdir -p "$work/ffmpeg"
          curl -sSfL --retry 3 -o "$work/ffmpeg.zip" \
            https://github.com/immuch360/libmpv-builds/releases/download/ffmpeg-lgpl-20261118-9/Immuch360-ffmpeg-9.0.2-2-windows-x64.zip
          echo "7b76b85a6dde6e2e9d7ad84ec695c033e9151578297167b21482591770d14a5e  $work/ffmpeg.zip" | sha256sum -c -
          (cd "$work/ffmpeg" && unzip -q ../ffmpeg.zip)
          python ../.github/desktop/ai/video3d_ci_clip.py make "$(cygpath -w "$work/ffmpeg/bin/ffmpeg.exe")" "$(cygpath -w "$work/clip.mkv")"
          IMMUCH360_VIDEO3D_ARGS="$(python - "$(cygpath -w "$work")" "$ORT_LIB" "$(cygpath -w "$PWD/test/fixtures/ai_immersive/tiny_vda.onnx")" <<'PY'
          import json, os, sys
          work, ort, model = sys.argv[1:4]
          print(json.dumps(['--ffmpeg', work + '\\ffmpeg', '--ort', ort, '--model', model, '--out', work + '\\out',
                            '--quality', 'fast', '--segment', '1', '--card', os.environ['ORT_CARD_LIB'],
                            '--allow-software', work + '\\clip.mkv']))
          PY
          )"
          export IMMUCH360_VIDEO3D_ARGS
          flutter test test/desktop/ai/video3d/video3d_integration_test.dart --reporter expanded | tee "$work/run.log"
          python ../.github/desktop/ai/video3d_ci_clip.py check "$(cygpath -w "$work/run.log")"
          # A 360° video made 360° 3D (lot ai-360-3d-51), with the encoder of the runner
          python ../.github/desktop/ai/video3d_ci_clip.py make360 "$(cygpath -w "$work/ffmpeg/bin/ffmpeg.exe")" "$(cygpath -w "$work/sphere_360.mkv")"
          IMMUCH360_VIDEO3D_ARGS="$(python - "$(cygpath -w "$work")" "$ORT_LIB" "$(cygpath -w "$PWD/test/fixtures/ai_immersive/tiny_vda.onnx")" <<'PY'
          import json, os, sys
          work, ort, model = sys.argv[1:4]
          print(json.dumps(['--ffmpeg', work + '\\ffmpeg', '--ort', ort, '--model', model, '--out', work + '\\out360',
                            '--quality', 'fast', '--strength', 'strong', '--segment', '1', '--sphere', '512',
                            '--card', os.environ['ORT_CARD_LIB'], '--allow-software', work + '\\sphere_360.mkv']))
          PY
          )"
          export IMMUCH360_VIDEO3D_ARGS
          flutter test test/desktop/ai/video3d/video3d_integration_test.dart --reporter expanded | tee "$work/run360.log"
          python ../.github/desktop/ai/video3d_ci_clip.py check360 "$(cygpath -w "$work/run360.log")"
          # Where the depth model ran, as the job logs say it (the card of the runner is WARP, counted here only)
          grep -h -o '"line":"[^"]*\(graphics card\|depth model\|check of\|timings of\)[^"]*"' "$work/run.log" "$work/run360.log" || true

      # IMMUCH360_REQUIRE_SBS_CODEC: the dart:ffi tests of the JPEG codec fail rather than skip without the library
      - name: Desktop tests on Windows (paths, file locking, DPAPI, the CI scripts, ONNX Runtime, the job object)
        working-directory: mobile
        env:
          IMMUCH360_ORT_LIB: ${{ steps.ort.outputs.lib }}
          IMMUCH360_ORT_CARD_LIB: ${{ steps.ort_card.outputs.lib }}
          IMMUCH360_REQUIRE_SBS_CODEC: '1'
          IMMUCH360_FAKE_SD_CLI: ${{ steps.fake_sd_cli.outputs.fake }}
          IMMUCH360_FAKE_AV2: ${{ steps.fake_av2.outputs.fake }}
          IMMUCH360_FAKE_COLMAP: ${{ steps.fake_sd_cli.outputs.colmap }}
          IMMUCH360_FAKE_BRUSH: ${{ steps.fake_sd_cli.outputs.brush }}
          IMMUCH360_SPLAT_PROBE: ${{ steps.fake_sd_cli.outputs.probe }}
          IMMUCH360_SPLAT_SCENE_PROBE: ${{ steps.fake_sd_cli.outputs.scene }}
        run: flutter test test/desktop

      - name: Build
        working-directory: mobile
        env:
          BUILD_NUMBER: ${{ needs.codegen.outputs.build_number }}
          LABEL: ${{ needs.codegen.outputs.label }}
        run: >-
          flutter build windows --release -t lib/main_desktop.dart --build-number "$BUILD_NUMBER"
          --dart-define=IMMUCH360_DESKTOP_LABEL="$LABEL"

      # The Release folder plus the Visual C++ runtime, without dartjni.dll, each DLL import checked against what a
      # clean Windows has, and the file version of the executable checked; the debug symbols, if the build made any,
      # apart
      - name: Folder and ZIP
        id: bundle
        env:
          LABEL: ${{ needs.codegen.outputs.label }}
          FILE_VERSION: ${{ needs.codegen.outputs.file_version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          zip="dist/Immuch360-Desktop-$LABEL-windows-x64.zip"
          python .github/desktop/windows_bundle.py --release mobile/build/windows/x64/runner/Release --out dist \
            --zip "$zip" --symbols dist/symbols --file-version "$FILE_VERSION" --info "version=$LABEL" \
            --info "file version=$FILE_VERSION" --info "commit=$GITHUB_SHA" --info "built by=$RUN_URL"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      # libsmb2 (dart_smb2, LGPL-2.1-or-later) in the ZIP as a user unzips it: the DLL, its notice and licence texts in
      # licenses/libsmb2, and the assets of the package with the archive of its sources, byte for byte the asset packed
      # by the code generation, the release file of the linux job
      - name: libsmb2, its notice and its sources in the ZIP
        env:
          ZIP: ${{ steps.bundle.outputs.zip }}
        run: |
          python - "$ZIP" mobile/packages/dart_smb2/libsmb2/Immuch360-libsmb2-sources.tar.gz <<'PY'
          import hashlib, pathlib, sys, zipfile
          archive, sources = sys.argv[1], pathlib.Path(sys.argv[2])
          top = 'Immuch360 Desktop/'
          assets = top + 'data/flutter_assets/packages/dart_smb2/libsmb2/'
          wanted = [top + 'libsmb2.dll'] + [folder + name for folder in (top + 'licenses/libsmb2/', assets)
                                            for name in ('NOTICE', 'COPYING', 'LICENCE-LGPL-2.1.txt')]
          wanted.append(assets + 'Immuch360-libsmb2-sources.tar.gz')
          with zipfile.ZipFile(archive) as bundle:
              names = set(bundle.namelist())
              missing = [name for name in wanted if name not in names]
              if missing:
                  sys.exit('::error::not in the ZIP: ' + ', '.join(missing))
              packed = bundle.read(assets + 'Immuch360-libsmb2-sources.tar.gz')
          if packed != sources.read_bytes():
              sys.exit('::error::the libsmb2 sources in the ZIP are not the archive packed')
          print('the ZIP holds libsmb2.dll, its notice and licence texts, and the sources')
          print(hashlib.sha256(packed).hexdigest())
          PY

      # View in headset (media_kit_360 built with MEDIA_KIT_360_XR, mobile/windows/CMakeLists.txt): the Khronos OpenXR
      # loader next to the executable, with its row in NOTICES.md and the Apache-2.0 text (Apache-2.0 OR MIT)
      - name: The OpenXR loader and its notice in the ZIP
        env:
          ZIP: ${{ steps.bundle.outputs.zip }}
        run: |
          python - "$ZIP" <<'PY'
          import sys, zipfile
          top = 'Immuch360 Desktop/'
          with zipfile.ZipFile(sys.argv[1]) as bundle:
              names = set(bundle.namelist())
              missing = [name for name in (top + 'openxr_loader.dll', top + 'licenses/NOTICES.md',
                                           top + 'licenses/Apache-2.0.txt') if name not in names]
              if missing:
                  sys.exit('::error::not in the ZIP: ' + ', '.join(missing))
              if b'openxr_loader.dll' not in bundle.read(top + 'licenses/NOTICES.md'):
                  sys.exit('::error::licenses/NOTICES.md of the ZIP does not list openxr_loader.dll')
          print('the ZIP holds openxr_loader.dll, its row in NOTICES.md and licenses/Apache-2.0.txt')
          PY

      # The Rust JPEG codec of the AI features next to the executable, whose imports windows_bundle.py has checked
      - name: The JPEG codec of the AI features in the ZIP
        env:
          ZIP: ${{ steps.bundle.outputs.zip }}
        run: |
          python - "$ZIP" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as bundle:
              info = next((i for i in bundle.infolist() if i.filename == 'Immuch360 Desktop/immuch_sbs_codec.dll'), None)
          if info is None:
              sys.exit('::error::no immuch_sbs_codec.dll next to immuch360.exe in the ZIP')
          print(f'immuch_sbs_codec.dll: {info.file_size} bytes in the ZIP')
          PY

      # The head tracker of Spatial 2.5D (immuch_head_tracker): its DLL, the two builds of the face detector, and the
      # licence of libfacedetection (BSD-3-Clause) that the detector builds carry; windows_bundle.py has checked that
      # the tracker does not import Media Foundation (loaded at run time, for the Windows N editions)
      - name: The head tracker and the licence of its face detector in the ZIP
        env:
          ZIP: ${{ steps.bundle.outputs.zip }}
        run: |
          python - "$ZIP" mobile/packages/immuch_head_tracker/third_party/libfacedetection/LICENSE <<'PY'
          import hashlib, pathlib, sys, zipfile
          archive, licence = sys.argv[1], pathlib.Path(sys.argv[2])
          top = 'Immuch360 Desktop/'
          dlls = ('immuch_head_tracker.dll', 'immuch_head_tracker_detect.dll', 'immuch_head_tracker_detect_avx2.dll')
          wanted = [top + name for name in dlls] + [top + 'licenses/libfacedetection/LICENSE']
          with zipfile.ZipFile(archive) as bundle:
              # The listing of what sits next to immuch360.exe, for the record of the run
              for info in sorted(bundle.infolist(), key=lambda i: i.filename.lower()):
                  rest = info.filename[len(top):]
                  if info.filename.startswith(top) and '/' not in rest and rest.lower().endswith(('.exe', '.dll')):
                      print(f'  {rest}: {info.file_size} bytes')
              missing = [name for name in wanted if name not in bundle.namelist()]
              if missing:
                  sys.exit('::error::not in the ZIP: ' + ', '.join(missing))
              for name in dlls:
                  data = bundle.read(top + name)
                  print(f'{name}: {len(data)} bytes, sha256 {hashlib.sha256(data).hexdigest()}')
                  # The face model of libfacedetection is compiled into each detector build (no file to download)
                  if name != 'immuch_head_tracker.dll' and len(data) < 200_000:
                      sys.exit(f'::error::{name} is {len(data)} bytes: too small to hold the face model')
              tracker = bundle.read(top + 'immuch_head_tracker.dll')
              for symbol in (b'ht_api_version', b'ht_list_cameras', b'ht_open_camera', b'ht_predict'):
                  if symbol not in tracker:
                      sys.exit(f'::error::immuch_head_tracker.dll of the ZIP does not export {symbol.decode()}')
              packed = bundle.read(top + 'licenses/libfacedetection/LICENSE')
          if packed.replace(b'\r\n', b'\n') != licence.read_bytes().replace(b'\r\n', b'\n'):
              sys.exit('::error::licenses/libfacedetection/LICENSE in the ZIP is not the vendored LICENSE')
          print('the ZIP holds the head tracker, both face detector builds and the licence of libfacedetection')
          PY

      # The installer of the same folder as the ZIP (Inno Setup 6 of the runner image): for one user or for every
      # user of the PC, "Open with" for the types of .github/desktop/file-associations.json, an uninstaller
      - name: Installer
        id: installer
        env:
          LABEL: ${{ needs.codegen.outputs.label }}
          FILE_VERSION: ${{ needs.codegen.outputs.file_version }}
        run: |
          python .github/desktop/desktop_installers.py windows --bundle "dist/Immuch360 Desktop" --label "$LABEL" \
            --file-version "$FILE_VERSION" --out dist
          setup="dist/Immuch360-Desktop-$LABEL-windows-x64-setup.exe"
          echo "setup=$setup" >> "$GITHUB_OUTPUT"
          zip="${{ steps.bundle.outputs.zip }}"
          {
            echo "### Immuch360 Desktop for Windows x64"
            echo
            echo "| File | Size | SHA-256 |"
            echo "|---|---|---|"
            for file in "$setup" "$zip"; do
              echo "| \`$(basename "$file")\` | $(( $(stat -c %s "$file") / 1048576 )) MB | \`$(sha256sum "$file" | cut -d' ' -f1)\` |"
            done
            echo
            echo "File version $FILE_VERSION. Unsigned build: SmartScreen may ask for a confirmation, Smart App Control blocks it."
          } >> "$GITHUB_STEP_SUMMARY"

      # Uploaded as they are, so that the download is the file itself and not a ZIP around it
      - name: Upload the ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.bundle.outputs.zip }}
          archive: false
          retention-days: 14
          if-no-files-found: error

      - name: Upload the installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.installer.outputs.setup }}
          archive: false
          retention-days: 14
          if-no-files-found: error

      # The minidumps of the Logs page are read with them as long as a build is in use: 90 days for a release (tag),
      # as the symbols of the Android builds
      - name: Upload the debug symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: immuch360-desktop-windows-x64-symbols
          path: dist/symbols/
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 14 }}
          if-no-files-found: ignore

      # The desktop tests of the first step skip what needs the DLLs of a build (libmpv, ANGLE, the decoder probe),
      # which did not exist yet. Run here on the build itself, after the ZIP was made from it, so that the libmpv the
      # ZIP ships is the one checked: FFmpeg's answer to a camera's Digest challenge with the percent-encoded account,
      # no account or rtsp:// address in mpv's lines (camera_live_libmpv_test), the references a file may not open
      # (mpv_references_test), the app's player on a path and through the media bridge (desktop_player_libmpv_test),
      # the GLSL of renderer C compiled and drawn by ANGLE (plugin_shaders_windows_test: the hosted runners have no GPU,
      # so ANGLE's Direct3D 11 device is Windows' Basic Render Driver, which draws in software), the y4m of an AV2
      # companion (the fake) with its duration and its seeks (av2_libmpv_test), the frames of a splat scene taken from
      # a video filmed upright (video_frames_libmpv_test). The tests that need a GPU's video decoder or mpv drawing
      # into ANGLE (decoder_probe_windows_test, libmpv_probe_test) stay on the PC.
      # The head tracker's test opens a recorded clip through Media Foundation, the same reader as a webcam. Windows
      # Server has Media Foundation as a feature the runner image may not install: added here, without the restart it
      # asks for; the test says so if the clip still does not open.
      - name: Media Foundation for the head tracker test
        shell: pwsh
        run: |
          $files = 'mfplat.dll', 'mfreadwrite.dll', 'mf.dll', 'msmpeg2vdec.dll'
          $missing = $files | Where-Object { -not (Test-Path (Join-Path $env:SystemRoot "System32\$_")) }
          if ($missing) {
            Write-Host "Not in System32: $($missing -join ', '); adding the Server-Media-Foundation feature"
            try {
              $result = Install-WindowsFeature Server-Media-Foundation
              Write-Host "Success: $($result.Success), restart needed: $($result.RestartNeeded), exit code: $($result.ExitCode)"
            } catch {
              Write-Host "::warning::Server-Media-Foundation could not be added: $_"
            }
          }
          foreach ($file in $files) {
            Write-Host "$file in System32: $(Test-Path (Join-Path $env:SystemRoot "System32\$file"))"
          }

      # With the head tracker of the build (Spatial 2.5D): the recorded clip through the Media Foundation file reader
      # and through the camera path ("file:"), both builds of the detector, the raw frame entry point
      # (head_tracker_windows_test), and the native filter against the phones' values, the prediction, the recorded
      # landmark track through the fake camera (head_tracker_native_test). No webcam: the runners have none.
      - name: Desktop tests on the build (libmpv, ANGLE, head tracker)
        working-directory: mobile
        env:
          IMMUCH360_BUILD_DIR: build/windows/x64/runner/Release
          IMMUCH360_FAKE_AV2: ${{ steps.fake_av2.outputs.fake }}
          IMMUCH360_REQUIRE_HEAD_TRACKER: '1'
        run: |
          flutter test test/desktop/video/camera_live_libmpv_test.dart test/desktop/video/mpv_references_test.dart \
            test/desktop/video/desktop_player_libmpv_test.dart test/desktop/video/av2/av2_libmpv_test.dart \
            test/desktop/ai/splat/video_frames_libmpv_test.dart test/desktop/spatial/head_tracker_windows_test.dart \
            test/desktop/spatial/head_tracker_native_test.dart test/desktop/spatial/spatial_photo_head_native_test.dart

      # The head tracker as the ZIP ships it, not as the build folder holds it: the ZIP unpacked in a folder of its own,
      # then the same tests on its DLLs (the clip through Media Foundation and both detector builds, whose face model is
      # compiled in; the recorded track through the fake camera; the 2.5D photo page following that track). A ZIP
      # without the tracker, or with DLLs that do not load or do not find faces, fails here.
      - name: The head tracker of the ZIP itself
        working-directory: mobile
        env:
          ZIP: ${{ steps.bundle.outputs.zip }}
          IMMUCH360_REQUIRE_HEAD_TRACKER: '1'
        shell: bash
        run: |
          unpacked="$RUNNER_TEMP/zip-head-tracker"
          python - "$GITHUB_WORKSPACE/$ZIP" "$unpacked" <<'PY'
          import pathlib, sys, zipfile
          target = pathlib.Path(sys.argv[2])
          target.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(sys.argv[1]) as bundle:
              bundle.extractall(target)
          for dll in sorted((target / 'Immuch360 Desktop').glob('immuch_head_tracker*.dll')):
              print(f'{dll.name}: {dll.stat().st_size} bytes, unpacked from the ZIP')
          PY
          IMMUCH360_BUILD_DIR="$unpacked/Immuch360 Desktop" flutter test test/desktop/spatial/head_tracker_windows_test.dart \
            test/desktop/spatial/head_tracker_native_test.dart test/desktop/spatial/spatial_photo_head_native_test.dart \
            --reporter expanded

      # The Spatial 2.5D passes of the video plugin in a built app (media_kit_360 patch 17, renderer C, here on WARP):
      # a side by side clip of random dots with a nearer square, played then paused, its views at three viewpoints,
      # the disparity map and a VR180 eye read through SpatialStats and its probe. flutter test builds the test as a
      # debug app and runs it in a window
      - name: The Spatial passes on a stereo clip in a built app (WARP)
        working-directory: mobile
        timeout-minutes: 20
        run: flutter test integration_test/desktop_spatial_video_test.dart -d windows --reporter expanded

      # The copy of photos and videos to the clipboard of Windows (lib/desktop/clipboard,
      # windows/runner/clipboard_channel.cpp) in a debug app, read back by Windows PowerShell as a paste would read it:
      # the file drop list with "Preferred DropEffect" set to copy, the bitmap and the PNG of one photo at its size;
      # then Set-Clipboard copies something else and the copies of remote files go
      - name: The copy to the clipboard in a built app
        working-directory: mobile
        timeout-minutes: 20
        run: flutter test integration_test/desktop_clipboard_test.dart -d windows --reporter expanded

      # "Share with Windows…" where Windows has no share window (lot share 54, windows/runner/share_channel.cpp):
      # Windows Server 2022 says DataTransferManager.IsSupported is false, so the Share menu leaves the entry out; a
      # share asked anyway gets no request from the system and ends as "did not open". Windows Server 2025, which has
      # the share window, runs the other scenarios in the windows-share job
      - name: The share window where Windows has none, in a built app
        working-directory: mobile
        timeout-minutes: 20
        run: >-
          flutter test integration_test/desktop_share_test.dart -d windows --reporter expanded
          --dart-define=IMMUCH360_SHARE_SCENARIO=unsupported

      # The probe of the graphics cards of the AI features (lot C6, windows/runner/gpu_probe.cpp): the app of the build
      # started with --immuch360-gpu-probe=<file>, as the app starts it, must answer within 10 s without crashing. The
      # hosted runners have no graphics card, so what it found is printed, not asked for
      - name: The probe of the graphics cards of the build
        working-directory: mobile
        env:
          IMMUCH360_GPU_PROBE_REAL: build/windows/x64/runner/Release/immuch360.exe
        run: flutter test test/desktop/ai/gpu/gpu_probe_real_test.dart

      # The app of the ZIP started on a database an older build left behind: the tables and indexes of schema 35 at
      # user_version 34, as a build at 34 leaves a database a build at 35 had migrated (desktop builds 6 to 8 failed
      # every start on it with "duplicate column name: group_date"). It must bring the database to 35 and keep running
      - name: Start on a database left by an older build
        timeout-minutes: 10
        run: |
          python .github/desktop/packaging/windows/start_on_old_database.py \
            --exe "dist/Immuch360 Desktop/immuch360.exe" \
            --fixture mobile/test/drift/main/fixtures/desktop_v35_at_user_version_34.sql --out old-database-start

      - name: Upload the start on the old database
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-old-database-start
          path: old-database-start/
          retention-days: 14
          if-no-files-found: ignore

  # "Share with Windows…" of the Share menu (lot share 54) on Windows Server 2025, whose share window asks for the files
  # as Windows 11 does (Server 2022 has none: the windows job checks that side). Two runs of the built app, one
  # scenario each, since Windows asks nothing for a second share window of the same app while the first is open (and
  # the one of a runner stays open: "Try that again", Windows Server has no program to share to):
  # - old: desktop build 35's order through the real share_plus 10.1.4, which answers before the window asks for the
  #   files; the file deleted in that answer, as build 35 did, is gone when the window asks (a watcher of the runner
  #   counts it);
  # - new: the share of the menu: a missing file fails at once with the reason of Windows and the file's name only;
  #   a fetched file moves into the folder of the copies, the window asks for it and gets it, and the folder stays
  #   while the window is open.
  # Not on tags: a release does not wait for the share window of a server image. The image of Windows Server 2025
  # has Visual Studio 2026 only, whose compiler refuses the /await option one plugin builds with unless its
  # deprecation is silenced (CL, read by cl.exe itself; with a dash, since Git Bash turns a leading slash into a
  # path): only this test app is built so, the app ships from the windows job (Visual Studio 2022)
  windows-share:
    name: Windows share window (Server 2025)
    runs-on: windows-2025
    needs: codegen
    if: github.event_name != 'push' || github.ref == 'refs/heads/desktop'
    timeout-minutes: 60
    env:
      CL: -D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-dart
          path: mobile

      - name: Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' native/crates/native_core_ffi/rust-toolchain.toml)
          rustup --version
          rustup toolchain install "$channel" --profile minimal --target x86_64-pc-windows-msvc
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"

      - name: Flutter dependencies
        working-directory: mobile
        run: |
          tar -xf generated-dart.tar && rm generated-dart.tar
          flutter pub get --enforce-lockfile

      - name: Build 35's order through share_plus, in a built app
        working-directory: mobile
        timeout-minutes: 30
        run: >-
          flutter test integration_test/desktop_share_test.dart -d windows --reporter expanded
          --dart-define=IMMUCH360_SHARE_SCENARIO=old

      - name: The share of the Share menu, in a built app
        working-directory: mobile
        timeout-minutes: 15
        run: >-
          flutter test integration_test/desktop_share_test.dart -d windows --reporter expanded
          --dart-define=IMMUCH360_SHARE_SCENARIO=new

  macos:
    name: macOS build, ZIP and DMG
    runs-on: macos-15
    needs: codegen
    if: >-
      ${{ !cancelled() && needs.codegen.result == 'success'
      && (github.event_name != 'push' || github.ref == 'refs/heads/desktop' || startsWith(github.ref, 'refs/tags/')) }}
    timeout-minutes: 60
    env:
      # One Xcode, named here rather than the newest the image carries: the images change every week and may add a
      # beta or a release candidate, and a pinned toolchain keeps a failure of this compile check the code's (design
      # 6.6). check_workflow.py refuses an Xcode picked by a pattern.
      XCODE_VERSION: '26.3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Xcode with the macOS 26 SDK
        run: |
          # connectivity_plus 7.3 reads NWPath.isUltraConstrained (behind #available(macOS 26.0, *)), which only the
          # macOS 26 SDK declares; the default Xcode of macos-15 is 16.4, with the macOS 15.5 SDK. The image also has
          # Xcode 26: 26.0.1, 26.1.1, 26.2 and 26.3 in its readme (images/macos/macos-15-Readme.md of
          # actions/runner-images, 2026-10-10), 26.3 with the macOS 26.2 SDK.
          xcode="/Applications/Xcode_$XCODE_VERSION.app"
          if [ ! -d "$xcode" ]; then
            echo "::error::No Xcode $XCODE_VERSION on this runner image: set XCODE_VERSION to one its readme lists"
            ls /Applications | grep "^Xcode" || true
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          echo "$xcode, macOS SDK $sdk"
          if [ "${sdk%%.*}" -lt 26 ]; then
            echo "::error::$xcode has the macOS $sdk SDK, not 26 or later"
            exit 1
          fi

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: false
          cache: true

      - name: Install Flutter
        run: cd mobile && mise install

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-dart
          path: mobile

      # The build hook of upstream's native core (native/native_core) compiles its Rust for each slice of the release
      # build, arm64 and x86_64. mise sets RUSTUP_TOOLCHAIN, so rustup ignores the targets of rust-toolchain.toml, and
      # the hook adds a target for Android and iOS only: the slice that is not the runner's own needs its target here.
      - name: Rust targets of the macOS slices
        working-directory: mobile
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' ../native/crates/native_core_ffi/rust-toolchain.toml)
          mise exec -- rustup target add --toolchain "$channel" aarch64-apple-darwin x86_64-apple-darwin

      # The Rust JPEG codec of the AI features (mobile/packages/immuch_sbs_codec) on this arm64 runner, the NEON paths
      # of its decoder included, in release as its build hook makes it
      - name: Tests of the JPEG codec of the AI features (cargo)
        working-directory: mobile/packages/immuch_sbs_codec/rust
        run: mise exec -- cargo test --release

      - name: Build without signing
        working-directory: mobile
        env:
          BUILD_NUMBER: ${{ needs.codegen.outputs.build_number }}
          LABEL: ${{ needs.codegen.outputs.label }}
        run: |
          tar -xf generated-dart.tar && rm generated-dart.tar
          mise exec -- flutter pub get --enforce-lockfile
          mise exec -- flutter build macos --release -t lib/main_desktop.dart --build-number "$BUILD_NUMBER" \
            --dart-define=IMMUCH360_DESKTOP_LABEL="$LABEL"

      # The app as Flutter builds it: universal, signed for the computer that runs it only ("Sign to Run Locally", no
      # Apple certificate) and not notarized, so macOS asks for a confirmation at the first start. Zipped with ditto,
      # which keeps the attributes of the bundle, and in a DMG with a link to the Applications folder
      # Core ML of ONNX Runtime 1.31.0 for Apple silicon (lot ai-360-3d-51): the library the app installs (the asset of
      # ai-components-1, checked by the SHA-256 of the catalogue), the depth model's check against the processor and
      # one window on Core ML; the runner proves it loads and runs, not the speed of a Mac
      - name: Core ML of ONNX Runtime for the depth model
        working-directory: mobile
        run: |
          ort="$RUNNER_TEMP/ort-macos"
          mkdir -p "$ort"
          curl -sSfL --retry 3 -o "$ort/ort.dylib.gz" \
            https://github.com/freeKC/Immuch360/releases/download/ai-components-1/onnxruntime-1.31.0-osx-arm64.dylib.gz
          gunzip -c "$ort/ort.dylib.gz" > "$ort/libonnxruntime.1.31.0.dylib"
          echo "2a50a63e7f41f8d4d551d3ee47248df3864f6540109fce8ad520ca3b51af4b70  $ort/libonnxruntime.1.31.0.dylib" | shasum -a 256 -c -
          IMMUCH360_ORT_LIB="$ort/libonnxruntime.1.31.0.dylib" IMMUCH360_ORT_COREML=1 \
            mise exec -- flutter test test/desktop/ai/ort/depth_provider_test.dart --reporter expanded
          # Natural of Enhance (AI) through Core ML (release 53): the backend of the app on the tiny graphs of VOSR
          # (make_tiny_vosr.py), every graph opened with Core ML, the picture the processor gives
          IMMUCH360_ORT_LIB="$ort/libonnxruntime.1.31.0.dylib" IMMUCH360_ORT_COREML=1 \
            mise exec -- flutter test test/desktop/ai/enhance/natural_ort_test.dart --reporter expanded

      - name: ZIP and DMG
        id: app
        env:
          LABEL: ${{ needs.codegen.outputs.label }}
        run: |
          app="mobile/build/macos/Build/Products/Release/Immuch360 Desktop.app"
          plutil -lint "$app/Contents/Info.plist"
          echo "architectures: $(lipo -archs "$app/Contents/MacOS/Immuch360 Desktop")"
          codesign -dv "$app" 2>&1 | grep -E '^(Identifier|Format|Signature|TeamIdentifier)=' || true
          python3 -c 'import plistlib, sys; d = plistlib.load(open(sys.argv[1], "rb")); print(len(d["CFBundleDocumentTypes"]), "document types,", len(d["UTImportedTypeDeclarations"]), "imported types")' "$app/Contents/Info.plist"
          mkdir -p dist "$RUNNER_TEMP/dmg"
          zip="dist/Immuch360-Desktop-$LABEL-macos.zip"
          dmg="dist/Immuch360-Desktop-$LABEL-macos.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"
          cp -R "$app" "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname "Immuch360 Desktop" -srcfolder "$RUNNER_TEMP/dmg" -fs HFS+ -format UDZO -ov "$dmg"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          {
            echo "### Immuch360 Desktop for macOS (universal, unsigned, not notarized)"
            echo
            echo "| File | Size | SHA-256 |"
            echo "|---|---|---|"
            for file in "$dmg" "$zip"; do
              echo "| \`$(basename "$file")\` | $(( $(stat -f %z "$file") / 1048576 )) MB | \`$(shasum -a 256 "$file" | cut -d' ' -f1)\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Finder's "Open with" asks Launch Services which apps open a file: once registered, the app must be offered
      # for every type of .github/desktop/file-associations.json (CFBundleDocumentTypes of mobile/macos/Runner/Info.plist)
      - name: Open with, as Launch Services answers it
        run: |
          app="$PWD/mobile/build/macos/Build/Products/Release/Immuch360 Desktop.app"
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$app"
          read -ra extensions <<< "$(python3 -c 'import json; d = json.load(open(".github/desktop/file-associations.json")); print(" ".join([*d["photos"], *d["videos"]]))')"
          swift .github/desktop/packaging/macos/open_with.swift "$app" "${extensions[@]}"

      # The libraries of the video player in the app: Mpv.framework and the others (media_kit_libs_macos_video, the
      # fork's libmpv build), each with an @rpath name and no path of the machine that built them, and their licence
      # texts in the resource bundle of that package
      - name: libmpv in the app
        run: |
          app="mobile/build/macos/Build/Products/Release/Immuch360 Desktop.app"
          ls "$app/Contents/Frameworks"
          mpv="$app/Contents/Frameworks/Mpv.framework/Mpv"
          [ -f "$mpv" ] || { echo "::error::no Mpv.framework in the app"; exit 1; }
          echo "Mpv: $(lipo -archs "$mpv"), minimum macOS $(vtool -show-build "$mpv" | awk '/minos/ {print $2; exit}')"
          otool -L "$mpv"
          for framework in "$app"/Contents/Frameworks/*.framework; do
            otool -L "$framework/$(basename "$framework" .framework)"
          done > "$RUNNER_TEMP/frameworks.txt"
          if grep -E '^[[:space:]]+/(nix|Users|private|tmp)/' "$RUNNER_TEMP/frameworks.txt"; then
            echo "::error::a framework of the app names a library by a path of the build machine"
            exit 1
          fi
          notices=$(find "$app/Contents/Resources" -path '*media_kit_libs_macos_video*' -name NOTICES.md | head -n 1)
          [ -n "$notices" ] || { echo "::error::no NOTICES.md of the video libraries in the app"; exit 1; }
          echo "notices: ${notices#"$app/"}"
          ls "$(dirname "$notices")"

      # The head tracker of Spatial 2.5D (the code asset of mobile/packages/immuch_head_tracker/hook/build.dart):
      # Flutter's framework of it in the app with both slices, AVFoundation linked, no path of the build machine; the
      # camera's usage text in the app's Info.plist (macOS ends an app that opens a camera without it) and the camera
      # entitlement in the signature of the app (lot S7). No camera is opened: the runner has none.
      - name: The head tracker and the camera permission in the app
        run: |
          app="mobile/build/macos/Build/Products/Release/Immuch360 Desktop.app"
          tracker="$app/Contents/Frameworks/immuch_head_tracker.framework/immuch_head_tracker"
          if [ ! -f "$tracker" ]; then
            echo "::error::no immuch_head_tracker.framework in the app"
            ls "$app/Contents/Frameworks"
            exit 1
          fi
          archs=$(lipo -archs "$tracker")
          echo "immuch_head_tracker: $archs, $(stat -L -f %z "$tracker") bytes, sha256 $(shasum -a 256 "$tracker" | cut -c1-64)"
          case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "::error::the tracker lacks a slice: $archs"; exit 1;; esac
          otool -L "$tracker" | tee "$RUNNER_TEMP/tracker-links.txt"
          grep -q 'AVFoundation.framework' "$RUNNER_TEMP/tracker-links.txt" || { echo "::error::AVFoundation not linked"; exit 1; }
          if grep -E '^[[:space:]]+/(nix|Users|private|tmp)/' "$RUNNER_TEMP/tracker-links.txt"; then
            echo "::error::the tracker names a library by a path of the build machine"
            exit 1
          fi
          nm -gU "$tracker" | grep -E ' _ht_(api_version|open_camera|predict|recenter)$'
          usage=$(/usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$app/Contents/Info.plist")
          [ -n "$usage" ] || { echo "::error::no NSCameraUsageDescription in the app"; exit 1; }
          echo "NSCameraUsageDescription: $usage"
          codesign -d --entitlements - --xml "$app" 2>/dev/null > "$RUNNER_TEMP/entitlements.plist" || true
          if grep -q 'com.apple.security.device.camera' "$RUNNER_TEMP/entitlements.plist"; then
            echo "the camera entitlement is in the signature of the app"
          elif grep -q '<key>' "$RUNNER_TEMP/entitlements.plist"; then
            echo "::error::the signature of the app carries entitlements, the camera's not among them"
            cat "$RUNNER_TEMP/entitlements.plist"
            exit 1
          else
            echo "::warning::the ad hoc signature of this build carries no entitlements; Release.entitlements has the camera (macos_camera_permission_test)"
          fi

      # immuch360-run in Contents/MacOS, beside the executable (lot L10, the build phase of mobile/macos/Runner.xcodeproj):
      # both slices, its ad hoc signature valid, and the checks of check_launcher.sh on it, the stand-in for the app
      # killed with SIGKILL included
      - name: immuch360-run in the app
        run: |
          launcher="mobile/build/macos/Build/Products/Release/Immuch360 Desktop.app/Contents/MacOS/immuch360-run"
          [ -x "$launcher" ] || { echo "::error::no immuch360-run in Contents/MacOS of the app"; exit 1; }
          archs=$(lipo -archs "$launcher")
          echo "immuch360-run: $archs, minimum macOS $(vtool -show-build "$launcher" | awk '/minos/ {print $2; exit}')"
          for arch in arm64 x86_64; do
            case " $archs " in
              *" $arch "*) ;;
              *) echo "::error::immuch360-run has no $arch slice: $archs"; exit 1 ;;
            esac
          done
          codesign --verify --strict --verbose=2 "$launcher"
          # The seal of the whole app with the launcher inside: said, not asked (the app is signed to run locally only)
          codesign --verify --deep --strict "mobile/build/macos/Build/Products/Release/Immuch360 Desktop.app" \
            || echo "::warning::codesign --verify --deep --strict refuses the app"
          bash .github/desktop/packaging/macos/check_launcher.sh "$PWD/$launcher"

      # The y4m that the AV2 decoder of the app serves libmpv over HTTP on 127.0.0.1: the frameworks of the app read it,
      # 8 and 10 bit, from a file and over HTTP with exact seeks, on each architecture this runner runs
      # (.github/desktop/libmpv-macos/check_y4m.py, as immuch360/libmpv-builds checks a release before it is
      # published).
      # The frameworks of the app keep no headers: mpv's client.h comes from the xcframework that Swift Package Manager
      # downloaded for the build
      - name: libmpv of the app reads a y4m
        run: |
          set -o pipefail
          app="mobile/build/macos/Build/Products/Release/Immuch360 Desktop.app"
          python3 .github/desktop/libmpv-macos/check_y4m.py run --frameworks "$app/Contents/Frameworks" \
            --search-headers mobile/build/macos "$HOME/Library/Developer/Xcode/DerivedData" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # The AV2 path itself (review of lot AD4, m8): the serve of the macOS archive of the AV2 decoder the app downloads
      # (the release of immuch360/av2-companion its catalogue names, its SHA-256 that of the catalogue, which the gates
      # hold to the copy of the release's manifest in .github/desktop/ai), fed by the app's side in Python (tools/ of
      # av2-companion at the same tag), read over its HTTP/1.1 connection by the frameworks of the app with the options
      # the app opens an AV2 video with (the y4m demuxer forced, the cache of a streamed video), on each architecture
      # this runner runs: the 8 and 10 bit fixtures and the 1080p clip of av2-companion's clips/, seeks forward and
      # back, the end, and the frames a second of the playback in the summary
      - name: The AV2 decoder the app downloads for macOS
        id: av2
        run: |
          python3 - "$RUNNER_TEMP/av2-decoder.zip" >> "$GITHUB_OUTPUT" <<'PY'
          import glob, hashlib, json, sys, urllib.request
          manifests = glob.glob('.github/desktop/ai/av2-companion-*.json')
          assert len(manifests) == 1, manifests
          manifest = json.load(open(manifests[0], encoding='utf-8'))
          archive = manifest['archives']['av2-decoder-macos-universal']
          with urllib.request.urlopen(archive['url'], timeout=120) as answer:
              data = answer.read()
          digest = hashlib.sha256(data).hexdigest()
          if len(data) != archive['size'] or digest != archive['sha256']:
              sys.exit(f"{archive['url']}: {len(data)} bytes, SHA-256 {digest}, not those of {manifests[0]}")
          open(sys.argv[1], 'wb').write(data)
          print(f"tag={manifest['tag']}")
          print(f"repository={manifest['repository'].removeprefix('https://github.com/')}", )
          PY
          cat "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.av2.outputs.repository }}
          ref: ${{ steps.av2.outputs.tag }}
          path: av2-companion
          persist-credentials: false

      - name: libmpv of the app reads the AV2 decoder
        run: |
          set -o pipefail
          app="mobile/build/macos/Build/Products/Release/Immuch360 Desktop.app"
          mkdir -p "$RUNNER_TEMP/av2-decoder"
          unzip -q "$RUNNER_TEMP/av2-decoder.zip" -d "$RUNNER_TEMP/av2-decoder"
          chmod +x "$RUNNER_TEMP/av2-decoder/immuch360-av2"
          python3 .github/desktop/libmpv-macos/check_y4m.py companion --frameworks "$app/Contents/Frameworks" \
            --search-headers mobile/build/macos "$HOME/Library/Developer/Xcode/DerivedData" \
            --program "$RUNNER_TEMP/av2-decoder/immuch360-av2" --av2-scripts av2-companion/tools \
            --stream mobile/test/fixtures/av2/av2-256x144-8bit.ivf:20 mobile/test/fixtures/av2/av2-256x144-10bit.ivf:20 \
            av2-companion/clips/lighthouse-1080p30-8bit-60f.ivf:5 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # The Rust JPEG codec of the AI features, a framework of both slices made from what the hook of
      # mobile/packages/immuch_sbs_codec built; the otool check above covers it with the other frameworks
      - name: The JPEG codec of the AI features in the app
        run: |
          app="mobile/build/macos/Build/Products/Release/Immuch360 Desktop.app"
          framework=$(find "$app/Contents/Frameworks" -maxdepth 1 -name '*immuch_sbs_codec*.framework' | head -n 1)
          if [ -z "$framework" ]; then
            echo "::error::no framework of immuch_sbs_codec in the app"
            ls "$app/Contents/Frameworks"
            exit 1
          fi
          binary="$framework/$(basename "$framework" .framework)"
          archs=$(lipo -archs "$binary")
          # The binary of a framework is a link to Versions/Current: its size is the one of the file it names
          echo "${framework#"$app/"}: $archs, $(stat -L -f %z "$binary") bytes"
          otool -L "$binary"
          for arch in arm64 x86_64; do
            case " $archs " in
              *" $arch "*) ;;
              *) echo "::error::the codec has no $arch slice: $archs"; exit 1 ;;
            esac
          done

      # libsmb2 (dart_smb2, LGPL-2.1-or-later) in the app with its notice and licence texts and the archive of its
      # sources, assets of the package (mobile/packages/dart_smb2/libsmb2) that the licence page of the app shows. The
      # sources are packed again on this Mac, as Codemagic packs them for the iOS build: the files must be the same
      - name: libsmb2, its licence and its sources in the app
        run: |
          app="mobile/build/macos/Build/Products/Release/Immuch360 Desktop.app"
          sources=mobile/packages/dart_smb2/libsmb2/Immuch360-libsmb2-sources.tar.gz
          [ -d "$app/Contents/Frameworks/libsmb2.framework" ] || { echo "::error::no libsmb2.framework in the app"; exit 1; }
          texts="$app/Contents/Frameworks/App.framework/Resources/flutter_assets/packages/dart_smb2/libsmb2"
          for name in NOTICE COPYING LICENCE-LGPL-2.1.txt Immuch360-libsmb2-sources.tar.gz; do
            [ -f "$texts/$name" ] || { echo "::error::no $name of libsmb2 in the app"; exit 1; }
          done
          cmp "$texts/Immuch360-libsmb2-sources.tar.gz" "$sources" \
            || { echo "::error::the libsmb2 sources in the app are not the archive packed"; exit 1; }
          ls -l "$texts"
          python3 .github/desktop/libsmb2/pack_sources.py "$RUNNER_TEMP/packed-on-macos.tar.gz"
          if cmp -s "$RUNNER_TEMP/packed-on-macos.tar.gz" "$sources"; then
            echo "packed on macOS: the same file"
          elif [ "$(gzip -dc "$RUNNER_TEMP/packed-on-macos.tar.gz" | shasum -a 256)" = \
            "$(gzip -dc "$sources" | shasum -a 256)" ]; then
            echo "::notice::packed on macOS: the same tar, compressed to other bytes by the zlib of this Mac"
          else
            echo "::error::the sources packed on macOS differ from those packed on Linux"
            exit 1
          fi

      # Nobody on the project has a Mac: the runner starts the app three times, without a server, with what a user would
      # give it, and with the self check of lib/desktop/window/self_check.dart (IMMUCH360_SELF_CHECK), which writes
      # what it found to a JSON file. First the folder of a photo and a video made here (make_test_media.swift) on the
      # command line, with the secure storage written and read back and the video played five seconds by libmpv; then
      # the video alone, which opens in the viewer; then the photo the way the Finder opens a file ("Open with", a
      # double click): Launch Services starts the app and hands the photo over by an Apple event
      # (AppDelegate.application(_:open:)), after which the video is handed to the copy that runs. Last, a start
      # without arguments that plays the 10 bit y4m of check_y4m.py over HTTP from 127.0.0.1, the stream the AV2 decoder
      # serves, in the app's own player. A capture of the screen each time. The window server of a runner is not a Mac
      # on a desk: the next step says what passed. It passed its 14 checks on the five runs of 19 to 21 November 2026,
      # none failed, so since release 51 a failed check fails the job (lot L04 of the desktop parity plan)
      - name: Self check on the runner
        id: self_check
        run: |
          app="$PWD/mobile/build/macos/Build/Products/Release/Immuch360 Desktop.app"
          exe="$app/Contents/MacOS/Immuch360 Desktop"
          out="$PWD/first-start"
          media="$RUNNER_TEMP/Immuch360 test media"
          mkdir -p "$out"
          swift .github/desktop/packaging/macos/make_test_media.swift "$media" 12
          security list-keychains -d user || true
          security show-keychain-info login.keychain 2>&1 || true

          # Starts the app with the arguments given, waits for its report (at most 150 s), captures the screen
          run_app() {
            local name=$1
            shift
            rm -f "$out/$name.json" "$out/$name.json.partial"
            IMMUCH360_SELF_CHECK="$out/$name.json" "$exe" "$@" > "$out/$name.log" 2>&1 &
            local pid=$!
            for _ in $(seq 1 150); do
              [ -s "$out/$name.json" ] && break
              kill -0 "$pid" 2>/dev/null || break
              sleep 1
            done
            sleep 3
            screencapture -x "$out/$name.png" || echo "no screen capture"
            if [ "$name" = video ]; then
              sleep 2
              screencapture -x "$out/$name-2s-later.png" || true
            fi
            if kill -0 "$pid" 2>/dev/null; then
              echo "$name: still running" > "$out/$name.state"
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            else
              local status=0
              wait "$pid" || status=$?
              echo "$name: ended by itself (exit $status)" > "$out/$name.state"
            fi
            cat "$out/$name.state"
            tail -n 40 "$out/$name.log"
          }

          # The start of the earlier first start, without arguments and without the self check: 30 s, then a capture
          "$exe" > "$out/plain.log" 2>&1 &
          pid=$!
          sleep 30
          screencapture -x "$out/plain.png" || echo "no screen capture"
          if kill -0 "$pid" 2>/dev/null; then
            echo "plain: still running after 30 seconds" > "$out/plain.state"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          else
            status=0
            wait "$pid" || status=$?
            echo "plain: ended by itself within 30 seconds (exit $status)" > "$out/plain.state"
          fi
          cat "$out/plain.state"

          IMMUCH360_SELF_CHECK_VIDEO="$media/test-video.mp4" run_app folder "$media"
          run_app video "$media/test-video.mp4"

          # The Finder's way. open waits for the start only; the copy that runs is found by its executable path
          rm -f "$out/finder.json" "$out/finder.json.partial" "$out/finder.json.later"
          if open -a "$app" --env "IMMUCH360_SELF_CHECK=$out/finder.json" --stdout "$out/finder.log" \
            --stderr "$out/finder.log" "$media/test-photo.jpg"; then
            for _ in $(seq 1 150); do
              [ -s "$out/finder.json" ] && break
              sleep 1
            done
            sleep 3
            screencapture -x "$out/finder.png" || echo "no screen capture"
            open -a "$app" "$media/test-video.mp4" || echo "open could not hand the video over"
            sleep 8
            screencapture -x "$out/finder-then-video.png" || true
            finder_pid=$(ps -axo pid=,command= | awk -v exe="$exe" 'index($0, exe) {print $1; exit}')
            if [ -n "$finder_pid" ]; then
              echo "finder: still running" > "$out/finder.state"
              kill "$finder_pid" 2>/dev/null || true
            else
              echo "finder: ended by itself" > "$out/finder.state"
            fi
          else
            echo "finder: open did not start the app" > "$out/finder.state"
          fi
          cat "$out/finder.state"
          tail -n 40 "$out/finder.log" 2>/dev/null || true

          # The y4m over HTTP, ten seconds of it, from a server on 127.0.0.1 that answers ranges as the AV2 decoder does.
          # It once took more than 10 s to start on a busy runner (22 November 2026): up to 60 s, the time it took said
          python3 .github/desktop/libmpv-macos/check_y4m.py serve --seconds 10 --port-file "$RUNNER_TEMP/y4m.port" \
            > "$out/y4m-server.log" 2>&1 &
          y4m_server=$!
          waited=0
          while [ ! -s "$RUNNER_TEMP/y4m.port" ] && [ "$waited" -lt 120 ] && kill -0 "$y4m_server" 2>/dev/null; do
            sleep 0.5
            waited=$((waited + 1))
          done
          echo "y4m server: $((waited / 2)) s to give its port"
          if [ -s "$RUNNER_TEMP/y4m.port" ]; then
            IMMUCH360_SELF_CHECK_VIDEO="http://127.0.0.1:$(cat "$RUNNER_TEMP/y4m.port")/fixture-10bit.y4m" run_app y4m
          else
            echo "y4m: the server of the fixture did not start" > "$out/y4m.state"
            cat "$out/y4m-server.log"
          fi
          kill "$y4m_server" 2>/dev/null || true
          cp "$media/test-photo.jpg" "$out/"
          # The crash reports macOS wrote meanwhile, if any (ReportCrash writes them a few seconds after the crash)
          sleep 10
          find "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports -name 'Immuch360*' \
            -exec cp {} "$out/" \; 2>/dev/null || true
          ls "$out"

      - name: What the self check found
        if: always()
        # pipefail: a failed check fails this step and the job
        run: |
          set -o pipefail
          python3 .github/desktop/packaging/macos/self_check_summary.py first-start --strict | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the macOS ZIP
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.app.outputs.zip }}
          archive: false
          retention-days: 14
          if-no-files-found: error

      - name: Upload the DMG
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.app.outputs.dmg }}
          archive: false
          retention-days: 14
          if-no-files-found: error

      - name: Upload the first start
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-first-start
          path: first-start/
          retention-days: 14
          if-no-files-found: ignore

      # The Spatial 2.5D passes of the video plugin in a built app (media_kit_360 patch 18, in Metal, here on the
      # runner's paravirtual device): the checks of the Windows job, through the plugin's macOS code with mpv's real
      # frames. Last of the job: its debug app has the bundle id of the app, which Launch Services must not pick for
      # the first start above
      - name: The Spatial passes on a stereo clip in a built app (Metal)
        if: success()
        working-directory: mobile
        timeout-minutes: 25
        run: mise exec -- flutter test integration_test/desktop_spatial_video_test.dart -d macos --reporter expanded

      # The copy of photos and videos to the pasteboard (lib/desktop/clipboard, macos/Runner/MainFlutterWindow.swift) in
      # the same debug app, read back by osascript in JavaScript as a paste would read it: one item per file with its
      # file URL, public.png and public.tiff for one photo, its PNG at its size; then pbcopy copies something else and
      # the copies of remote files go. After the start of the build above, for the same reason as the step before
      - name: The copy to the pasteboard in a built app
        if: ${{ !cancelled() }}
        working-directory: mobile
        timeout-minutes: 20
        run: mise exec -- flutter test integration_test/desktop_clipboard_test.dart -d macos --reporter expanded

  # The desktop tests on macOS (lots L04 and L05 of the desktop parity plan, 21 November 2026), beside the build: until
  # release 51 they never ran on a Mac, the build job only compiled the app and started it. test/desktop on this arm64
  # runner with the fakes of the AI features compiled here, then ONNX Runtime by FFI on the library the app installs on
  # Apple silicon (onnxruntime-1.31.0-osx-arm64.dylib.gz of the release ai-components-1, checked by the SHA-256 of the
  # download and by that of the catalogue once unpacked): the tiny models, the engines of the 3D scenes and of the 360°
  # panoramas, the 3D videos, and a whole 3D video through the macOS FFmpeg program of immuch360/libmpv-builds that the
  # app downloads. A runner is no Mac on a desk: no graphics card the AI uses, no Retina screen, no keychain prompt
  macos-tests:
    name: macOS desktop tests and ONNX Runtime
    runs-on: macos-15
    needs: codegen
    if: >-
      ${{ !cancelled() && needs.codegen.result == 'success'
      && (github.event_name != 'push' || github.ref == 'refs/heads/desktop' || startsWith(github.ref, 'refs/tags/')) }}
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: false
          cache: true

      - name: Install Flutter
        run: cd mobile && mise install

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-dart
          path: mobile

      - name: Flutter dependencies
        working-directory: mobile
        run: |
          tar -xf generated-dart.tar && rm generated-dart.tar
          mise exec -- flutter pub get --enforce-lockfile

      # The fakes of the AI features and the probes of the splat scenes, compiled as the test job compiles them
      - name: The fake sd-cli, the fake COLMAP, the fake Brush, the probes of the splat scenes and the fake AV2 companion
        id: fakes
        working-directory: mobile
        run: |
          fakes="$RUNNER_TEMP/ai-fakes"
          mkdir -p "$fakes"
          mise exec -- dart compile exe test/desktop/ai/fakes/fake_sd_cli.dart -o "$fakes/fake-sd-cli"
          mise exec -- dart compile exe test/desktop/ai/fakes/fake_colmap.dart -o "$fakes/fake-colmap"
          mise exec -- dart compile exe test/desktop/ai/fakes/fake_brush.dart -o "$fakes/fake-brush"
          mise exec -- dart compile exe test/desktop/ai/tools/splat_runner_probe.dart -o "$fakes/splat-runner-probe"
          mise exec -- dart compile exe test/desktop/ai/tools/splat_probe.dart -o "$fakes/splat-probe"
          mise exec -- dart compile exe test/desktop/video/fakes/fake_av2.dart -o "$fakes/fake-av2"
          echo "dir=$fakes" >> "$GITHUB_OUTPUT"

      # immuch360-run, the launcher that makes the programs of the app die with it (lot L10), built here as the build
      # phase of the app builds it: its exit codes, and a stand-in for the app killed with SIGKILL while a program runs
      # under it (check_launcher.sh). The suite below then kills the hosts of the fakes started through it
      - name: immuch360-run, the launcher of the programs, on macOS
        working-directory: mobile
        run: |
          xcrun clang -O2 -Wall -Wextra -Werror -o "${{ steps.fakes.outputs.dir }}/immuch360-run" \
            ../.github/desktop/ai/immuch360_run.c
          bash ../.github/desktop/packaging/macos/check_launcher.sh "${{ steps.fakes.outputs.dir }}/immuch360-run"

      # test/desktop as the windows job runs it. IMMUCH360_REQUIRE_SBS_CODEC: the build hook must have built the JPEG
      # codec for this Mac
      - name: Desktop tests on macOS
        working-directory: mobile
        env:
          IMMUCH360_REQUIRE_SBS_CODEC: '1'
          IMMUCH360_FAKE_SD_CLI: ${{ steps.fakes.outputs.dir }}/fake-sd-cli
          IMMUCH360_FAKE_COLMAP: ${{ steps.fakes.outputs.dir }}/fake-colmap
          IMMUCH360_FAKE_BRUSH: ${{ steps.fakes.outputs.dir }}/fake-brush
          IMMUCH360_SPLAT_PROBE: ${{ steps.fakes.outputs.dir }}/splat-runner-probe
          IMMUCH360_SPLAT_SCENE_PROBE: ${{ steps.fakes.outputs.dir }}/splat-probe
          IMMUCH360_FAKE_AV2: ${{ steps.fakes.outputs.dir }}/fake-av2
          IMMUCH360_RUN_LAUNCHER: ${{ steps.fakes.outputs.dir }}/immuch360-run
          # The head tracker's library, built by its hook for this run: the recorded track through the fake camera,
          # the clip through AVFoundation's camera path (head_tracker_native_test.dart)
          IMMUCH360_REQUIRE_HEAD_TRACKER: '1'
        run: mise exec -- flutter test test/desktop

      # For the record, not a check: macOS refused the test authority of tls_contract_test.dart and of the downloader
      # tests on the first run of the suite on a Mac (22 November 2026), so those tests are skipped there. The same
      # authority and server certificate made by the openssl of this runner, its version, the extensions it wrote, and
      # what the trust evaluation of macOS (security verify-cert, policy ssl, 127.0.0.1) says of them
      - name: TLS diagnostics (information only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          tls="$RUNNER_TEMP/tls-diagnostics"
          mkdir -p "$tls"
          cd "$tls"
          printf '[req]\ndistinguished_name = dn\n[dn]\n' > openssl.cnf
          export OPENSSL_CONF="$tls/openssl.cnf"
          command -v openssl
          openssl version
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.pem -days 2 \
            -subj '/CN=Immuch360 Test Authority' -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign'
          printf 'subjectAltName=IP:127.0.0.1,DNS:localhost\nbasicConstraints=CA:FALSE\nextendedKeyUsage=serverAuth\n' \
            > server.ext
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj '/CN=127.0.0.1'
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out server.pem -days 2 \
            -extfile server.ext
          openssl x509 -in server.pem -noout -text | sed -n '/X509v3 extensions/,$p' | head -20
          security verify-cert -c server.pem -r ca.pem -p ssl -s 127.0.0.1 -L -v || true
          security verify-cert -c ca.pem -r ca.pem -L -v || true

      - name: ONNX Runtime archive cache
        if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/onnxruntime-macos
          key: onnxruntime-osx-arm64-1.31.0-fa5c0ea9-2a50a63e

      # The library the app installs on Apple silicon, the gzip of the release checked by its SHA-256, the library by
      # that of the catalogue (onnxRuntimeMacArmComponent of ai_components_manifest.dart)
      - name: ONNX Runtime by FFI on 1.31.0 (osx-arm64)
        id: ort
        if: ${{ !cancelled() }}
        working-directory: mobile
        run: |
          ort="$RUNNER_TEMP/onnxruntime-macos"
          mkdir -p "$ort"
          archive="$ort/onnxruntime-1.31.0-osx-arm64.dylib.gz"
          [ -f "$archive" ] || curl -sSfL --retry 3 -o "$archive" \
            https://github.com/freeKC/Immuch360/releases/download/ai-components-1/onnxruntime-1.31.0-osx-arm64.dylib.gz
          echo "fa5c0ea9c33f3ea1eb86e3aa989d92c1d78b8f4dbef50c77ea9c6c54919f33b8  $archive" | shasum -a 256 -c -
          lib="$ort/libonnxruntime.1.31.0.dylib"
          gzip -dc "$archive" > "$lib"
          echo "2a50a63e7f41f8d4d551d3ee47248df3864f6540109fce8ad520ca3b51af4b70  $lib" | shasum -a 256 -c -
          echo "lib=$lib" >> "$GITHUB_OUTPUT"
          IMMUCH360_ORT_LIB="$lib" IMMUCH360_SCENE_OUT="$RUNNER_TEMP/scenes-1.31.0" \
            mise exec -- flutter test test/desktop/ai/ort test/desktop/ai/scene \
              test/desktop/ai/panorama/panorama_engine_ort_test.dart test/desktop/ai/video3d
          ls -l "$RUNNER_TEMP/scenes-1.31.0" || true

      # A whole 3D video as the test job makes it, with the macOS FFmpeg program the app downloads
      # (ffmpegMacComponent: one universal archive, signed ad hoc) and this ONNX Runtime
      - name: A 3D video through the real FFmpeg program and the tiny model (macOS)
        if: ${{ !cancelled() && steps.ort.outcome == 'success' }}
        working-directory: mobile
        env:
          ORT_LIB: ${{ steps.ort.outputs.lib }}
        run: |
          set -o pipefail
          work="$RUNNER_TEMP/video3d"
          mkdir -p "$work/ffmpeg"
          curl -sSfL --retry 3 -o "$work/ffmpeg.zip" \
            https://github.com/immuch360/libmpv-builds/releases/download/ffmpeg-lgpl-20261118-9/Immuch360-ffmpeg-9.0.2-2-macos-universal.zip
          echo "b0d76f497d989283dd5d77c1076792e02371a7df092899f2a8d12857c65cf6b7  $work/ffmpeg.zip" | shasum -a 256 -c -
          (cd "$work/ffmpeg" && unzip -q ../ffmpeg.zip)
          lipo -archs "$work/ffmpeg/bin/ffmpeg"
          python3 ../.github/desktop/ai/video3d_ci_clip.py make "$work/ffmpeg/bin/ffmpeg" "$work/clip.mkv"
          export IMMUCH360_VIDEO3D_ARGS="[\"--ffmpeg\",\"$work/ffmpeg\",\"--ort\",\"$ORT_LIB\",\"--model\",\"$PWD/test/fixtures/ai_immersive/tiny_vda.onnx\",\"--out\",\"$work/out\",\"--quality\",\"fast\",\"--segment\",\"1\",\"$work/clip.mkv\"]"
          mise exec -- flutter test test/desktop/ai/video3d/video3d_integration_test.dart --reporter expanded \
            | tee "$work/run.log"
          python3 ../.github/desktop/ai/video3d_ci_clip.py check "$work/run.log"
          python3 ../.github/desktop/ai/video3d_ci_clip.py drift "$work/ffmpeg/bin/ffmpeg" "$work/drift"
          python3 ../.github/desktop/ai/video3d_ci_clip.py decoders "$work/ffmpeg/bin/ffmpeg" \
            lib/desktop/ai/video3d/video_source.dart

  # The 3D videos on an Intel Mac (lot L06 of the desktop parity plan, 21 November 2026): the only ONNX Runtime for
  # Intel Macs is 1.23.2 (the app installs onnxruntime-1.23.2-osx-x86_64.dylib.gz of ai-components-1 there), and
  # whether it runs Video Depth Anything Small was never checked, so the 3D videos were offered on Apple chips only.
  # On the macos-15-intel runner: the ONNX tests on the tiny models (test/desktop/ai/ort and video3d), then a whole 3D
  # video with the real model of ai-components-5 and the macOS FFmpeg program the app downloads, with the checks of
  # video3d_ci_clip.py (frames, st3d, cut, drift). The time it took is said; the speed on a real Intel Mac is not
  macos-intel-video3d:
    name: 3D videos on an Intel Mac
    runs-on: macos-15-intel
    needs: codegen
    if: >-
      ${{ !cancelled() && needs.codegen.result == 'success'
      && (github.event_name != 'push' || github.ref == 'refs/heads/desktop' || startsWith(github.ref, 'refs/tags/')) }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: false
          cache: true

      - name: Install Flutter
        run: cd mobile && mise install

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-dart
          path: mobile

      - name: Flutter dependencies
        working-directory: mobile
        run: |
          uname -m
          [ "$(uname -m)" = x86_64 ] || { echo "::error::this runner is not an Intel Mac"; exit 1; }
          tar -xf generated-dart.tar && rm generated-dart.tar
          mise exec -- flutter pub get --enforce-lockfile

      - name: ONNX Runtime and model cache (Intel)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ai-intel
          key: onnxruntime-osx-x86_64-1.23.2-1b4431b1-8c9c78de-vda-eb5926ad

      # The library the app installs on Intel Macs, the gzip of the release checked by its SHA-256, the library by
      # that of the catalogue (onnxRuntimeMacIntelComponent); the model by that of videoDepthModelComponent
      - name: ONNX Runtime 1.23.2 (osx-x86_64) and the tiny models
        id: ort
        working-directory: mobile
        run: |
          ai="$RUNNER_TEMP/ai-intel"
          mkdir -p "$ai"
          archive="$ai/onnxruntime-1.23.2-osx-x86_64.dylib.gz"
          [ -f "$archive" ] || curl -sSfL --retry 3 -o "$archive" \
            https://github.com/freeKC/Immuch360/releases/download/ai-components-1/onnxruntime-1.23.2-osx-x86_64.dylib.gz
          echo "1b4431b1075470edb270745ec2ce3bcde18330531ea17c94c5763a56cbc2a141  $archive" | shasum -a 256 -c -
          lib="$ai/libonnxruntime.1.23.2.dylib"
          gzip -dc "$archive" > "$lib"
          echo "8c9c78de65ea3786f987c0d980e9c1b13a3a5fbc6b3e2965ba05b450e6e4c054  $lib" | shasum -a 256 -c -
          lipo -archs "$lib"
          model="$ai/video-depth-anything-small-dynamic-fp32.onnx"
          [ -f "$model" ] || curl -sSfL --retry 3 -o "$model" \
            https://github.com/freeKC/Immuch360/releases/download/ai-components-5/video-depth-anything-small-dynamic-fp32.onnx
          echo "eb5926ad36741e911c43cb010cc2f74604aa524744feeaf57979c178ede4bb99  $model" | shasum -a 256 -c -
          echo "lib=$lib" >> "$GITHUB_OUTPUT"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          IMMUCH360_ORT_LIB="$lib" mise exec -- flutter test test/desktop/ai/ort test/desktop/ai/video3d

      - name: A 3D video with the real model on an Intel Mac
        working-directory: mobile
        env:
          ORT_LIB: ${{ steps.ort.outputs.lib }}
          MODEL: ${{ steps.ort.outputs.model }}
        run: |
          set -o pipefail
          work="$RUNNER_TEMP/video3d"
          mkdir -p "$work/ffmpeg"
          curl -sSfL --retry 3 -o "$work/ffmpeg.zip" \
            https://github.com/immuch360/libmpv-builds/releases/download/ffmpeg-lgpl-20261118-9/Immuch360-ffmpeg-9.0.2-2-macos-universal.zip
          echo "b0d76f497d989283dd5d77c1076792e02371a7df092899f2a8d12857c65cf6b7  $work/ffmpeg.zip" | shasum -a 256 -c -
          (cd "$work/ffmpeg" && unzip -q ../ffmpeg.zip)
          python3 ../.github/desktop/ai/video3d_ci_clip.py make "$work/ffmpeg/bin/ffmpeg" "$work/clip.mkv"
          export IMMUCH360_VIDEO3D_ARGS="[\"--ffmpeg\",\"$work/ffmpeg\",\"--ort\",\"$ORT_LIB\",\"--model\",\"$MODEL\",\"--out\",\"$work/out\",\"--quality\",\"fast\",\"--segment\",\"1\",\"$work/clip.mkv\"]"
          start=$(date +%s)
          mise exec -- flutter test test/desktop/ai/video3d/video3d_integration_test.dart --reporter expanded \
            | tee "$work/run.log"
          python3 ../.github/desktop/ai/video3d_ci_clip.py check "$work/run.log"
          echo "the real model on ONNX Runtime 1.23.2 (Intel Mac runner, $(sysctl -n hw.ncpu) processors): $(( $(date +%s) - start )) s for the 4 s clip" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          python3 ../.github/desktop/ai/video3d_ci_clip.py drift "$work/ffmpeg/bin/ffmpeg" "$work/drift"

  # The eight files of the build in one place with their SHA-256, as immuch360-desktop-release.yml attaches them to a
  # release: a file missing or added shows on every run, not on the day of a release
  packages:
    name: Package files and checksums
    runs-on: ubuntu-24.04
    needs: [codegen, linux, macos, windows]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Immuch360-Desktop-*
          merge-multiple: true
          # Each artifact is one file uploaded as it is: kept whole, the two ZIPs too, under its own name
          skip-decompress: true
          path: release

      - name: Files and SHA-256
        env:
          LABEL: ${{ needs.codegen.outputs.label }}
        run: |
          python3 .github/desktop/desktop_release.py --dry-run --label "$LABEL" --sums release/SHA256SUMS.txt release/*
          {
            echo "### The files of a release"
            echo
            echo '```'
            cat release/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # stable-diffusion.cpp on Vulkan, the generator of the 360° panoramas (lot P2; design-final 2026-10-27, section 7.5),
  # built from the commits of .github/desktop/ai/sd_cpp.lock.json with the Vulkan SDK of LunarG it names, checked by
  # its SHA-256 (the headers and glslc of Ubuntu 22.04 are too old for the Vulkan backend of ggml), on the pinned images
  # of the desktop builds: Windows with Visual Studio 2022, Linux on Ubuntu 22.04 for its glibc. Only when asked (the
  # sdcpp input) or when the lock changed, never on every pull request otherwise. The archive is named
  # Immuch360-AI-sdcpp-<lock>-<system>.zip, not Immuch360-Desktop-*, so neither the packages job nor a release takes it;
  # immuch360-desktop-release.yml signs the Windows one (with_sdcpp), and publish_ai_components.py --from-run puts both
  # into ai-components-3. sd-cli --help is compared with the fixture the arguments of the runner are frozen by
  # (.github/desktop/ai/sdcpp_build.py)
  sdcpp-windows:
    name: stable-diffusion.cpp for Windows
    runs-on: windows-2022
    needs: codegen
    if: ${{ inputs.sdcpp || needs.codegen.outputs.sdcpp_lock_changed == 'true' }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The lock
        id: lock
        run: python .github/desktop/ai/sdcpp_build.py lock --system windows-x64 --github-output

      - name: Sources of stable-diffusion.cpp and ggml at the commits of the lock
        run: python .github/desktop/ai/sdcpp_build.py sources --dir "$RUNNER_TEMP/sdcpp"

      # The installer of LunarG, as stable-diffusion.cpp's own workflow runs it, into C:\VulkanSDK\<version>
      - name: Vulkan SDK of LunarG
        env:
          SDK_URL: ${{ steps.lock.outputs.sdk_url }}
          SDK_SHA256: ${{ steps.lock.outputs.sdk_sha256 }}
          SDK_VERSION: ${{ steps.lock.outputs.sdk_version }}
        run: |
          installer="$RUNNER_TEMP/vulkansdk.exe"
          curl -sSfL --retry 3 -o "$installer" "$SDK_URL"
          echo "$SDK_SHA256  $installer" | sha256sum -c -
          "$installer" --accept-licenses --default-answer --confirm-command install
          echo "VULKAN_SDK=C:\\VulkanSDK\\$SDK_VERSION" >> "$GITHUB_ENV"
          echo "C:\\VulkanSDK\\$SDK_VERSION\\Bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          glslc --version
          python .github/desktop/ai/sdcpp_build.py build --system windows-x64 --source "$RUNNER_TEMP/sdcpp" \
            --build "$RUNNER_TEMP/sdcpp-build"

      - name: sd-cli --help as the fixture says
        run: |
          "$RUNNER_TEMP/sdcpp-build/bin/sd-cli.exe" --help > "$RUNNER_TEMP/sd-cli-help.txt"
          python .github/desktop/ai/sdcpp_build.py help --output "$RUNNER_TEMP/sd-cli-help.txt"

      - name: The archive
        id: pack
        run: |
          python .github/desktop/ai/sdcpp_build.py pack --system windows-x64 --source "$RUNNER_TEMP/sdcpp" \
            --bin "$RUNNER_TEMP/sdcpp-build/bin" --out dist
          "$RUNNER_TEMP/sdcpp-build/bin/sd-cli.exe" --list-devices || echo "no device listed (no GPU on the runner)"

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/${{ steps.lock.outputs.artifact }}
          archive: false
          retention-days: 14
          if-no-files-found: error

  sdcpp-linux:
    name: stable-diffusion.cpp for Linux
    runs-on: ubuntu-22.04
    needs: codegen
    if: ${{ inputs.sdcpp || needs.codegen.outputs.sdcpp_lock_changed == 'true' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The lock
        id: lock
        run: python3 .github/desktop/ai/sdcpp_build.py lock --system linux-x64 --github-output

      - name: Sources of stable-diffusion.cpp and ggml at the commits of the lock
        run: python3 .github/desktop/ai/sdcpp_build.py sources --dir "$RUNNER_TEMP/sdcpp"

      # The tarball of LunarG: its headers, glslc and the loader to link with (the drivers bring the loader at run time)
      - name: Vulkan SDK of LunarG
        env:
          SDK_URL: ${{ steps.lock.outputs.sdk_url }}
          SDK_SHA256: ${{ steps.lock.outputs.sdk_sha256 }}
          SDK_VERSION: ${{ steps.lock.outputs.sdk_version }}
        run: |
          tarball="$RUNNER_TEMP/vulkansdk.tar.xz"
          curl -sSfL --retry 3 -o "$tarball" "$SDK_URL"
          echo "$SDK_SHA256  $tarball" | sha256sum -c -
          tar -xJf "$tarball" -C "$RUNNER_TEMP"
          sdk="$RUNNER_TEMP/$SDK_VERSION/x86_64"
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$sdk/lib" >> "$GITHUB_ENV"

      - name: Build
        run: |
          glslc --version
          python3 .github/desktop/ai/sdcpp_build.py build --system linux-x64 --source "$RUNNER_TEMP/sdcpp" \
            --build "$RUNNER_TEMP/sdcpp-build"

      # The launcher that makes sd-cli die with the app (PR_SET_PDEATHSIG), then the same check of its signal as the
      # tests of the app make: the child of a killed shell is gone
      - name: immuch360-run
        run: |
          gcc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/immuch360-run" .github/desktop/ai/immuch360_run.c
          launcher="$RUNNER_TEMP/immuch360-run"
          "$launcher" --parent $$ -- /bin/echo "the launcher runs"
          bash -c "\"$launcher\" --parent \$\$ -- /bin/sh -c 'echo \$\$ > \"$RUNNER_TEMP/child\"; exec sleep 300' & sleep 1; kill -9 \$\$" || true
          sleep 1
          child=$(cat "$RUNNER_TEMP/child")
          if [ -e "/proc/$child" ]; then echo "::error::the child $child outlived its parent"; exit 1; fi
          echo "the child $child died with its parent"

      - name: sd-cli --help as the fixture says
        run: |
          LD_LIBRARY_PATH= "$RUNNER_TEMP/sdcpp-build/bin/sd-cli" --help > "$RUNNER_TEMP/sd-cli-help.txt"
          python3 .github/desktop/ai/sdcpp_build.py help --output "$RUNNER_TEMP/sd-cli-help.txt"

      - name: The archive
        run: |
          python3 .github/desktop/ai/sdcpp_build.py pack --system linux-x64 --source "$RUNNER_TEMP/sdcpp" \
            --bin "$RUNNER_TEMP/sdcpp-build/bin" --launcher "$RUNNER_TEMP/immuch360-run" --out dist
          mkdir -p "$RUNNER_TEMP/unpacked"
          python3 -m zipfile -e "dist/${{ steps.lock.outputs.artifact }}" "$RUNNER_TEMP/unpacked"
          chmod +x "$RUNNER_TEMP/unpacked/sd-cli"
          LD_LIBRARY_PATH= "$RUNNER_TEMP/unpacked/sd-cli" --list-devices || echo "no device listed (no GPU on the runner)"

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/${{ steps.lock.outputs.artifact }}
          archive: false
          retention-days: 14
          if-no-files-found: error

  # The second archive of stable-diffusion.cpp, the engine of "Rebuild details" of Enhance (AI) (release 51,
  # store/m2/ai-enhance-2026-11-22): SeedVR2 3B runs only through the script mode (DGL) of a newer commit, 0d71f963
  # (tag master-1117-0d71f96, the build the probe of 23 November 2026 measured), so it is built apart from the archive
  # of the 360° panoramas, whose commit and measures stay as they are. The same script and options as the sdcpp jobs
  # above, with sd_cpp_seedvr2.lock.json and the help of that commit (sd_cli_seedvr2_help.txt); only when asked (the
  # sdcpp_seedvr2 input) or when that lock or that help changed. Its artifact Immuch360-AI-sdcpp-0d71f96-1-<system>.zip
  # is for ai-components-7; nothing here publishes it.
  sdcpp-seedvr2-windows:
    name: stable-diffusion.cpp of Enhance (AI) for Windows
    runs-on: windows-2022
    needs: codegen
    if: ${{ inputs.sdcpp_seedvr2 || needs.codegen.outputs.sdcpp_seedvr2_lock_changed == 'true' }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      LOCK: .github/desktop/ai/sd_cpp_seedvr2.lock.json
      HELP: mobile/test/fixtures/ai_immersive/sd_cli_seedvr2_help.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The lock
        id: lock
        run: python .github/desktop/ai/sdcpp_build.py --lock "$LOCK" lock --system windows-x64 --github-output

      - name: Sources of stable-diffusion.cpp and ggml at the commits of the lock
        run: python .github/desktop/ai/sdcpp_build.py --lock "$LOCK" sources --dir "$RUNNER_TEMP/sdcpp"

      - name: Vulkan SDK of LunarG
        env:
          SDK_URL: ${{ steps.lock.outputs.sdk_url }}
          SDK_SHA256: ${{ steps.lock.outputs.sdk_sha256 }}
          SDK_VERSION: ${{ steps.lock.outputs.sdk_version }}
        run: |
          installer="$RUNNER_TEMP/vulkansdk.exe"
          curl -sSfL --retry 3 -o "$installer" "$SDK_URL"
          echo "$SDK_SHA256  $installer" | sha256sum -c -
          "$installer" --accept-licenses --default-answer --confirm-command install
          echo "VULKAN_SDK=C:\\VulkanSDK\\$SDK_VERSION" >> "$GITHUB_ENV"
          echo "C:\\VulkanSDK\\$SDK_VERSION\\Bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          glslc --version
          python .github/desktop/ai/sdcpp_build.py --lock "$LOCK" build --system windows-x64 \
            --source "$RUNNER_TEMP/sdcpp" --build "$RUNNER_TEMP/sdcpp-build"

      - name: sd-cli --help as the fixture says
        run: |
          "$RUNNER_TEMP/sdcpp-build/bin/sd-cli.exe" --help > "$RUNNER_TEMP/sd-cli-help.txt"
          python .github/desktop/ai/sdcpp_build.py --lock "$LOCK" help --output "$RUNNER_TEMP/sd-cli-help.txt" \
            --fixture "$HELP"

      - name: The archive
        run: |
          python .github/desktop/ai/sdcpp_build.py --lock "$LOCK" pack --system windows-x64 \
            --source "$RUNNER_TEMP/sdcpp" --bin "$RUNNER_TEMP/sdcpp-build/bin" --out dist
          "$RUNNER_TEMP/sdcpp-build/bin/sd-cli.exe" --list-devices || echo "no device listed (no GPU on the runner)"

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/${{ steps.lock.outputs.artifact }}
          archive: false
          retention-days: 14
          if-no-files-found: error

  sdcpp-seedvr2-linux:
    name: stable-diffusion.cpp of Enhance (AI) for Linux
    runs-on: ubuntu-22.04
    needs: codegen
    if: ${{ inputs.sdcpp_seedvr2 || needs.codegen.outputs.sdcpp_seedvr2_lock_changed == 'true' }}
    timeout-minutes: 120
    env:
      LOCK: .github/desktop/ai/sd_cpp_seedvr2.lock.json
      HELP: mobile/test/fixtures/ai_immersive/sd_cli_seedvr2_help.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The lock
        id: lock
        run: python3 .github/desktop/ai/sdcpp_build.py --lock "$LOCK" lock --system linux-x64 --github-output

      - name: Sources of stable-diffusion.cpp and ggml at the commits of the lock
        run: python3 .github/desktop/ai/sdcpp_build.py --lock "$LOCK" sources --dir "$RUNNER_TEMP/sdcpp"

      - name: Vulkan SDK of LunarG
        env:
          SDK_URL: ${{ steps.lock.outputs.sdk_url }}
          SDK_SHA256: ${{ steps.lock.outputs.sdk_sha256 }}
          SDK_VERSION: ${{ steps.lock.outputs.sdk_version }}
        run: |
          tarball="$RUNNER_TEMP/vulkansdk.tar.xz"
          curl -sSfL --retry 3 -o "$tarball" "$SDK_URL"
          echo "$SDK_SHA256  $tarball" | sha256sum -c -
          tar -xJf "$tarball" -C "$RUNNER_TEMP"
          sdk="$RUNNER_TEMP/$SDK_VERSION/x86_64"
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$sdk/lib" >> "$GITHUB_ENV"

      - name: Build
        run: |
          glslc --version
          python3 .github/desktop/ai/sdcpp_build.py --lock "$LOCK" build --system linux-x64 \
            --source "$RUNNER_TEMP/sdcpp" --build "$RUNNER_TEMP/sdcpp-build"

      - name: immuch360-run
        run: gcc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/immuch360-run" .github/desktop/ai/immuch360_run.c

      - name: sd-cli --help as the fixture says
        run: |
          LD_LIBRARY_PATH= "$RUNNER_TEMP/sdcpp-build/bin/sd-cli" --help > "$RUNNER_TEMP/sd-cli-help.txt"
          python3 .github/desktop/ai/sdcpp_build.py --lock "$LOCK" help --output "$RUNNER_TEMP/sd-cli-help.txt" \
            --fixture "$HELP"

      - name: The archive
        run: |
          python3 .github/desktop/ai/sdcpp_build.py --lock "$LOCK" pack --system linux-x64 \
            --source "$RUNNER_TEMP/sdcpp" --bin "$RUNNER_TEMP/sdcpp-build/bin" --launcher "$RUNNER_TEMP/immuch360-run" \
            --out dist
          mkdir -p "$RUNNER_TEMP/unpacked"
          python3 -m zipfile -e "dist/${{ steps.lock.outputs.artifact }}" "$RUNNER_TEMP/unpacked"
          chmod +x "$RUNNER_TEMP/unpacked/sd-cli"
          LD_LIBRARY_PATH= "$RUNNER_TEMP/unpacked/sd-cli" --list-devices || echo "no device listed (no GPU on the runner)"

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/${{ steps.lock.outputs.artifact }}
          archive: false
          retention-days: 14
          if-no-files-found: error

  # The same stable-diffusion.cpp on Metal for Apple silicon (release 53, store/m2/release-53/enhance-mac-2026-11-25.md):
  # the engine of Sharpen and Rebuild details on a Mac, at the commits of sd_cpp_seedvr2.lock.json with its macos-arm64
  # options (SD_METAL, the Metal shaders embedded, everything static: one program sd-cli, signed ad hoc, no Developer
  # ID yet), its --help compared with the same fixture. Then what this virtual Mac can prove, its GPU being "Apple
  # Paravirtual device": the devices ggml lists, Sharpen through the backend of the app on Real-ESRGAN x4plus (the
  # asset of ai-components-3, checked by its SHA-256), and, not blocking, one tile of Rebuild details on SeedVR2 3B
  # (the assets of ai-components-7), which either runs on the GPU or stops and says the GPU was not used. Not the speed
  # nor the memory of a real Mac. Its artifact Immuch360-AI-sdcpp-0d71f96-1-macos-arm64.zip is for ai-components-7;
  # nothing here publishes it.
  sdcpp-seedvr2-macos:
    name: stable-diffusion.cpp of Enhance (AI) for Apple silicon (Metal)
    runs-on: macos-15
    needs: codegen
    if: ${{ inputs.sdcpp_seedvr2 || needs.codegen.outputs.sdcpp_seedvr2_lock_changed == 'true' }}
    timeout-minutes: 120
    env:
      LOCK: .github/desktop/ai/sd_cpp_seedvr2.lock.json
      HELP: mobile/test/fixtures/ai_immersive/sd_cli_seedvr2_help.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The lock
        id: lock
        run: python3 .github/desktop/ai/sdcpp_build.py --lock "$LOCK" lock --system macos-arm64 --github-output

      - name: Sources of stable-diffusion.cpp and ggml at the commits of the lock
        run: python3 .github/desktop/ai/sdcpp_build.py --lock "$LOCK" sources --dir "$RUNNER_TEMP/sdcpp"

      - name: Build
        run: |
          uname -m
          xcrun clang --version | head -1
          sw_vers
          python3 .github/desktop/ai/sdcpp_build.py --lock "$LOCK" build --system macos-arm64 \
            --source "$RUNNER_TEMP/sdcpp" --build "$RUNNER_TEMP/sdcpp-build"

      - name: sd-cli --help as the fixture says
        run: |
          "$RUNNER_TEMP/sdcpp-build/bin/sd-cli" --help > "$RUNNER_TEMP/sd-cli-help.txt"
          python3 .github/desktop/ai/sdcpp_build.py --lock "$LOCK" help --output "$RUNNER_TEMP/sd-cli-help.txt" \
            --fixture "$HELP"

      - name: The archive
        id: archive
        run: |
          python3 .github/desktop/ai/sdcpp_build.py --lock "$LOCK" pack --system macos-arm64 \
            --source "$RUNNER_TEMP/sdcpp" --bin "$RUNNER_TEMP/sdcpp-build/bin" --out dist
          unpacked="$RUNNER_TEMP/unpacked"
          mkdir -p "$unpacked"
          python3 -m zipfile -e "dist/${{ steps.lock.outputs.artifact }}" "$unpacked"
          chmod +x "$unpacked/sd-cli"
          otool -L "$unpacked/sd-cli"
          vtool -show-build "$unpacked/sd-cli" || true
          codesign --verify --strict --verbose=2 "$unpacked/sd-cli"
          echo "sdcli=$unpacked/sd-cli" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/metal-out"
          "$unpacked/sd-cli" --list-devices 2>&1 | tee "$RUNNER_TEMP/metal-out/list-devices.txt" \
            || echo "no device listed"

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/${{ steps.lock.outputs.artifact }}
          archive: false
          retention-days: 14
          if-no-files-found: error

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: false
          cache: true

      - name: Install Flutter
        run: cd mobile && mise install

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-dart
          path: mobile

      - name: Flutter dependencies
        working-directory: mobile
        run: |
          tar -xf generated-dart.tar
          mise exec -- flutter pub get --enforce-lockfile

      # Real-ESRGAN x4plus as the app installs it (upscalerComponent, ai-components-3), then Sharpen of a picture of
      # 320 x 240 through SdCppSharpenBackend and SdCppUpscaler on sdCppMetalDevice: no --backend, sd-cli takes the GPU
      - name: Sharpen on the GPU of this Mac through the backend of the app
        working-directory: mobile
        env:
          SD_CLI: ${{ steps.archive.outputs.sdcli }}
        run: |
          models="$RUNNER_TEMP/models"
          mkdir -p "$models"
          curl -sSfL --retry 3 -o "$models/RealESRGAN_x4plus.pth" \
            https://github.com/freeKC/Immuch360/releases/download/ai-components-3/RealESRGAN_x4plus.pth
          echo "4fa0d38905f75ac06eb49a7951b426670021be3018265fd191d2125df9d682f1  $models/RealESRGAN_x4plus.pth" \
            | shasum -a 256 -c -
          export IMMUCH360_ENHANCE_METAL="{\"sdCli\":\"$SD_CLI\",\"upscaler\":\"$models/RealESRGAN_x4plus.pth\",\"out\":\"$RUNNER_TEMP/metal-out/sharpen\"}"
          mise exec -- flutter test test/desktop/ai/enhance/enhance_metal_integration_test.dart --reporter expanded \
            --plain-name Sharpen

      # SeedVR2 3B int8 convrot and its VAE as the app installs them (ai-components-7: the DiT in two parts, put end to
      # end and checked by the SHA-256 of the whole file), then one tile of 512 px through SdCppRebuildBackend. Not
      # blocking: the virtual GPU of the runner and its 7 GB of memory may refuse it, which the outcome says
      - name: One tile of Rebuild details on the GPU of this Mac (information)
        id: rebuild
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 45
        working-directory: mobile
        env:
          SD_CLI: ${{ steps.archive.outputs.sdcli }}
        run: |
          models="$RUNNER_TEMP/models"
          base=https://github.com/freeKC/Immuch360/releases/download/ai-components-7
          { curl -sSfL --retry 3 "$base/seedvr2_3b_int8_convrot.safetensors.001"
            curl -sSfL --retry 3 "$base/seedvr2_3b_int8_convrot.safetensors.002"; } \
            > "$models/seedvr2_3b_int8_convrot.safetensors"
          echo "c3dec8bcc5916843a8a858572970597462e1f2dc598d6dfd818f6cd40f53a157  $models/seedvr2_3b_int8_convrot.safetensors" \
            | shasum -a 256 -c -
          curl -sSfL --retry 3 -o "$models/seedvr2_ema_vae_fp16.safetensors" "$base/seedvr2_ema_vae_fp16.safetensors"
          echo "20678548f420d98d26f11442d3528f8b8c94e57ee046ef93dbb7633da8612ca1  $models/seedvr2_ema_vae_fp16.safetensors" \
            | shasum -a 256 -c -
          sysctl hw.memsize
          df -h "$RUNNER_TEMP"
          export IMMUCH360_ENHANCE_METAL="{\"sdCli\":\"$SD_CLI\",\"upscaler\":\"\",\"dit\":\"$models/seedvr2_3b_int8_convrot.safetensors\",\"vae\":\"$models/seedvr2_ema_vae_fp16.safetensors\",\"out\":\"$RUNNER_TEMP/metal-out/rebuild\"}"
          mise exec -- flutter test test/desktop/ai/enhance/enhance_metal_integration_test.dart --reporter expanded \
            --plain-name "Rebuild details"

      # The same program again through sd-cli alone, past the line that made the app stop it, to see how far the
      # virtual GPU goes: its exit code and the tiles it wrote (information only, the app never does this)
      - name: The program of Rebuild details through sd-cli alone (information)
        if: ${{ !cancelled() && steps.rebuild.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 30
        env:
          SD_CLI: ${{ steps.archive.outputs.sdcli }}
        run: |
          work="$RUNNER_TEMP/metal-out/rebuild/work"
          ls -l "$work" "$work/tiles" || true
          [ -f "$work/rebuild.dgl" ] || { echo "no program kept"; exit 0; }
          set +e
          "$SD_CLI" -M dgl --script "$work/rebuild.dgl" --max-vram 6 -t 3 -v > "$RUNNER_TEMP/metal-out/rebuild/alone.log" 2>&1
          echo "sd-cli ended with $?" | tee -a "$RUNNER_TEMP/metal-out/rebuild/alone.log"
          grep -E 'error|\[E\]|\[W\]|item [0-9]+/|auto-fit|params ->|budget' "$RUNNER_TEMP/metal-out/rebuild/alone.log" | head -40
          tail -5 "$RUNNER_TEMP/metal-out/rebuild/alone.log"
          ls -l "$work/tiles"

      - name: What this Mac said
        if: ${{ !cancelled() }}
        run: |
          out="$RUNNER_TEMP/metal-out"
          {
            echo "### sd-cli on Metal, ${{ steps.lock.outputs.artifact }}"
            echo '```'
            cat "$out/list-devices.txt" 2>/dev/null || true
            for part in sharpen rebuild; do
              echo "--- $part"
              cat "$out/$part/outcome.json" 2>/dev/null || echo "no outcome"
              grep -h -i -E 'ggml_metal|MTL|auto-fit|fall|error' "$out/$part/sd-cli.log" 2>/dev/null | head -40 || true
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload what this Mac said
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: enhance-metal-logs-macos-arm64
          path: ${{ runner.temp }}/metal-out
          retention-days: 14
          if-no-files-found: ignore

  # COLMAP 4.2.1 on the processor, without its GPL parts, which places the photos of the splat scenes (lot SP1 of the
  # splat maker, plan of 2026-11-01, section 3): built from the commit of .github/desktop/ai/colmap.lock.json with the
  # patches of licenses/colmap/patches (no CHOLMOD, no SuiteSparse in Ceres) and the libraries of vcpkg at the commit of
  # the lock (LAPACK by CLAPACK, our overlay port, never the Fortran of lapack-reference), on the pinned images of the
  # desktop builds. A first build of the libraries takes hours: they go to the binary cache of vcpkg, kept in the Actions
  # cache, so that the next runs take them from there. Only when asked (the colmap input) or when the lock or its patches
  # changed. The licence of every library is read in its vcpkg.spdx.json against our list, the archive holds no
  # forbidden file, import or string, the archive's program places every view of a synthetic set where it is, and the
  # help of the commands the app runs is compared with the fixtures its runner is frozen by
  # (.github/desktop/ai/colmap_build.py, colmap_synthetic.py). The archive is named Immuch360-AI-colmap-<lock>-<system>.zip,
  # not Immuch360-Desktop-*, so neither the packages job nor a release takes it.
  colmap-windows:
    name: COLMAP for Windows
    runs-on: windows-2022
    needs: codegen
    if: ${{ inputs.colmap || needs.codegen.outputs.colmap_lock_changed == 'true' }}
    timeout-minutes: 300
    env:
      VCPKG_DISABLE_METRICS: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The lock
        id: lock
        run: python .github/desktop/ai/colmap_build.py lock --system windows-x64 --github-output

      - name: Sources of COLMAP at the commit of the lock, with our patches
        run: python .github/desktop/ai/colmap_build.py sources --dir "$RUNNER_TEMP/colmap"

      - name: Restore the binary cache of vcpkg
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: colmap-vcpkg-${{ steps.lock.outputs.cache_key }}-${{ github.run_id }}
          restore-keys: colmap-vcpkg-${{ steps.lock.outputs.cache_key }}-

      - name: vcpkg and the libraries of COLMAP
        id: vcpkg
        run: |
          python .github/desktop/ai/colmap_build.py vcpkg --system windows-x64 --source "$RUNNER_TEMP/colmap" \
            --vcpkg "$RUNNER_TEMP/v" --installed "$RUNNER_TEMP/vi" --cache "$RUNNER_TEMP/vcpkg-archives" --github-output

      # Even when the libraries failed halfway: what was built is kept for the next run
      - name: Save the binary cache of vcpkg
        if: ${{ always() && steps.vcpkg.outputs.cache_grew == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: colmap-vcpkg-${{ steps.lock.outputs.cache_key }}-${{ github.run_id }}

      # A licence out of our list fails the job at its end, after the build, so that one run says everything
      - name: The licence of every library (vcpkg.spdx.json) against our list and the table of THIRD-PARTY.md
        id: licences
        continue-on-error: true
        run: |
          python .github/desktop/ai/colmap_build.py licences --system windows-x64 --installed "$RUNNER_TEMP/vi" \
            --ports-json "$RUNNER_TEMP/colmap-report/ports-windows-x64.json"

      - name: Build
        run: |
          python .github/desktop/ai/colmap_build.py build --system windows-x64 --source "$RUNNER_TEMP/colmap" \
            --build "$RUNNER_TEMP/colmap-build" --vcpkg "$RUNNER_TEMP/v" --installed "$RUNNER_TEMP/vi"

      - name: The archive
        id: pack
        run: |
          python .github/desktop/ai/colmap_build.py pack --system windows-x64 --source "$RUNNER_TEMP/colmap" \
            --build "$RUNNER_TEMP/colmap-build" --installed "$RUNNER_TEMP/vi" --out dist
          mkdir -p "$RUNNER_TEMP/unpacked"
          python -m zipfile -e "dist/${{ steps.lock.outputs.artifact }}" "$RUNNER_TEMP/unpacked"
          python .github/desktop/ai/colmap_build.py check --archive "dist/${{ steps.lock.outputs.artifact }}"
          {
            echo "### ${{ steps.lock.outputs.artifact }}"
            echo
            echo '```'
            cat "dist/${{ steps.lock.outputs.artifact }}.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The synthetic set posed by the program of the archive
        run: |
          python .github/desktop/ai/colmap_synthetic.py render --out "$RUNNER_TEMP/synthetic"
          python .github/desktop/ai/colmap_synthetic.py pose --colmap "$RUNNER_TEMP/unpacked/colmap.exe" \
            --set "$RUNNER_TEMP/synthetic"
          python .github/desktop/ai/colmap_synthetic.py compare --set "$RUNNER_TEMP/synthetic"

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/${{ steps.lock.outputs.artifact }}
          archive: false
          retention-days: 14
          if-no-files-found: error

      - name: colmap help as the fixtures say
        id: help
        if: ${{ always() && steps.pack.outcome == 'success' }}
        continue-on-error: true
        run: |
          python .github/desktop/ai/colmap_build.py help --colmap "$RUNNER_TEMP/unpacked/colmap.exe" \
            --save "$RUNNER_TEMP/colmap-report/help-windows-x64"

      # The port list and the help texts of this run, to write the table of THIRD-PARTY.md and the fixtures from
      - name: Upload the port list and the help texts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: colmap-report-windows-x64
          path: ${{ runner.temp }}/colmap-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Licences and help as they must be
        if: ${{ always() && (steps.licences.outcome == 'failure' || steps.help.outcome == 'failure') }}
        run: |
          echo "::error::the licences (${{ steps.licences.outcome }}) or the help (${{ steps.help.outcome }}) failed"
          exit 1

  colmap-linux:
    name: COLMAP for Linux
    runs-on: ubuntu-22.04
    needs: codegen
    if: ${{ inputs.colmap || needs.codegen.outputs.colmap_lock_changed == 'true' }}
    timeout-minutes: 300
    env:
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The lock
        id: lock
        run: python3 .github/desktop/ai/colmap_build.py lock --system linux-x64 --github-output

      - name: Sources of COLMAP at the commit of the lock, with our patches
        run: python3 .github/desktop/ai/colmap_build.py sources --dir "$RUNNER_TEMP/colmap"

      # Ninja, and the headers of OpenGL that the CMake of COLMAP looks for even without its interface (nothing links
      # them: the needed libraries of the archive are checked)
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgl1-mesa-dev

      - name: Restore the binary cache of vcpkg
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: colmap-vcpkg-${{ steps.lock.outputs.cache_key }}-${{ github.run_id }}
          restore-keys: colmap-vcpkg-${{ steps.lock.outputs.cache_key }}-

      - name: vcpkg and the libraries of COLMAP
        id: vcpkg
        run: |
          python3 .github/desktop/ai/colmap_build.py vcpkg --system linux-x64 --source "$RUNNER_TEMP/colmap" \
            --vcpkg "$RUNNER_TEMP/v" --installed "$RUNNER_TEMP/vi" --cache "$RUNNER_TEMP/vcpkg-archives" --github-output

      - name: Save the binary cache of vcpkg
        if: ${{ always() && steps.vcpkg.outputs.cache_grew == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: colmap-vcpkg-${{ steps.lock.outputs.cache_key }}-${{ github.run_id }}

      - name: The licence of every library (vcpkg.spdx.json) against our list and the table of THIRD-PARTY.md
        id: licences
        continue-on-error: true
        run: |
          python3 .github/desktop/ai/colmap_build.py licences --system linux-x64 --installed "$RUNNER_TEMP/vi" \
            --ports-json "$RUNNER_TEMP/colmap-report/ports-linux-x64.json"

      - name: Build
        run: |
          python3 .github/desktop/ai/colmap_build.py build --system linux-x64 --source "$RUNNER_TEMP/colmap" \
            --build "$RUNNER_TEMP/colmap-build" --vcpkg "$RUNNER_TEMP/v" --installed "$RUNNER_TEMP/vi"

      - name: immuch360-run
        run: gcc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/immuch360-run" .github/desktop/ai/immuch360_run.c

      - name: The archive
        id: pack
        run: |
          python3 .github/desktop/ai/colmap_build.py pack --system linux-x64 --source "$RUNNER_TEMP/colmap" \
            --build "$RUNNER_TEMP/colmap-build" --installed "$RUNNER_TEMP/vi" --launcher "$RUNNER_TEMP/immuch360-run" \
            --out dist
          mkdir -p "$RUNNER_TEMP/unpacked"
          python3 -m zipfile -e "dist/${{ steps.lock.outputs.artifact }}" "$RUNNER_TEMP/unpacked"
          chmod +x "$RUNNER_TEMP/unpacked/colmap" "$RUNNER_TEMP/unpacked/immuch360-run"
          python3 .github/desktop/ai/colmap_build.py check --archive "dist/${{ steps.lock.outputs.artifact }}"
          {
            echo "### ${{ steps.lock.outputs.artifact }}"
            echo
            echo '```'
            cat "dist/${{ steps.lock.outputs.artifact }}.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The synthetic set posed by the program of the archive
        run: |
          python3 .github/desktop/ai/colmap_synthetic.py render --out "$RUNNER_TEMP/synthetic"
          python3 .github/desktop/ai/colmap_synthetic.py pose --colmap "$RUNNER_TEMP/unpacked/colmap" \
            --set "$RUNNER_TEMP/synthetic"
          python3 .github/desktop/ai/colmap_synthetic.py compare --set "$RUNNER_TEMP/synthetic"

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/${{ steps.lock.outputs.artifact }}
          archive: false
          retention-days: 14
          if-no-files-found: error

      - name: colmap help as the fixtures say
        id: help
        if: ${{ always() && steps.pack.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 .github/desktop/ai/colmap_build.py help --colmap "$RUNNER_TEMP/unpacked/colmap" \
            --save "$RUNNER_TEMP/colmap-report/help-linux-x64"

      - name: Upload the port list and the help texts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: colmap-report-linux-x64
          path: ${{ runner.temp }}/colmap-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Licences and help as they must be
        if: ${{ always() && (steps.licences.outcome == 'failure' || steps.help.outcome == 'failure') }}
        run: |
          echo "::error::the licences (${{ steps.licences.outcome }}) or the help (${{ steps.help.outcome }}) failed"
          exit 1

  # Brush, the trainer of the splat scenes (lot SP2; plan of 01/11/2026, sections 2.3 and 3), built from the tag of
  # .github/desktop/ai/brush.lock.json at its commit with the toolchain of Brush's own CI at that tag, cargo build
  # --locked (the Cargo.lock of the tag), after licenses/brush/patches: brush_app without window, network client, rerun
  # or the LPIPS weights, whose provenance is not written. The jobs check that the crates compiled in hold none of them
  # (cargo tree, and cargo deny with licenses/brush/deny.toml, our licence list), that none of five 64 byte probes of
  # the weights is in the program, and that --help is the fixture the runner is frozen by; THIRD-PARTY.md is written by
  # cargo about. cargo-deny and cargo-about come from their releases, checked by the SHA-256 of the lock. Only when
  # asked (the brush input) or when the lock, its script or licenses/brush changed. The cargo registry, the git
  # dependencies and the target folder are cached by the id of the lock. The archive is
  # Immuch360-AI-brush-<lock>-<system>.zip, not Immuch360-Desktop-*, so neither the packages job nor a release takes it
  # (.github/desktop/ai/brush_build.py)
  brush-windows:
    name: Brush for Windows
    runs-on: windows-2022
    needs: codegen
    if: ${{ inputs.brush || needs.codegen.outputs.brush_lock_changed == 'true' }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The lock
        id: lock
        run: python .github/desktop/ai/brush_build.py lock --system windows-x64 --github-output

      - name: Sources of Brush at the commit of the tag, without the LPIPS weights, patched
        run: python .github/desktop/ai/brush_build.py sources --dir "$RUNNER_TEMP/brush"

      - name: cargo-deny and cargo-about of the lock
        id: tools
        run: python .github/desktop/ai/brush_build.py tools --system windows-x64 --dir "$RUNNER_TEMP/brush-tools" --github-output

      - name: Rust of the lock
        env:
          TOOLCHAIN: ${{ steps.lock.outputs.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update
          rustup run "$TOOLCHAIN" rustc --version --verbose

      - name: Restore the cargo cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/brush/target
          key: brush-windows-x64-${{ steps.lock.outputs.id }}-${{ hashFiles('.github/desktop/ai/brush.lock.json', 'licenses/brush/patches/*') }}
          restore-keys: |
            brush-windows-x64-${{ steps.lock.outputs.id }}-

      - name: Build
        id: build
        run: python .github/desktop/ai/brush_build.py build --system windows-x64 --source "$RUNNER_TEMP/brush"

      - name: Save the cargo cache
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/brush/target
          key: brush-windows-x64-${{ steps.lock.outputs.id }}-${{ hashFiles('.github/desktop/ai/brush.lock.json', 'licenses/brush/patches/*') }}

      - name: No LPIPS, rerun, network, TLS, window or file dialog crate in brush_app
        run: python .github/desktop/ai/brush_build.py graph --system windows-x64 --source "$RUNNER_TEMP/brush"

      - name: cargo deny with our licence list
        env:
          CARGO_DENY: ${{ steps.tools.outputs.cargo_deny }}
        run: python .github/desktop/ai/brush_build.py deny --system windows-x64 --source "$RUNNER_TEMP/brush" --cargo-deny "$CARGO_DENY"

      # Recorded in BUILD-INFO.txt, never blocking: updating Cargo.lock of the tag for them is the maintainer's decision
      - name: Advisories of the RustSec database
        continue-on-error: true
        env:
          CARGO_DENY: ${{ steps.tools.outputs.cargo_deny }}
        run: |
          python .github/desktop/ai/brush_build.py advisories --system windows-x64 --source "$RUNNER_TEMP/brush" \
            --cargo-deny "$CARGO_DENY" --out "$RUNNER_TEMP/brush-advisories.txt"

      - name: THIRD-PARTY.md by cargo about
        env:
          CARGO_ABOUT: ${{ steps.tools.outputs.cargo_about }}
        run: |
          python .github/desktop/ai/brush_build.py about --system windows-x64 --source "$RUNNER_TEMP/brush" \
            --cargo-about "$CARGO_ABOUT" --out "$RUNNER_TEMP/brush-licences/THIRD-PARTY.md"

      - name: None of the LPIPS weights in brush_app
        env:
          PROGRAM: ${{ steps.build.outputs.program }}
        run: python .github/desktop/ai/brush_build.py lpips --binary "$PROGRAM"

      - name: brush_app --help as the fixture says, no viewer, no LPIPS loss
        env:
          PROGRAM: ${{ steps.build.outputs.program }}
        run: |
          "$PROGRAM" --help > "$RUNNER_TEMP/brush-help.txt"
          "$PROGRAM" --version > "$RUNNER_TEMP/brush-version.txt"
          python .github/desktop/ai/brush_build.py help --output "$RUNNER_TEMP/brush-help.txt" \
            --version-output "$RUNNER_TEMP/brush-version.txt"
          if "$PROGRAM" > "$RUNNER_TEMP/brush-viewer.txt" 2>&1; then
            echo "::error::brush_app without a source started (a viewer?)"; exit 1
          fi
          grep -q "no viewer" "$RUNNER_TEMP/brush-viewer.txt" || { cat "$RUNNER_TEMP/brush-viewer.txt"; exit 1; }
          echo "brush_app without a source: $(cat "$RUNNER_TEMP/brush-viewer.txt")"
          # A LPIPS weight is refused before the data is read or a card is set up, so at once even on a runner
          if timeout 120 "$PROGRAM" . --lpips-loss-weight 0.5 > "$RUNNER_TEMP/brush-lpips.txt" 2>&1; then
            echo "::error::brush_app took a LPIPS weight above 0"; exit 1
          fi
          grep -q "no LPIPS weights" "$RUNNER_TEMP/brush-lpips.txt" || { cat "$RUNNER_TEMP/brush-lpips.txt"; exit 1; }
          echo "brush_app --lpips-loss-weight 0.5: $(cat "$RUNNER_TEMP/brush-lpips.txt")"

      - name: The archive
        env:
          PROGRAM: ${{ steps.build.outputs.program }}
        run: |
          python .github/desktop/ai/brush_build.py pack --system windows-x64 --source "$RUNNER_TEMP/brush" \
            --bin "$PROGRAM" --third-party "$RUNNER_TEMP/brush-licences/THIRD-PARTY.md" \
            --advisories "$RUNNER_TEMP/brush-advisories.txt" --out dist

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/${{ steps.lock.outputs.artifact }}
          archive: false
          retention-days: 14
          if-no-files-found: error

  brush-linux:
    name: Brush for Linux
    runs-on: ubuntu-22.04
    needs: codegen
    if: ${{ inputs.brush || needs.codegen.outputs.brush_lock_changed == 'true' }}
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The lock
        id: lock
        run: python3 .github/desktop/ai/brush_build.py lock --system linux-x64 --github-output

      - name: Sources of Brush at the commit of the tag, without the LPIPS weights, patched
        run: python3 .github/desktop/ai/brush_build.py sources --dir "$RUNNER_TEMP/brush"

      - name: cargo-deny and cargo-about of the lock
        id: tools
        run: python3 .github/desktop/ai/brush_build.py tools --system linux-x64 --dir "$RUNNER_TEMP/brush-tools" --github-output

      - name: Rust of the lock
        env:
          TOOLCHAIN: ${{ steps.lock.outputs.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update
          rustup run "$TOOLCHAIN" rustc --version --verbose

      - name: Restore the cargo cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/brush/target
          key: brush-linux-x64-${{ steps.lock.outputs.id }}-${{ hashFiles('.github/desktop/ai/brush.lock.json', 'licenses/brush/patches/*') }}
          restore-keys: |
            brush-linux-x64-${{ steps.lock.outputs.id }}-

      - name: Build
        id: build
        run: python3 .github/desktop/ai/brush_build.py build --system linux-x64 --source "$RUNNER_TEMP/brush"

      - name: Save the cargo cache
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/brush/target
          key: brush-linux-x64-${{ steps.lock.outputs.id }}-${{ hashFiles('.github/desktop/ai/brush.lock.json', 'licenses/brush/patches/*') }}

      - name: No LPIPS, rerun, network, TLS, window or file dialog crate in brush_app
        run: python3 .github/desktop/ai/brush_build.py graph --system linux-x64 --source "$RUNNER_TEMP/brush"

      - name: cargo deny with our licence list
        env:
          CARGO_DENY: ${{ steps.tools.outputs.cargo_deny }}
        run: python3 .github/desktop/ai/brush_build.py deny --system linux-x64 --source "$RUNNER_TEMP/brush" --cargo-deny "$CARGO_DENY"

      # Recorded in BUILD-INFO.txt, never blocking: updating Cargo.lock of the tag for them is the maintainer's decision
      - name: Advisories of the RustSec database
        continue-on-error: true
        env:
          CARGO_DENY: ${{ steps.tools.outputs.cargo_deny }}
        run: |
          python3 .github/desktop/ai/brush_build.py advisories --system linux-x64 --source "$RUNNER_TEMP/brush" \
            --cargo-deny "$CARGO_DENY" --out "$RUNNER_TEMP/brush-advisories.txt"

      - name: THIRD-PARTY.md by cargo about
        env:
          CARGO_ABOUT: ${{ steps.tools.outputs.cargo_about }}
        run: |
          python3 .github/desktop/ai/brush_build.py about --system linux-x64 --source "$RUNNER_TEMP/brush" \
            --cargo-about "$CARGO_ABOUT" --out "$RUNNER_TEMP/brush-licences/THIRD-PARTY.md"

      - name: None of the LPIPS weights in brush_app
        env:
          PROGRAM: ${{ steps.build.outputs.program }}
        run: python3 .github/desktop/ai/brush_build.py lpips --binary "$PROGRAM"

      - name: brush_app --help as the fixture says, no viewer, no LPIPS loss
        env:
          PROGRAM: ${{ steps.build.outputs.program }}
        run: |
          "$PROGRAM" --help > "$RUNNER_TEMP/brush-help.txt"
          "$PROGRAM" --version > "$RUNNER_TEMP/brush-version.txt"
          python3 .github/desktop/ai/brush_build.py help --output "$RUNNER_TEMP/brush-help.txt" \
            --version-output "$RUNNER_TEMP/brush-version.txt"
          if "$PROGRAM" > "$RUNNER_TEMP/brush-viewer.txt" 2>&1; then
            echo "::error::brush_app without a source started (a viewer?)"; exit 1
          fi
          grep -q "no viewer" "$RUNNER_TEMP/brush-viewer.txt" || { cat "$RUNNER_TEMP/brush-viewer.txt"; exit 1; }
          echo "brush_app without a source: $(cat "$RUNNER_TEMP/brush-viewer.txt")"
          # A LPIPS weight is refused before the data is read or a card is set up, so at once even on a runner
          if timeout 120 "$PROGRAM" . --lpips-loss-weight 0.5 > "$RUNNER_TEMP/brush-lpips.txt" 2>&1; then
            echo "::error::brush_app took a LPIPS weight above 0"; exit 1
          fi
          grep -q "no LPIPS weights" "$RUNNER_TEMP/brush-lpips.txt" || { cat "$RUNNER_TEMP/brush-lpips.txt"; exit 1; }
          echo "brush_app --lpips-loss-weight 0.5: $(cat "$RUNNER_TEMP/brush-lpips.txt")"

      # The launcher that makes brush_app die with the app (PR_SET_PDEATHSIG), as in the archive of stable-diffusion.cpp
      - name: immuch360-run
        run: gcc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/immuch360-run" .github/desktop/ai/immuch360_run.c

      - name: The archive
        env:
          PROGRAM: ${{ steps.build.outputs.program }}
          ARTIFACT: ${{ steps.lock.outputs.artifact }}
        run: |
          python3 .github/desktop/ai/brush_build.py pack --system linux-x64 --source "$RUNNER_TEMP/brush" \
            --bin "$PROGRAM" --third-party "$RUNNER_TEMP/brush-licences/THIRD-PARTY.md" \
            --advisories "$RUNNER_TEMP/brush-advisories.txt" --launcher "$RUNNER_TEMP/immuch360-run" --out dist
          mkdir -p "$RUNNER_TEMP/unpacked"
          python3 -m zipfile -e "dist/$ARTIFACT" "$RUNNER_TEMP/unpacked"
          chmod +x "$RUNNER_TEMP/unpacked/brush_app" "$RUNNER_TEMP/unpacked/immuch360-run"
          "$RUNNER_TEMP/unpacked/immuch360-run" --parent $$ -- "$RUNNER_TEMP/unpacked/brush_app" --version

      # The archive trains, not only starts: 30 steps of a small posed scene (brush_build.py scene) on the processor,
      # through Mesa's lavapipe, in a fresh working folder (the autotune cache of cubecl lives there, and one left by
      # another device makes Brush fail at its first kernel), started by immuch360-run as the app starts it
      - name: brush_app of the archive trains on the processor (lavapipe)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers
          python3 .github/desktop/ai/brush_build.py scene --dir "$RUNNER_TEMP/brush-scene"
          mkdir -p "$RUNNER_TEMP/brush-train"
          cd "$RUNNER_TEMP/brush-train"
          status=0
          # immuch360-run must be a child of this shell (--parent $$) and runs a program by its path: the time limit
          # goes after it, by its path
          VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
          RUST_LOG='brush_cli=info,brush_process=info,cubecl_wgpu=info' \
            "$RUNNER_TEMP/unpacked/immuch360-run" --parent $$ -- "$(command -v timeout)" 900 \
            "$RUNNER_TEMP/unpacked/brush_app" "$RUNNER_TEMP/brush-scene" --total-steps 30 --max-resolution 128 \
            --export-every 30 --export-path "$RUNNER_TEMP/brush-train/out" > train.log 2>&1 || status=$?
          cat train.log
          [ "$status" -eq 0 ] || { echo "::error::brush_app exited $status on lavapipe"; exit 1; }
          python3 "$GITHUB_WORKSPACE/.github/desktop/ai/brush_build.py" trained --log train.log \
            --ply out/export_30.ply

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/${{ steps.lock.outputs.artifact }}
          archive: false
          retention-days: 14
          if-no-files-found: error

  # An upstream change of a pigeon contract, of main.dart or of the HTTP clients shows on the day of the merge: the
  # test and linux jobs of the same run analyze, test and build the sync; this job adds what to read by hand
  # Spark 2.4.0 built from its tag on miniz_oxide (lot SV0 of the splat viewer): the toolchain of spark.lock.json,
  # nothing but the repository and the public registries, no secret; the files are committed by hand from the artifact
  spark:
    name: Spark for the splat viewer
    runs-on: ubuntu-24.04
    needs: codegen
    if: ${{ inputs.spark || needs.codegen.outputs.spark_lock_changed == 'true' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: false
          cache: true

      - name: Node, Rust and wasm-pack of the lock
        run: |
          lock=.github/desktop/splat_viewer/spark.lock.json
          node_version=$(python3 -c "import json; print(json.load(open('$lock'))['toolchain']['node'])")
          rust_version=$(python3 -c "import json; print(json.load(open('$lock'))['toolchain']['rust'])")
          pack_version=$(python3 -c "import json; print(json.load(open('$lock'))['toolchain']['wasm_pack'])")
          mise install "node@$node_version"
          echo "$(mise where "node@$node_version")/bin" >> "$GITHUB_PATH"
          rustup toolchain install "$rust_version" --profile minimal --target wasm32-unknown-unknown
          rustup default "$rust_version"
          cargo install wasm-pack --version "$pack_version" --locked

      - name: Build
        run: |
          node --version
          python3 .github/desktop/splat_viewer/spark_build.py --work "$RUNNER_TEMP/spark-work" \
            --out "$RUNNER_TEMP/spark-out"

      - name: Upload Spark
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Immuch360-splat-viewer-spark
          path: ${{ runner.temp }}/spark-out
          retention-days: 14
          if-no-files-found: error

      # The same bytes as the files committed under mobile/assets/splat_viewer, once some are
      - name: The same bytes as the committed files
        run: python3 .github/desktop/splat_viewer/check_vendor.py --built "$RUNNER_TEMP/spark-out"

  upstream-sync:
    name: Upstream sync checklist
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/heads/upstream-sync/')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The desktop branch is needed for its merge base
          fetch-depth: 0
          filter: blob:none

      - name: Sync checklist (in the run summary)
        run: python3 .github/desktop/upstream_sync_report.py --base origin/desktop --summary "$GITHUB_STEP_SUMMARY"
