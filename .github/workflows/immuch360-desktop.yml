name: Immuch360 Desktop

# Immuch360 Desktop (Windows, macOS, Linux) from the same sources as the phone apps. Runs on the desktop branch, its
# pull requests and the upstream sync branches; the Android release workflow (immuch360-release.yml) is not touched.
#
# Jobs:
#   codegen        the generated Dart once for every job (Windows and macOS need neither Java nor node), with the
#                  archive of the sources of libsmb2 that every build carries, and the version numbers of the desktop
#                  builds (.github/desktop/desktop_version.py)
#   gates          the checks that keep the phones as they are and the desktop code in its place, without Flutter
#   test           analyze, the whole mobile suite (test/desktop included) and the Android and iOS plugin lists
#   linux          the Linux build on the oldest supported Ubuntu (for its glibc), with libsmb2 built there too from
#                  the archive of its sources, the video tests on the system's libmpv, its .deb and .rpm (nFPM), and the
#                  build playing a video on a virtual screen (Xvfb)
#   linux-packages each package installed in a clean container of a distribution, its libraries checked, and the
#                  installed app playing a video there
#   macos          the macOS build (universal, unsigned), the app zipped and in a DMG, its document types checked with
#                  Launch Services, libmpv and its notices checked in the app, and a self check of the app on the
#                  runner (a folder and a video on the command line, the keychain, five seconds of libmpv)
#   windows        desktop tests on a real Windows, the release build, the ZIP and the installer (Inno Setup) for the
#                  owner as artifacts named Immuch360-Desktop-<label>-windows-x64.zip and -windows-x64-setup.exe
#                  (unsigned), then the desktop tests that need the DLLs of that build (libmpv, ANGLE)
#   packages       the seven files of the build (the six packages and the libsmb2 sources) together with their
#                  SHA-256, as a release gets them
#   upstream-sync  on upstream-sync/* branches, next to the test and linux jobs: the sync checklist of design 8.4
#                  point 7 in the run summary. An upstream sync reaches the desktop branch through the phone branch;
#                  an upstream-sync/* branch is made from the desktop branch to see the effect of a sync before it lands.
#
# Every package file is an artifact of its own, named Immuch360-Desktop-<label>-<system>.<extension>; the label comes
# from .github/desktop/desktop_version.py. On a desktop-v* tag, immuch360-desktop-release.yml runs this workflow and
# attaches those files to the GitHub release of the tag.
#
# Runner labels and actions are pinned: windows-latest is now the Visual Studio 2026 image while the desktop builds
# with Visual Studio 2022, like the owner's PC. The workflow builds pull request code, so it reads the repository only,
# keeps no token in the checkouts and uses no secret; .github/desktop/check_workflow.py holds it to that.

on:
  push:
    branches: [desktop, 'upstream-sync/**']
    tags: ['v*']
  pull_request:
    branches: [desktop]
  workflow_dispatch:
  # immuch360-desktop-release.yml, on a desktop-v* tag; the permissions below stay read only
  workflow_call:
    outputs:
      label:
        description: The version label of the build, which names its files
        value: ${{ jobs.codegen.outputs.label }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_YES: '1'
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  codegen:
    name: Code generation and version
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      build_number: ${{ steps.version.outputs.build_number }}
      file_version: ${{ steps.version.outputs.file_version }}
      label: ${{ steps.version.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history without file contents: the fork's release tags give the desktop build number
          fetch-depth: 0
          filter: blob:none

      - name: Version numbers
        id: version
        run: python3 .github/desktop/desktop_version.py --github-output

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: false
          cache: true

      - name: Install toolchains (Flutter 3.47.2, Java 21, OpenAPI generator)
        run: |
          mise install node java "npm:@openapitools/openapi-generator-cli"
          cd mobile && mise install
          mise exec -- flutter --version

      - name: Dependencies and code generation
        run: |
          mise //mobile:install:ci
          mise //mobile:codegen

      # Every file the code generation wrote, whatever its pattern: the untracked files of lib, generated and test, and
      # the archive of the sources of libsmb2 (.github/desktop/libsmb2/pack_sources.py), an asset of dart_smb2 that every
      # job builds into the app and the linux job builds libsmb2 from
      - name: Pack the generated Dart
        working-directory: mobile
        run: |
          sources=packages/dart_smb2/libsmb2/Immuch360-libsmb2-sources.tar.gz
          [ -f "$sources" ] || { echo "::error::the code generation wrote no $sources"; exit 1; }
          echo "$sources: SHA-256 $(sha256sum "$sources" | cut -d' ' -f1)"
          { git ls-files --others -- lib generated test | grep -v '/\.dart_tool/'; echo "$sources"; } \
            > "$RUNNER_TEMP/generated-dart.txt"
          tar -cf generated-dart.tar -T "$RUNNER_TEMP/generated-dart.txt"
          echo "$(wc -l < "$RUNNER_TEMP/generated-dart.txt") generated files"

      - name: Upload the generated Dart
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-dart
          path: mobile/generated-dart.tar
          retention-days: 3
          if-no-files-found: error

  gates:
    name: Phone gates and lints
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The phone branch is needed for its merge base
          fetch-depth: 0
          filter: blob:none

      - name: Desktop packages imported under mobile/lib/desktop only
        run: python3 .github/desktop/check_desktop_imports.py

      - name: No new iOS or Android ternary
        run: python3 .github/desktop/check_platform_ternaries.py

      - name: Every platform line has a verdict in PLATFORM-AUDIT.md
        run: python3 .github/desktop/check_platform_audit.py

      - name: Every pigeon host API answered on the computers
        run: python3 .github/desktop/check_pigeon_desktop.py

      - name: This workflow pinned and without secrets
        run: python3 .github/desktop/check_workflow.py

      - name: The release workflow pinned, on desktop-v* tags only
        run: python3 .github/desktop/check_workflow.py --release

      - name: The file types of the packages, and the document types of the macOS app
        run: python3 .github/desktop/desktop_installers.py check

      # An upstream sync brings its own Android and iOS changes; everything else on the desktop branch leaves them alone
      - name: Nothing changed under mobile/android and mobile/ios, nor in the native code of the vendored packages
        if: ${{ !startsWith(github.ref, 'refs/heads/upstream-sync/') && !startsWith(github.head_ref, 'upstream-sync/') }}
        run: python3 .github/desktop/check_phone_projects.py --phone-ref origin/immuch360

      # The plugin baseline of the test job compares names only: a package of the phones moved to another version by a
      # desktop package shows here, in mobile/pubspec.lock against the phone branch
      - name: Packages of the phone builds as on the phone branch
        if: ${{ !startsWith(github.ref, 'refs/heads/upstream-sync/') && !startsWith(github.head_ref, 'upstream-sync/') }}
        run: python3 .github/desktop/check_phone_packages.py --phone-ref origin/immuch360

  test:
    name: Analyze, mobile suite, plugin baseline
    runs-on: ubuntu-24.04
    needs: codegen
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: false
          cache: true

      - name: Install Flutter
        run: cd mobile && mise install

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-dart
          path: mobile

      - name: Flutter dependencies
        working-directory: mobile
        run: |
          tar -xf generated-dart.tar && rm generated-dart.tar
          mise exec -- flutter pub get --enforce-lockfile

      - name: Android and iOS plugin lists equal the baseline
        run: python3 .github/desktop/check_plugin_baseline.py

      - name: Analyze
        working-directory: mobile
        run: mise exec -- flutter analyze

      # Upstream checks the format of lib; the desktop files follow the same rule, the shared files keep upstream's state
      - name: Desktop files formatted
        working-directory: mobile
        run: |
          mise exec -- dart format --output=none --set-exit-if-changed lib/desktop lib/main_desktop.dart \
            test/desktop integration_test/desktop_smoke_test.dart packages/flutter_secure_storage_windows

      # The whole suite: the phone regression gate, test/desktop included
      - name: Tests
        working-directory: mobile
        run: mise exec -- flutter test

  linux:
    name: Linux build
    runs-on: ubuntu-22.04
    needs: codegen
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The list of the Flutter Linux setup (clang, CMake, Ninja, GTK, liblzma, libstdc++ 12 for the clang of 22.04),
      # libsecret for flutter_secure_storage_linux, WebKitGTK 4.1 and libsoup 3 for desktop_webview_window (the OAuth
      # window of flutter_web_auth_2), patchelf for the RUNPATH of the libraries in the .deb and the .rpm, the headers
      # of libmpv for media_kit_video (libmpv-dev, which brings libmpv1, the libmpv of Ubuntu 22.04, for the video tests
      # and the start below; the app links none: mobile/packages/media_kit_video/IMMUCH360-NOTE.md, patch 8), and the
      # virtual screen of that start with its captures (Xvfb, xwd, ImageMagick), sqlite3 to read the app's log, and gdb
      # and xwininfo to tell what a start that does not get on was doing
      - name: Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev patchelf libmpv-dev xvfb xauth x11-apps \
            x11-utils imagemagick sqlite3 gdb

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: false
          cache: true

      - name: Install Flutter
        run: cd mobile && mise install

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-dart
          path: mobile

      - name: Generated files
        working-directory: mobile
        run: tar -xf generated-dart.tar && rm generated-dart.tar

      # dart_smb2 downloads a libsmb2.so built on glibc 2.38, which Ubuntu 22.04 and Debian 12 do not have: the same
      # sources are built here on 22.04 and bundled instead (mobile/packages/dart_smb2/IMMUCH360-NOTE.md). libsmb2 is
      # under the LGPL: the script builds it offline from the archive of its sources that the code generation packed,
      # the asset every build of the app carries, and checks the exported functions against the release's library and
      # the glibc it asks for. The same archive is a file of every release
      - name: libsmb2 built on Ubuntu 22.04 from the archive of its sources
        id: libsmb2
        env:
          LABEL: ${{ needs.codegen.outputs.label }}
        run: |
          asset=mobile/packages/dart_smb2/libsmb2/Immuch360-libsmb2-sources.tar.gz
          bash .github/desktop/libsmb2/build_linux.sh "$RUNNER_TEMP/libsmb2" "$asset"
          sources="$RUNNER_TEMP/libsmb2-sources/Immuch360-Desktop-$LABEL-libsmb2-sources.tar.gz"
          mkdir -p "$(dirname "$sources")"
          cp "$asset" "$sources"
          echo "sources=$sources" >> "$GITHUB_OUTPUT"

      - name: Upload the libsmb2 sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.libsmb2.outputs.sources }}
          archive: false
          retention-days: 14
          if-no-files-found: error

      - name: Build
        working-directory: mobile
        env:
          BUILD_NUMBER: ${{ needs.codegen.outputs.build_number }}
          IMMUCH360_LIBSMB2: ${{ runner.temp }}/libsmb2/libsmb2.so
        run: |
          mise exec -- flutter pub get --enforce-lockfile
          mise exec -- flutter build linux --release -t lib/main_desktop.dart --build-number "$BUILD_NUMBER"

      # nFPM, one static program pinned by its version and its SHA-256, makes both packages from one description; the
      # libraries the ELF files of the bundle link are listed first, for the dependencies the packages declare
      - name: Packages (.deb and .rpm)
        id: packages
        env:
          LABEL: ${{ needs.codegen.outputs.label }}
          NFPM_VERSION: '2.47.0'
          NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
        run: |
          bundle=mobile/build/linux/x64/release/bundle
          for file in "$bundle/immuch360" "$bundle"/lib/*.so*; do objdump -p "$file" | awk '/NEEDED/ {print $2}'; done \
            | sort | uniq -c
          curl -sSfL -o "$RUNNER_TEMP/nfpm.tar.gz" \
            "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "$NFPM_SHA256  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP" nfpm
          python3 .github/desktop/desktop_installers.py linux --bundle "$bundle" --label "$LABEL" --out dist \
            --nfpm "$RUNNER_TEMP/nfpm"
          echo "deb=dist/Immuch360-Desktop-$LABEL-linux-amd64.deb" >> "$GITHUB_OUTPUT"
          echo "rpm=dist/Immuch360-Desktop-$LABEL-linux-x86_64.rpm" >> "$GITHUB_OUTPUT"

      # libsmb2 (dart_smb2, LGPL-2.1-or-later) in the .deb as a user installs it: the library, the notice and the LGPL
      # in the copyright file, and the assets of the package with the archive of its sources, byte for byte the release
      # file
      - name: libsmb2, its notice and its sources in the .deb
        env:
          DEB: ${{ steps.packages.outputs.deb }}
          SOURCES: ${{ steps.libsmb2.outputs.sources }}
        run: |
          dpkg-deb --fsys-tarfile "$DEB" > "$RUNNER_TEMP/deb.tar"
          tar -tf "$RUNNER_TEMP/deb.tar" > "$RUNNER_TEMP/deb.txt"
          assets=./opt/immuch360/data/flutter_assets/packages/dart_smb2/libsmb2
          for file in ./opt/immuch360/lib/libsmb2.so "$assets/NOTICE" "$assets/COPYING" "$assets/LICENCE-LGPL-2.1.txt" \
            "$assets/Immuch360-libsmb2-sources.tar.gz"; do
            grep -qxF "$file" "$RUNNER_TEMP/deb.txt" || { echo "::error::no $file in the .deb"; exit 1; }
          done
          tar -xOf "$RUNNER_TEMP/deb.tar" "$assets/Immuch360-libsmb2-sources.tar.gz" | cmp - "$SOURCES" \
            || { echo "::error::the libsmb2 sources in the .deb are not the release file"; exit 1; }
          tar -xOf "$RUNNER_TEMP/deb.tar" ./usr/share/doc/immuch360/copyright > "$RUNNER_TEMP/copyright"
          grep -q '^License: LGPL-2.1-or-later' "$RUNNER_TEMP/copyright" \
            || { echo "::error::no libsmb2 section in the copyright file of the .deb"; exit 1; }
          echo "the .deb holds libsmb2.so, its notice and licence texts, and the sources"
          sha256sum "$SOURCES"

      - name: Upload the .deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.packages.outputs.deb }}
          archive: false
          retention-days: 14
          if-no-files-found: error

      - name: Upload the .rpm
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.packages.outputs.rpm }}
          archive: false
          retention-days: 14
          if-no-files-found: error

      # The tests of test/desktop that need a real libmpv, skipped by the test job (no libmpv there), here with the
      # libmpv1 of Ubuntu 22.04, the oldest the packages accept (libmpv_for_tests.dart): FFmpeg's answer to a camera's
      # Digest challenge (the Tapo live view), the references a file may not open, the app's player on a path and
      # through the media bridge (the folders, the shares and the server)
      - name: Desktop tests on the system's libmpv
        working-directory: mobile
        run: |
          mise exec -- flutter test test/desktop/video/camera_live_libmpv_test.dart \
            test/desktop/video/mpv_references_test.dart test/desktop/video/desktop_player_libmpv_test.dart

      # The release build started with a 6 second clip as a file opened with the program, on a virtual screen with
      # software rendering: the app must still run, the picture must change over 5 seconds of playback and the app's
      # log must hold no error of its players (packaging/linux/video_smoke.sh); the captures are an artifact. Run after a
      # failed test above too, once the packages are made
      - name: A video played on a virtual screen
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" sh .github/desktop/packaging/linux/video_smoke.sh \
            mobile/build/linux/x64/release/bundle/immuch360 "$PWD/mobile/test/fixtures/video/flat-6s.mp4" video-smoke

      - name: Upload the video start
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-video-smoke
          path: video-smoke/
          retention-days: 14
          if-no-files-found: ignore

  # Each package installed as a user would install it, in a clean container: the package manager brings the
  # dependencies the package declares, then every library the ELF files need must be found, libmpv and libsmb2 among
  # them, the desktop entry must be valid, the MIME types of the raw camera files registered, and the installed app
  # must play a short video on a virtual screen with the distribution's libmpv (check_package.sh --video). The oldest
  # and newest Ubuntu LTS, Debian stable, Fedora 40 and the newest Fedora.
  # The packages are checked once uploaded, even when a later step of the linux job failed (its tests, its video start)
  linux-packages:
    name: Linux package on ${{ matrix.image }}
    runs-on: ubuntu-24.04
    needs: linux
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            package: deb
            slug: ubuntu-22.04
          - image: ubuntu:24.04
            package: deb
            slug: ubuntu-24.04
          - image: debian:12
            package: deb
            slug: debian-12
          - image: fedora:40
            package: rpm
            slug: fedora-40
          - image: fedora:44
            package: rpm
            slug: fedora-44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Immuch360-Desktop-*-linux-*
          merge-multiple: true
          # Each artifact is one file uploaded as it is: kept whole, the two ZIPs too, under its own name
          skip-decompress: true
          path: dist

      - name: Install and check
        env:
          IMAGE: ${{ matrix.image }}
          PACKAGE: ${{ matrix.package }}
        run: |
          file=$(cd dist && ls ./*."$PACKAGE")
          mkdir -p video-smoke
          docker run --rm -v "$PWD/dist:/pkgs:ro" -v "$PWD/.github/desktop/packaging/linux:/check:ro" \
            -v "$PWD/mobile/test/fixtures/video:/clips:ro" -v "$PWD/video-smoke:/out" "$IMAGE" \
            sh /check/check_package.sh "/pkgs/${file#./}" --video /clips/flat-6s.mp4 /out

      - name: Upload the video start
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-video-smoke-${{ matrix.slug }}
          path: video-smoke/
          retention-days: 14
          if-no-files-found: ignore

  windows:
    name: Windows desktop tests, build and ZIP
    runs-on: windows-2022
    needs: codegen
    if: github.event_name != 'push' || github.ref == 'refs/heads/desktop' || startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise's Flutter package (aqua) names the Unix launchers bin/flutter and bin/dart, while a Windows host runs
      # bin\flutter.bat: the same version through the Flutter action, kept equal to mobile/mise.toml by check_workflow.py
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          flutter --version
          flutter doctor -v
          python --version

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-dart
          path: mobile

      # The build hook of upstream's native core (native/native_core) compiles its Rust in every flutter test and build
      # here. The toolchain of rust-toolchain.toml with the runner's own target only, named for the hook through
      # RUSTUP_TOOLCHAIN as mise does on the other jobs, so that rustup does not add the twelve targets of the file; a
      # runner without rustup fails here rather than in the middle of the tests
      - name: Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' native/crates/native_core_ffi/rust-toolchain.toml)
          rustup --version
          rustup toolchain install "$channel" --profile minimal --target x86_64-pc-windows-msvc
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"

      - name: Flutter dependencies
        working-directory: mobile
        run: |
          tar -xf generated-dart.tar && rm generated-dart.tar
          flutter pub get --enforce-lockfile

      - name: Desktop tests on Windows (paths, file locking, DPAPI, the CI scripts)
        working-directory: mobile
        run: flutter test test/desktop

      - name: Build
        working-directory: mobile
        env:
          BUILD_NUMBER: ${{ needs.codegen.outputs.build_number }}
        run: flutter build windows --release -t lib/main_desktop.dart --build-number "$BUILD_NUMBER"

      # The Release folder plus the Visual C++ runtime, without dartjni.dll, each DLL import checked against what a
      # clean Windows has, and the file version of the executable checked; the debug symbols, if the build made any,
      # apart
      - name: Folder and ZIP
        id: bundle
        env:
          LABEL: ${{ needs.codegen.outputs.label }}
          FILE_VERSION: ${{ needs.codegen.outputs.file_version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          zip="dist/Immuch360-Desktop-$LABEL-windows-x64.zip"
          python .github/desktop/windows_bundle.py --release mobile/build/windows/x64/runner/Release --out dist \
            --zip "$zip" --symbols dist/symbols --file-version "$FILE_VERSION" --info "version=$LABEL" \
            --info "file version=$FILE_VERSION" --info "commit=$GITHUB_SHA" --info "built by=$RUN_URL"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      # libsmb2 (dart_smb2, LGPL-2.1-or-later) in the ZIP as a user unzips it: the DLL, its notice and licence texts in
      # licenses/libsmb2, and the assets of the package with the archive of its sources, byte for byte the asset packed
      # by the code generation, the release file of the linux job
      - name: libsmb2, its notice and its sources in the ZIP
        env:
          ZIP: ${{ steps.bundle.outputs.zip }}
        run: |
          python - "$ZIP" mobile/packages/dart_smb2/libsmb2/Immuch360-libsmb2-sources.tar.gz <<'PY'
          import hashlib, pathlib, sys, zipfile
          archive, sources = sys.argv[1], pathlib.Path(sys.argv[2])
          top = 'Immuch360 Desktop/'
          assets = top + 'data/flutter_assets/packages/dart_smb2/libsmb2/'
          wanted = [top + 'libsmb2.dll'] + [folder + name for folder in (top + 'licenses/libsmb2/', assets)
                                            for name in ('NOTICE', 'COPYING', 'LICENCE-LGPL-2.1.txt')]
          wanted.append(assets + 'Immuch360-libsmb2-sources.tar.gz')
          with zipfile.ZipFile(archive) as bundle:
              names = set(bundle.namelist())
              missing = [name for name in wanted if name not in names]
              if missing:
                  sys.exit('::error::not in the ZIP: ' + ', '.join(missing))
              packed = bundle.read(assets + 'Immuch360-libsmb2-sources.tar.gz')
          if packed != sources.read_bytes():
              sys.exit('::error::the libsmb2 sources in the ZIP are not the archive packed')
          print('the ZIP holds libsmb2.dll, its notice and licence texts, and the sources')
          print(hashlib.sha256(packed).hexdigest())
          PY

      # The installer of the same folder as the ZIP (Inno Setup 6 of the runner image): for one user or for every
      # user of the PC, "Open with" for the types of .github/desktop/file-associations.json, an uninstaller
      - name: Installer
        id: installer
        env:
          LABEL: ${{ needs.codegen.outputs.label }}
          FILE_VERSION: ${{ needs.codegen.outputs.file_version }}
        run: |
          python .github/desktop/desktop_installers.py windows --bundle "dist/Immuch360 Desktop" --label "$LABEL" \
            --file-version "$FILE_VERSION" --out dist
          setup="dist/Immuch360-Desktop-$LABEL-windows-x64-setup.exe"
          echo "setup=$setup" >> "$GITHUB_OUTPUT"
          zip="${{ steps.bundle.outputs.zip }}"
          {
            echo "### Immuch360 Desktop for Windows x64"
            echo
            echo "| File | Size | SHA-256 |"
            echo "|---|---|---|"
            for file in "$setup" "$zip"; do
              echo "| \`$(basename "$file")\` | $(( $(stat -c %s "$file") / 1048576 )) MB | \`$(sha256sum "$file" | cut -d' ' -f1)\` |"
            done
            echo
            echo "File version $FILE_VERSION. Unsigned build: SmartScreen may ask for a confirmation, Smart App Control blocks it."
          } >> "$GITHUB_STEP_SUMMARY"

      # Uploaded as they are, so that the download is the file itself and not a ZIP around it
      - name: Upload the ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.bundle.outputs.zip }}
          archive: false
          retention-days: 14
          if-no-files-found: error

      - name: Upload the installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.installer.outputs.setup }}
          archive: false
          retention-days: 14
          if-no-files-found: error

      - name: Upload the debug symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: immuch360-desktop-windows-x64-symbols
          path: dist/symbols/
          retention-days: 14
          if-no-files-found: ignore

      # The desktop tests of the first step skip what needs the DLLs of a build (libmpv, ANGLE, the decoder probe),
      # which did not exist yet. Run here on the build itself, after the ZIP was made from it, so that the libmpv the
      # ZIP ships is the one checked: FFmpeg's answer to a camera's Digest challenge with the percent-encoded account,
      # no account or rtsp:// address in mpv's lines (camera_live_libmpv_test), the references a file may not open
      # (mpv_references_test), the app's player on a path and through the media bridge (desktop_player_libmpv_test),
      # the GLSL of renderer C compiled and drawn by ANGLE (plugin_shaders_windows_test: the hosted runners have no GPU,
      # so ANGLE's Direct3D 11 device is Windows' Basic Render Driver, which draws in software). The tests that need a
      # GPU's video decoder or mpv drawing into ANGLE (decoder_probe_windows_test, libmpv_probe_test) stay on the PC.
      - name: Desktop tests on the build (libmpv, ANGLE)
        working-directory: mobile
        env:
          IMMUCH360_BUILD_DIR: build/windows/x64/runner/Release
        run: |
          flutter test test/desktop/video/camera_live_libmpv_test.dart test/desktop/video/mpv_references_test.dart \
            test/desktop/video/desktop_player_libmpv_test.dart test/desktop/video/plugin_shaders_windows_test.dart

  macos:
    name: macOS build, ZIP and DMG
    runs-on: macos-15
    needs: codegen
    if: github.event_name != 'push' || github.ref == 'refs/heads/desktop' || startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 60
    env:
      # One Xcode, named here rather than the newest the image carries: the images change every week and may add a
      # beta or a release candidate, and a pinned toolchain keeps a failure of this compile check the code's (design
      # 6.6). check_workflow.py refuses an Xcode picked by a pattern.
      XCODE_VERSION: '26.3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Xcode with the macOS 26 SDK
        run: |
          # connectivity_plus 7.3 reads NWPath.isUltraConstrained (behind #available(macOS 26.0, *)), which only the
          # macOS 26 SDK declares; the default Xcode of macos-15 is 16.4, with the macOS 15.5 SDK. The image also has
          # Xcode 26: 26.0.1, 26.1.1, 26.2 and 26.3 in its readme (images/macos/macos-15-Readme.md of
          # actions/runner-images, 2026-10-10), 26.3 with the macOS 26.2 SDK.
          xcode="/Applications/Xcode_$XCODE_VERSION.app"
          if [ ! -d "$xcode" ]; then
            echo "::error::No Xcode $XCODE_VERSION on this runner image: set XCODE_VERSION to one its readme lists"
            ls /Applications | grep "^Xcode" || true
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          echo "$xcode, macOS SDK $sdk"
          if [ "${sdk%%.*}" -lt 26 ]; then
            echo "::error::$xcode has the macOS $sdk SDK, not 26 or later"
            exit 1
          fi

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: false
          cache: true

      - name: Install Flutter
        run: cd mobile && mise install

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-dart
          path: mobile

      # The build hook of upstream's native core (native/native_core) compiles its Rust for each slice of the release
      # build, arm64 and x86_64. mise sets RUSTUP_TOOLCHAIN, so rustup ignores the targets of rust-toolchain.toml, and
      # the hook adds a target for Android and iOS only: the slice that is not the runner's own needs its target here.
      - name: Rust targets of the macOS slices
        working-directory: mobile
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' ../native/crates/native_core_ffi/rust-toolchain.toml)
          mise exec -- rustup target add --toolchain "$channel" aarch64-apple-darwin x86_64-apple-darwin

      - name: Build without signing
        working-directory: mobile
        env:
          BUILD_NUMBER: ${{ needs.codegen.outputs.build_number }}
        run: |
          tar -xf generated-dart.tar && rm generated-dart.tar
          mise exec -- flutter pub get --enforce-lockfile
          mise exec -- flutter build macos --release -t lib/main_desktop.dart --build-number "$BUILD_NUMBER"

      # The app as Flutter builds it: universal, signed for the computer that runs it only ("Sign to Run Locally", no
      # Apple certificate) and not notarized, so macOS asks for a confirmation at the first start. Zipped with ditto,
      # which keeps the attributes of the bundle, and in a DMG with a link to the Applications folder
      - name: ZIP and DMG
        id: app
        env:
          LABEL: ${{ needs.codegen.outputs.label }}
        run: |
          app="mobile/build/macos/Build/Products/Release/Immuch360 Desktop.app"
          plutil -lint "$app/Contents/Info.plist"
          echo "architectures: $(lipo -archs "$app/Contents/MacOS/Immuch360 Desktop")"
          codesign -dv "$app" 2>&1 | grep -E '^(Identifier|Format|Signature|TeamIdentifier)=' || true
          python3 -c 'import plistlib, sys; d = plistlib.load(open(sys.argv[1], "rb")); print(len(d["CFBundleDocumentTypes"]), "document types,", len(d["UTImportedTypeDeclarations"]), "imported types")' "$app/Contents/Info.plist"
          mkdir -p dist "$RUNNER_TEMP/dmg"
          zip="dist/Immuch360-Desktop-$LABEL-macos.zip"
          dmg="dist/Immuch360-Desktop-$LABEL-macos.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"
          cp -R "$app" "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname "Immuch360 Desktop" -srcfolder "$RUNNER_TEMP/dmg" -fs HFS+ -format UDZO -ov "$dmg"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          {
            echo "### Immuch360 Desktop for macOS (universal, unsigned, not notarized)"
            echo
            echo "| File | Size | SHA-256 |"
            echo "|---|---|---|"
            for file in "$dmg" "$zip"; do
              echo "| \`$(basename "$file")\` | $(( $(stat -f %z "$file") / 1048576 )) MB | \`$(shasum -a 256 "$file" | cut -d' ' -f1)\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Finder's "Open with" asks Launch Services which apps open a file: once registered, the app must be offered
      # for every type of .github/desktop/file-associations.json (CFBundleDocumentTypes of mobile/macos/Runner/Info.plist)
      - name: Open with, as Launch Services answers it
        run: |
          app="$PWD/mobile/build/macos/Build/Products/Release/Immuch360 Desktop.app"
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$app"
          read -ra extensions <<< "$(python3 -c 'import json; d = json.load(open(".github/desktop/file-associations.json")); print(" ".join([*d["photos"], *d["videos"]]))')"
          swift .github/desktop/packaging/macos/open_with.swift "$app" "${extensions[@]}"

      # The libraries of the video player in the app: Mpv.framework and the others (media_kit_libs_macos_video, the
      # fork's libmpv build), each with an @rpath name and no path of the machine that built them, and their licence
      # texts in the resource bundle of that package
      - name: libmpv in the app
        run: |
          app="mobile/build/macos/Build/Products/Release/Immuch360 Desktop.app"
          ls "$app/Contents/Frameworks"
          mpv="$app/Contents/Frameworks/Mpv.framework/Mpv"
          [ -f "$mpv" ] || { echo "::error::no Mpv.framework in the app"; exit 1; }
          echo "Mpv: $(lipo -archs "$mpv"), minimum macOS $(vtool -show-build "$mpv" | awk '/minos/ {print $2; exit}')"
          otool -L "$mpv"
          for framework in "$app"/Contents/Frameworks/*.framework; do
            otool -L "$framework/$(basename "$framework" .framework)"
          done > "$RUNNER_TEMP/frameworks.txt"
          if grep -E '^[[:space:]]+/(nix|Users|private|tmp)/' "$RUNNER_TEMP/frameworks.txt"; then
            echo "::error::a framework of the app names a library by a path of the build machine"
            exit 1
          fi
          notices=$(find "$app/Contents/Resources" -path '*media_kit_libs_macos_video*' -name NOTICES.md | head -n 1)
          [ -n "$notices" ] || { echo "::error::no NOTICES.md of the video libraries in the app"; exit 1; }
          echo "notices: ${notices#"$app/"}"
          ls "$(dirname "$notices")"

      # libsmb2 (dart_smb2, LGPL-2.1-or-later) in the app with its notice and licence texts and the archive of its
      # sources, assets of the package (mobile/packages/dart_smb2/libsmb2) that the licence page of the app shows. The
      # sources are packed again on this Mac, as Codemagic packs them for the iOS build: the files must be the same
      - name: libsmb2, its licence and its sources in the app
        run: |
          app="mobile/build/macos/Build/Products/Release/Immuch360 Desktop.app"
          sources=mobile/packages/dart_smb2/libsmb2/Immuch360-libsmb2-sources.tar.gz
          [ -d "$app/Contents/Frameworks/libsmb2.framework" ] || { echo "::error::no libsmb2.framework in the app"; exit 1; }
          texts="$app/Contents/Frameworks/App.framework/Resources/flutter_assets/packages/dart_smb2/libsmb2"
          for name in NOTICE COPYING LICENCE-LGPL-2.1.txt Immuch360-libsmb2-sources.tar.gz; do
            [ -f "$texts/$name" ] || { echo "::error::no $name of libsmb2 in the app"; exit 1; }
          done
          cmp "$texts/Immuch360-libsmb2-sources.tar.gz" "$sources" \
            || { echo "::error::the libsmb2 sources in the app are not the archive packed"; exit 1; }
          ls -l "$texts"
          python3 .github/desktop/libsmb2/pack_sources.py "$RUNNER_TEMP/packed-on-macos.tar.gz"
          if cmp -s "$RUNNER_TEMP/packed-on-macos.tar.gz" "$sources"; then
            echo "packed on macOS: the same file"
          elif [ "$(gzip -dc "$RUNNER_TEMP/packed-on-macos.tar.gz" | shasum -a 256)" = \
            "$(gzip -dc "$sources" | shasum -a 256)" ]; then
            echo "::notice::packed on macOS: the same tar, compressed to other bytes by the zlib of this Mac"
          else
            echo "::error::the sources packed on macOS differ from those packed on Linux"
            exit 1
          fi

      # Nobody on the project has a Mac: the runner starts the app three times, without a server, with what a user would
      # give it, and with the self check of lib/desktop/window/self_check.dart (IMMUCH360_SELF_CHECK), which writes
      # what it found to a JSON file. First the folder of a photo and a video made here (make_test_media.swift) on the
      # command line, with the secure storage written and read back and the video played five seconds by libmpv; then
      # the video alone, which opens in the viewer; then the photo the way the Finder opens a file ("Open with", a
      # double click): Launch Services starts the app and hands the photo over by an Apple event
      # (AppDelegate.application(_:open:)), after which the video is handed to the copy that runs. A capture of the
      # screen each time. The window server of a runner is not a Mac on a desk: the next step says what passed
      - name: Self check on the runner
        id: self_check
        continue-on-error: true
        run: |
          app="$PWD/mobile/build/macos/Build/Products/Release/Immuch360 Desktop.app"
          exe="$app/Contents/MacOS/Immuch360 Desktop"
          out="$PWD/first-start"
          media="$RUNNER_TEMP/Immuch360 test media"
          mkdir -p "$out"
          swift .github/desktop/packaging/macos/make_test_media.swift "$media" 12
          security list-keychains -d user || true
          security show-keychain-info login.keychain 2>&1 || true

          # Starts the app with the arguments given, waits for its report (at most 150 s), captures the screen
          run_app() {
            local name=$1
            shift
            rm -f "$out/$name.json" "$out/$name.json.partial"
            IMMUCH360_SELF_CHECK="$out/$name.json" "$exe" "$@" > "$out/$name.log" 2>&1 &
            local pid=$!
            for _ in $(seq 1 150); do
              [ -s "$out/$name.json" ] && break
              kill -0 "$pid" 2>/dev/null || break
              sleep 1
            done
            sleep 3
            screencapture -x "$out/$name.png" || echo "no screen capture"
            if [ "$name" = video ]; then
              sleep 2
              screencapture -x "$out/$name-2s-later.png" || true
            fi
            if kill -0 "$pid" 2>/dev/null; then
              echo "$name: still running" > "$out/$name.state"
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            else
              local status=0
              wait "$pid" || status=$?
              echo "$name: ended by itself (exit $status)" > "$out/$name.state"
            fi
            cat "$out/$name.state"
            tail -n 40 "$out/$name.log"
          }

          # The start of the earlier first start, without arguments and without the self check: 30 s, then a capture
          "$exe" > "$out/plain.log" 2>&1 &
          pid=$!
          sleep 30
          screencapture -x "$out/plain.png" || echo "no screen capture"
          if kill -0 "$pid" 2>/dev/null; then
            echo "plain: still running after 30 seconds" > "$out/plain.state"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          else
            status=0
            wait "$pid" || status=$?
            echo "plain: ended by itself within 30 seconds (exit $status)" > "$out/plain.state"
          fi
          cat "$out/plain.state"

          IMMUCH360_SELF_CHECK_VIDEO="$media/test-video.mp4" run_app folder "$media"
          run_app video "$media/test-video.mp4"

          # The Finder's way. open waits for the start only; the copy that runs is found by its executable path
          rm -f "$out/finder.json" "$out/finder.json.partial" "$out/finder.json.later"
          if open -a "$app" --env "IMMUCH360_SELF_CHECK=$out/finder.json" --stdout "$out/finder.log" \
            --stderr "$out/finder.log" "$media/test-photo.jpg"; then
            for _ in $(seq 1 150); do
              [ -s "$out/finder.json" ] && break
              sleep 1
            done
            sleep 3
            screencapture -x "$out/finder.png" || echo "no screen capture"
            open -a "$app" "$media/test-video.mp4" || echo "open could not hand the video over"
            sleep 8
            screencapture -x "$out/finder-then-video.png" || true
            finder_pid=$(ps -axo pid=,command= | awk -v exe="$exe" 'index($0, exe) {print $1; exit}')
            if [ -n "$finder_pid" ]; then
              echo "finder: still running" > "$out/finder.state"
              kill "$finder_pid" 2>/dev/null || true
            else
              echo "finder: ended by itself" > "$out/finder.state"
            fi
          else
            echo "finder: open did not start the app" > "$out/finder.state"
          fi
          cat "$out/finder.state"
          tail -n 40 "$out/finder.log" 2>/dev/null || true
          cp "$media/test-photo.jpg" "$out/"
          # The crash reports macOS wrote meanwhile, if any (ReportCrash writes them a few seconds after the crash)
          sleep 10
          find "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports -name 'Immuch360*' \
            -exec cp {} "$out/" \; 2>/dev/null || true
          ls "$out"

      - name: What the self check found
        if: always()
        continue-on-error: true
        # pipefail: a failed check marks this step, the job stays green (continue-on-error)
        run: |
          set -o pipefail
          python3 .github/desktop/packaging/macos/self_check_summary.py first-start --strict | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the macOS ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.app.outputs.zip }}
          archive: false
          retention-days: 14
          if-no-files-found: error

      - name: Upload the DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.app.outputs.dmg }}
          archive: false
          retention-days: 14
          if-no-files-found: error

      - name: Upload the first start
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-first-start
          path: first-start/
          retention-days: 14
          if-no-files-found: ignore

  # The seven files of the build in one place with their SHA-256, as immuch360-desktop-release.yml attaches them to a
  # release: a file missing or added shows on every run, not on the day of a release
  packages:
    name: Package files and checksums
    runs-on: ubuntu-24.04
    needs: [codegen, linux, macos, windows]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Immuch360-Desktop-*
          merge-multiple: true
          # Each artifact is one file uploaded as it is: kept whole, the two ZIPs too, under its own name
          skip-decompress: true
          path: release

      - name: Files and SHA-256
        env:
          LABEL: ${{ needs.codegen.outputs.label }}
        run: |
          python3 .github/desktop/desktop_release.py --dry-run --label "$LABEL" --sums release/SHA256SUMS.txt release/*
          {
            echo "### The files of a release"
            echo
            echo '```'
            cat release/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # An upstream change of a pigeon contract, of main.dart or of the HTTP clients shows on the day of the merge: the
  # test and linux jobs of the same run analyze, test and build the sync; this job adds what to read by hand
  upstream-sync:
    name: Upstream sync checklist
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/heads/upstream-sync/')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The desktop branch is needed for its merge base
          fetch-depth: 0
          filter: blob:none

      - name: Sync checklist (in the run summary)
        run: python3 .github/desktop/upstream_sync_report.py --base origin/desktop --summary "$GITHUB_STEP_SUMMARY"
