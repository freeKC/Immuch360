name: Immuch360 Android release

# Builds the signed Android APKs of the fork and attaches them to a GitHub Release.
# Triggered by pushing a tag like v3.3.0-1, or manually.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build and sign Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: true

      - name: Install toolchains (Flutter 3.47.2, Java 21, OpenAPI generator)
        env:
          MISE_YES: '1'
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: |
          mise install node java "npm:@openapitools/openapi-generator-cli"
          cd mobile && mise install
          mise exec -- flutter --version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # ndk: the NDK of Flutter 3.47.2 (flutter.ndkVersion in mobile/android/app/build.gradle), installed here so
          # that Gradle does not download it on every build and the build hooks get the same one (next step)
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'

      - name: Same NDK for the build hooks and Gradle
        # The Flutter tool hands the NDK of ANDROID_NDK_HOME to the build hooks (the Rust core), not Gradle's
        # ndkVersion. The runner image points it at NDK 27, whose linker aligns 64 bit libraries on 4 KB, which Google
        # Play refuses (native/.cargo/config.toml forces 16 KB as well). Keep this version equal to flutter.ndkVersion.
        run: |
          ndk="$ANDROID_HOME/ndk/28.2.13676358"
          test -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          { echo "ANDROID_NDK_HOME=$ndk"; echo "ANDROID_NDK_ROOT=$ndk"; echo "ANDROID_NDK=$ndk"; } >> "$GITHUB_ENV"

      - name: Flutter dependencies and code generation
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: |
          mise //mobile:install:ci
          mise //mobile:codegen

      - name: Release keystore
        env:
          KEY_JKS: ${{ secrets.KEY_JKS }}
        run: printf '%s' "$KEY_JKS" | base64 -d > mobile/android/key.jks

      - name: Build APKs
        working-directory: mobile
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
          ALIAS: ${{ secrets.ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          # Android version code from the release tag v<version>-<build>: 3029998 + build, one code per tag
          # (the stores refuse a version code already used; pubspec.yaml is only the fallback for manual runs)
          BUILD_NUMBER=""
          if [[ "${GITHUB_REF_NAME}" =~ ^v.*-([0-9]+)$ ]]; then
            BUILD_NUMBER="--build-number=$((3029998 + ${BASH_REMATCH[1]}))"
            echo "Android version code ${BUILD_NUMBER#--build-number=} for tag ${GITHUB_REF_NAME}"
          fi
          mise exec -- flutter build apk --release --flavor phone $BUILD_NUMBER
          mise exec -- flutter build apk --release --flavor phone --split-per-abi --target-platform android-arm,android-arm64,android-x64 $BUILD_NUMBER
          mise exec -- flutter build appbundle --release --flavor phone $BUILD_NUMBER
          mise exec -- flutter build apk --release --flavor quest --target-platform android-arm64 --android-project-arg arm64only=true $BUILD_NUMBER
          ls -la build/app/outputs/flutter-apk/ build/app/outputs/bundle/phoneRelease/

      - name: 16 KB page size check
        # Google Play refuses an app targeting Android 15 or later when a 64 bit native library has LOAD segments
        # aligned below 16 KB or the APK is not zip aligned for 16 KB pages; fail here rather than at the upload
        working-directory: mobile
        run: |
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign" bash scripts/check_16kb.sh \
            build/app/outputs/flutter-apk/app-phone-release.apk \
            build/app/outputs/flutter-apk/app-arm64-v8a-phone-release.apk \
            build/app/outputs/flutter-apk/app-x86_64-phone-release.apk \
            build/app/outputs/bundle/phoneRelease/app-phone-release.aab \
            build/app/outputs/flutter-apk/app-quest-release.apk

      - name: Rename APKs
        run: |
          cd mobile/build/app/outputs/flutter-apk
          # Flutter names the flavour builds app-phone-release.apk (universal) and app-<abi>-phone-release.apk (split)
          mv app-phone-release.apk "Immuch360-${GITHUB_REF_NAME}-release.apk"
          for f in app-*-phone-release.apk; do abi="${f#app-}"; abi="${abi%-phone-release.apk}"; mv "$f" "Immuch360-${GITHUB_REF_NAME}-${abi}-release.apk"; done
          mv app-quest-release.apk "Immuch360-${GITHUB_REF_NAME}-quest-release.apk"
          mv ../bundle/phoneRelease/app-phone-release.aab "Immuch360-${GITHUB_REF_NAME}.aab"
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            mobile/build/app/outputs/flutter-apk/Immuch360-*.apk
            mobile/build/app/outputs/flutter-apk/Immuch360-*.aab

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile/build/app/outputs/flutter-apk/Immuch360-*.apk
            mobile/build/app/outputs/flutter-apk/Immuch360-*.aab
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'preview') }}
