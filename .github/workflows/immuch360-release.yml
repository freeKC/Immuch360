name: Immuch360 Android release

# Builds the signed Android APKs of the fork and attaches them to a GitHub Release.
# Triggered by pushing a tag like v3.3.0-1, or manually.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build and sign Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: true

      - name: Install toolchains (Flutter 3.47.2, Java 21, OpenAPI generator)
        env:
          MISE_YES: '1'
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: |
          mise install node java "npm:@openapitools/openapi-generator-cli"
          cd mobile && mise install
          mise exec -- flutter --version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Flutter dependencies and code generation
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: |
          mise //mobile:install:ci
          mise //mobile:codegen

      - name: Release keystore
        env:
          KEY_JKS: ${{ secrets.KEY_JKS }}
        run: printf '%s' "$KEY_JKS" | base64 -d > mobile/android/key.jks

      - name: Build APKs
        working-directory: mobile
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
          ALIAS: ${{ secrets.ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          mise exec -- flutter build apk --release
          mise exec -- flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64
          ls -la build/app/outputs/flutter-apk/

      - name: Rename APKs
        run: |
          cd mobile/build/app/outputs/flutter-apk
          for f in app-*.apk; do mv "$f" "Immuch360-${GITHUB_REF_NAME}-${f#app-}"; done
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: mobile/build/app/outputs/flutter-apk/Immuch360-*.apk

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/Immuch360-*.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'preview') }}
